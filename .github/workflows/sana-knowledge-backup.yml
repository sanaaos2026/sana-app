name: Sana knowledge backup wake-up

on:
  schedule:
    # Riyadh is UTC+3. Hourly wake-ups tolerate GitHub scheduling delays while
    # the database uniqueness constraint still permits one snapshot per day.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtain short-lived GitHub identity
        id: oidc
        env:
          AUDIENCE: https://simple-flask-run.replit.app
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["AUDIENCE"], safe=""))')")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Reconcile missing Riyadh backup dates
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --fail --silent --show-error --retry 4 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            https://simple-flask-run.replit.app/api/internal/knowledge-backups/reconcile