# nixpacks.toml — إعدادات بناء صريحة لـ Railway.
#
# لماذا هذا الملف ضروري: ميزة تصدير جواز الشركة كـ PDF تعتمد على مكتبة
# weasyprint، التي تحتاج مكتبات نظام (pango/harfbuzz/fonts) غير مثبَّتة
# افتراضيًا في صورة بايثون القياسية. بدونها، مسار /passport/.../pdf سيفشل
# بخطأ استيراد وقت الطلب (fail سيء صامت لولا هذا التوثيق).
[phases.setup]
aptPkgs = [
    "libpango-1.0-0",
    "libpangocairo-1.0-0",
    "libharfbuzz0b",
    "libfontconfig1",
    "libgdk-pixbuf2.0-0",
    "fonts-noto",
    "fonts-noto-cjk",
    "fonts-dejavu"
]

[phases.install]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 app:app"
