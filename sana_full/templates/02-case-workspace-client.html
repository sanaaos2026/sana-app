<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<script>(function(){var m=document.querySelector('meta[name="csrf-token"]'),t=m.content,F=window.fetch.bind(window);window.fetch=function(u,o){o=o||{};if(['POST','PUT','PATCH','DELETE'].includes((o.method||'GET').toUpperCase()))o.headers=Object.assign({'X-CSRFToken':t},o.headers||{});return F(u,o)}})();</script>
<meta name="color-scheme" content="light">
<title>سنع — ملف القرار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B132B;--gold:#F2B233;--teal:#0EA5A5;--paper:#F5F6FB;--line:#DEE1EC;--muted:#6E7580}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#333940;font-family:'IBM Plex Sans Arabic',sans-serif}
nav{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:28px}
nav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}nav a.active{color:var(--navy);border-bottom:2px solid var(--gold);padding:17px 0}
main{max-width:760px;margin:38px auto;padding:0 20px 60px}.eyebrow{font-size:11px;letter-spacing:1px;color:var(--teal);font-weight:700}
h1{font-size:26px;color:var(--navy);margin:8px 0 6px}.lead{color:var(--muted);font-size:14px;margin:0 0 24px}
section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px}
h2{font-size:14px;color:var(--navy);margin:0 0 12px}.item{padding:10px 0;border-bottom:1px solid #EEF0F4;font-size:13px;line-height:1.7}.item:last-child{border-bottom:0}
.meta{font-size:11px;color:var(--muted);margin-top:4px}.empty{color:var(--muted);font-size:13px}
.next{border-right:4px solid var(--gold)}.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:11px 18px;border-radius:8px;font-weight:700;font-size:13px;border:0;font-family:inherit;cursor:pointer}.field{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;margin:6px 0}.error{color:#B23A2E;font-size:12px;min-height:18px;margin-top:7px}
.state{border-right:4px solid var(--teal)}.state.warning{border-color:var(--gold)}.pill{display:inline-block;padding:3px 9px;border-radius:20px;background:#E4F7F6;color:#087e7d;font-size:10px;font-weight:700}.gate{background:#FFF9EB;border:1px solid #F1D68A;border-radius:9px;padding:12px;color:#765B00;font-size:12px;line-height:1.8}.finding{padding:12px;border:1px solid var(--line);border-radius:9px;margin-top:9px}.finding strong{color:var(--navy)}.sources{margin:7px 0 0;padding-right:18px}.reference{background:#F8F9FB}.reference .meta{color:#765B00}.deferred{background:#F5F6FB;border-radius:8px;padding:10px;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<nav>
  <a href="/home">اليوم</a>
  <a href="/case/{{ case_id }}" class="active">ملف القرار</a>
  <a href="/passport">الأصول</a>
  <a href="/logout">تسجيل الخروج</a>
</nav>
<main id="app"><p class="empty">يجري تجهيز ملف القرار...</p></main>
<script>
const CASE_ID={{ case_id|tojson }},COMPANY_ID={{ company_id|tojson }};let caseData=null;
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function rows(items, render, empty){
  return items&&items.length?items.map(render).join(''):`<p class="empty">${empty}</p>`;
}
function render(d){
  caseData=d;
  const decisions=d.decisions||[], tasks=d.tasks||[], evidence=d.evidence||[];
  const activeDecision=decisions.find(x=>x.status==='مقترح'||x.status==='معتمد')||decisions[0];
  const activeTask=tasks.find(x=>x.status!=='منجزة')||tasks[0];
  const review=d.diagnostic_review||{},journey=review.journey||{status:'NOT_RUN',label:'لم يُشغّل بعد',message:'لم تُجمع نتيجة Sana Scan بعد.',action_label:'شغّل Sana Scan'},gate=review.evidence_gate||{open:true,missing_evidence:[]};
  const scan=d.scan,scanReady=scan&&['REVIEW_REQUIRED','COMPLETE'].includes(journey.status);
  const sourceMap=Object.fromEntries((review.sources||[]).map(x=>[String(x.source_id),x]));
  const findingCard=(label,item)=>item?`<div class="finding"><strong>${label} · ${esc(item.classification||'')}</strong><div>${esc(item.statement)}</div><div class="meta">المصادر: ${(item.source_ids||[]).map(id=>{const s=sourceMap[String(id)]||{};return `${esc(id)} (${esc(s.source_type||'مصدر')} · ${esc(s.source_date||'تاريخ غير متاح')})`}).join('، ')||'لا يوجد مصدر'}</div></div>`:'';
  let action='';
  if(activeTask){action=`<a class="btn" href="/home">افتح خطوة اليوم</a>`}
  else if(activeDecision){action=`<a class="btn" href="/home">راجع القرار واعتمده</a>`}
  else if(!scan){action=`<button class="btn" onclick="runAnalysis()">حلّل الأدلة الحالية</button><div id="actionError" class="error"></div>`}
  else if(!scanReady){action=`<input id="evidenceTitle" class="field" placeholder="أضف حقيقة أو دليلًا جديدًا"><input id="sourceRef" class="field" placeholder="مرجع المصدر: ملف، تقرير، أو ملاحظة موثقة"><button class="btn" onclick="addAndAnalyze()">حفظ الدليل وإعادة التحليل</button><div id="actionError" class="error"></div>`}
  else {action=`<button class="btn" onclick="buildDecision()">إنشاء ملف قرار للمراجعة</button><div id="actionError" class="error"></div>`}
  const refs=(review.reference_knowledge||{}).references||[];
  document.getElementById('app').innerHTML=`
    <div class="eyebrow">مراجعة تشخيصية واحدة · فرصة تحسين</div>
    <h1>${esc(d.case.title||'ملف القرار')}</h1>
    <p class="lead">${esc(d.case.real_question||d.case.declared_problem||'نجمع الدليل قبل اعتماد أي قرار.')}</p>
    <section class="state ${journey.status==='INCOMPLETE'?'warning':''}"><span class="pill">${esc(journey.status)}</span><h2>${esc(journey.label)}</h2><div class="lead" style="margin:0">${esc(journey.message)}</div><div class="meta">Snapshot: ${esc((review.snapshot||{}).scan_id||'NOT_RUN')} · ${esc((review.snapshot||{}).methodology_version||'بانتظار التشغيل')}</div></section>
    <section><h2>المشكلة ← الفرضية ← الاستنتاج ← الفرصة</h2>
      <div class="item"><strong>المشكلة:</strong> ${esc((review.problem||{}).statement||d.case.declared_problem||'غير محددة')}<div class="meta">${esc((review.problem||{}).source_id||'Discovery')} · ${esc((review.problem||{}).source_date||'تاريخ غير متاح')}</div></div>
      ${findingCard('الفرضية',review.hypothesis)}
      ${findingCard('الاستنتاج',review.inference)}
      ${findingCard('الفرصة المقترحة',review.opportunity)}
    </section>
    <section><h2>بوابة الأدلة</h2>${gate.open?`<div class="gate"><strong>الاستنتاج والقرار والدرجة النهائية مؤجلة.</strong><ul>${(gate.missing_evidence||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>أضف Fact أو Evidence مستقلًا ثم أعد Scan.</li>'}</ul></div>`:'<div class="deferred">اكتملت بوابة المدخلات في هذا snapshot، وتبقى المراجعة البشرية مطلوبة قبل التنفيذ.</div>'}</section>
    <section><h2>دليل العميل ومصادره</h2>${rows(review.client_evidence||[],e=>`<div class="item"><strong>${esc(e.source_id)}</strong> — ${esc(e.statement)}<div class="meta">${esc(e.classification)} · ${esc(e.source_type)} · ${esc(e.source_ref)} · ${esc(e.source_date||'تاريخ غير متاح')}</div></div>`,'لا يوجد دليل عميل مؤهل بعد.')}</section>
    <section class="reference"><h2>المعرفة المرجعية — ليست Evidence</h2><div class="deferred">لا تغيّر هذه المواد Scan أو الدرجة أو القرار.</div>${rows(refs,r=>`<div class="item"><strong>${esc(r.title)}</strong><div>${esc(r.original_summary||r.problem||'')}</div><div class="meta">الإصدار ${esc(r.source_version||r.version||'—')} · سبب المطابقة: ${esc((r.match_reasons||[]).join(' · ')||'مرجع عام')}<br>الدليل المطلوب: ${esc(r.required_client_evidence||'Fact أو Evidence خاص بالشركة')}</div></div>`,esc((review.reference_knowledge||{}).knowledge_gap||'لا توجد معرفة مرجعية متاحة الآن؛ يستمر Scan بأدلة العميل.'))}</section>
    <section><h2>القيمة</h2><div class="deferred">Sana Score والقيمة المالية: ${esc((review.financial_value||{}).label||'N/A — Deferred')} عند نقص الدليل، ولا تُعرض نسبة نمو مصطنعة.</div></section>
    <section><h2>ملف القرار</h2>${activeDecision?`<div class="item"><strong>${esc(activeDecision.title)}</strong><div>${esc(activeDecision.reason||'بانتظار اكتمال السبب المدعوم.')}</div><div class="meta">الحالة: ${esc(activeDecision.status)}</div></div>`:'<p class="empty">لم يُقترح قرار بعد؛ لن يعرض سنع حكمًا بلا دليل.</p>'}</section>
    <section class="next"><h2>الخطوة التالية</h2>${activeTask?`<div class="item"><strong>${esc(activeTask.title)}</strong><div class="meta">الحالة: ${esc(activeTask.status)}${activeTask.due_date?' · الموعد: '+esc(activeTask.due_date):''}</div></div>`:'<p class="empty">أكمل الخطوة التالية ليظهر قرار قابل للمراجعة.</p>'}${action}</section>`;
}
async function runAnalysis(){const r=await fetch(`/api/cases/${CASE_ID}/scan`,{method:'POST'}),j=await r.json();if(r.ok&&j.success)location.reload();else document.getElementById('actionError').textContent=j.message||'تعذر تحليل الأدلة.'}
async function addAndAnalyze(){const title=document.getElementById('evidenceTitle').value.trim(),source=document.getElementById('sourceRef').value.trim(),box=document.getElementById('actionError');if(!title||!source){box.textContent='اكتب الدليل ومرجع مصدره.';return}const r=await fetch(`/api/companies/${COMPANY_ID}/evidence`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:CASE_ID,asset_id:caseData.case.related_asset_id,title,source_type:'دليل عميل',source_ref:source,evidence_type:'Evidence',confidence:70})}),j=await r.json();if(!r.ok||!j.success){box.textContent=j.message||'تعذر حفظ الدليل.';return}await runAnalysis()}
async function buildDecision(){const r=await fetch(`/api/cases/${CASE_ID}/p0-decision`,{method:'POST'}),j=await r.json();if(r.ok&&j.success)location.href='/home';else document.getElementById('actionError').textContent=j.message||'تعذر إنشاء ملف القرار.'}
fetch(`/api/cases/${CASE_ID}`).then(r=>r.json()).then(j=>{
  if(!j.success) throw new Error();
  render(j.data);
}).catch(()=>{document.getElementById('app').innerHTML='<p class="empty">تعذر تحميل ملف القرار.</p>';});
</script>
</body>
</html>
