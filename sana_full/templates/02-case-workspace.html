<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<script>(function(){var m=document.querySelector('meta[name="csrf-token"]');if(!m)return;var t=m.content;var S=new Set(['POST','PUT','PATCH','DELETE']);var F=window.fetch.bind(window);window.fetch=function(u,o){o=o||{};if(S.has((o.method||'GET').toUpperCase())){o.headers=Object.assign({'X-CSRFToken':t},o.headers||{});}return F(u,o);};})();</script>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F6FB">
<title>سنع — القضية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html{ color-scheme: light; background:#F5F6FB; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:#F5F6FB; color:#333940; font-family:'IBM Plex Sans Arabic', sans-serif; line-height:1.6; }
  .num{ font-family:'Space Grotesk', sans-serif; }
  a{ color:inherit; text-decoration:none; }

  .concept-nav{ background:#080E1F; padding:10px 20px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .concept-nav a{ font-size:11.5px; color:rgba(255,255,255,0.5); padding:6px 12px; border-radius:20px; }
  .concept-nav a.active{ background:rgba(242,178,51,0.15); color:#F2B233; font-weight:600; }

  header{ background:#080E1F; padding:14px 28px; color:#fff; display:flex; align-items:center; gap:14px; }
  .back{ font-size:12.5px; color:rgba(255,255,255,0.6); }
  .case-title{ font-weight:600; font-size:15px; }
  .tag{ background:rgba(242,178,51,0.15); color:#F2B233; font-size:11px; padding:3px 10px; border-radius:20px; }

  main{ max-width:900px; margin:0 auto; padding:26px 20px 60px; }

  .qbox{ background:#0B132B; color:#fff; border-radius:12px; padding:22px; margin-bottom:20px; }
  .qbox .lbl{ font-size:11px; color:rgba(255,255,255,0.5); margin-bottom:6px; text-transform:uppercase; letter-spacing:1px; font-family:'Space Grotesk'; }
  .qbox .declared{ font-size:13.5px; color:rgba(255,255,255,0.55); margin-bottom:14px; text-decoration:line-through; }
  .qbox .real{ font-size:17px; font-weight:600; color:#F2B233; }

  .ai-assessment{ margin-top:16px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.15); }
  .ai-assessment-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .ai-assessment-title{ font-size:12.5px; font-weight:600; color:rgba(255,255,255,0.7); }
  .ai-conf-badge{ background:rgba(242,178,51,0.15); color:#F2B233; font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:20px; font-family:'Space Grotesk'; }
  .ai-assessment-list{ list-style:none; padding:0; margin:0; }
  .ai-assessment-list li{ position:relative; padding-right:16px; margin-bottom:9px; font-size:13px; line-height:1.7; color:rgba(255,255,255,0.85); }
  .ai-assessment-list li::before{ content:"–"; position:absolute; right:0; color:#F2B233; }
  .ai-assessment-list li:last-child{ margin-bottom:0; }

  section{ background:#fff; border:1px solid #DEE1EC; border-radius:12px; padding:20px; margin-bottom:16px; }
  section h2{ font-size:14.5px; font-weight:600; color:#0B132B; margin-bottom:12px; }

  .evidence-item{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid #DEE1EC; font-size:13px; }
  .evidence-item:last-child{ border-bottom:none; }
  .evidence-item .dot{ width:6px; height:6px; border-radius:50%; background:#0EA5A5; margin-top:6px; flex-shrink:0; }
  .evidence-item .conf-tag{ font-family:'Space Grotesk'; font-size:11px; color:#6E7580; }

  .add-form{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .add-form input{ flex:1; min-width:180px; padding:9px 12px; border:1px solid #DEE1EC; border-radius:7px; font-family:'IBM Plex Sans Arabic'; font-size:13px; }
  .add-form select{ padding:9px 12px; border:1px solid #DEE1EC; border-radius:7px; background:#fff; font-family:'IBM Plex Sans Arabic'; font-size:13px; }
  .add-form button{ padding:9px 16px; background:#0EA5A5; color:#fff; border:none; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; font-family:'IBM Plex Sans Arabic'; }

  .decision-box{ border:1px solid #DEE1EC; border-radius:10px; padding:16px; background:#F5F6FB; }
  .decision-box .t{ font-weight:600; color:#0B132B; margin-bottom:6px; }
  .decision-box .r{ font-size:12.5px; color:#6E7580; margin-bottom:12px; }
  .btn{ padding:9px 18px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; border:none; font-family:'IBM Plex Sans Arabic'; }
  .btn-primary{ background:#0B132B; color:#fff; }
  .btn-primary:disabled{ opacity:0.5; }
  .link-out{ display:inline-block; margin-top:10px; font-size:12.5px; color:#0EA5A5; font-weight:600; }
  .skeleton{ color:#9AA0AB; font-size:13px; padding:40px 0; text-align:center; }
  .ai-btn{ font-size:11px; padding:5px 10px; border-radius:6px; border:1px solid #DEE1EC; background:#fff; cursor:pointer; white-space:nowrap; font-family:'IBM Plex Sans Arabic'; }
  .ai-btn:hover{ border-color:#F2B233; }
  .ai-note{ font-size:12px; color:#0EA5A5; margin-top:4px; line-height:1.6; }
  .ai-error{ font-size:12px; color:#B23A2E; margin-top:4px; line-height:1.6; }
  .profile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  .profile-field{ display:flex; flex-direction:column; gap:6px; }
  .profile-field.full{ grid-column:1 / -1; }
  .profile-field label{ font-size:12px; font-weight:600; color:#0B132B; }
  .profile-field input{
    width:100%; border:1.5px solid #DEE1EC; border-radius:8px; padding:10px 12px;
    font-family:inherit; font-size:13px; direction:ltr; text-align:left; background:#F9FAFC;
  }
  .profile-field input:focus{ outline:none; border-color:#0EA5A5; background:#fff; }
  .profile-meta{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .profile-chip{ background:#F5F6FB; color:#6E7580; border-radius:20px; padding:4px 10px; font-size:11.5px; }
  .profile-actions{ display:flex; align-items:center; gap:12px; margin-top:14px; }
  .profile-msg{ font-size:12px; color:#0EA5A5; min-height:18px; }
  @media (max-width:620px){ .profile-grid{ grid-template-columns:1fr; } .profile-field.full{ grid-column:auto; } }
  .period-card{ margin-top:12px; padding:14px; border:1px solid #E4E8EF; border-radius:10px; background:#F9FAFC; }
  .period-question{ color:#0B132B; font-size:13px; font-weight:700; margin-bottom:9px; }
  .period-help{ color:#6E7580; font-size:11.5px; line-height:1.7; margin:-3px 0 10px; }
  .period-options{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
  .period-option{ min-height:42px; padding:9px 11px; border:1px solid #DEE1EC; border-radius:8px; background:#fff; color:#333940; font-family:inherit; font-size:12.5px; font-weight:600; cursor:pointer; }
  .period-option.selected{ border-color:#0EA5A5; background:#F1FBFA; color:#0E7C7B; }
  .period-dates{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .period-dates[hidden], .period-comparison[hidden]{ display:none; }
  .period-dates label{ font-size:11px; color:#6E7580; }
  .period-dates input, .period-select{ width:100%; margin-top:5px; padding:10px; border:1px solid #DEE1EC; border-radius:8px; background:#fff; font-family:inherit; font-size:13px; }
  .period-summary{ margin-top:9px; padding:9px 10px; border-radius:8px; background:#F1FBFA; color:#0E6F6E; font-size:12px; }
  .period-note{ margin-top:8px; color:#765B00; font-size:11.5px; line-height:1.6; }
  .period-edit{ margin-top:8px; padding:0; border:0; background:transparent; color:#0E7C7B; font-family:inherit; font-size:11.5px; font-weight:700; cursor:pointer; }
  @media (max-width:620px){
    .period-options, .period-dates{ grid-template-columns:1fr; }
    .period-option{ width:100%; text-align:right; }
  }
  .knowledge-section{ border-color:#BFE5E3; }
  .knowledge-pipeline{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:8px 0 14px; }
  .knowledge-step{ background:#F1FBFA; color:#0E7C7B; border-radius:20px; padding:4px 9px; font-size:11px; font-weight:600; }
  .knowledge-arrow{ color:#9AA0AB; font-size:12px; }
  .knowledge-status{ border-radius:8px; padding:11px 12px; margin-top:8px; font-size:12.5px; line-height:1.7; }
  .knowledge-status.supported{ background:#F0FAF5; border:1px solid #B7E4C7; color:#176B42; }
  .knowledge-status.blocked{ background:#FFF9EB; border:1px solid #F1D68A; color:#765B00; }
  .knowledge-finding{ background:#F8FAFC; border:1px solid #E4E8EF; border-radius:9px; padding:13px; margin-top:10px; }
  .knowledge-finding-title{ color:#0B132B; font-weight:700; font-size:13px; margin-bottom:5px; }
  .knowledge-finding-text{ color:#6E7580; font-size:12px; line-height:1.7; }
  .knowledge-list{ margin:7px 0 0; padding-right:18px; color:#333940; font-size:12px; line-height:1.8; }
  .knowledge-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .knowledge-meta span{ background:#fff; border:1px solid #DEE1EC; color:#6E7580; border-radius:15px; padding:3px 8px; font-size:10.5px; }
  .knowledge-search{ border-top:1px solid #EEF0F5; margin-top:16px; padding-top:14px; }
  .knowledge-search-row{ display:flex; gap:8px; }
  .knowledge-search-row input{ flex:1; border:1px solid #DEE1EC; border-radius:7px; padding:8px 10px; font-family:inherit; font-size:12px; }
  .knowledge-search-row button{ padding:8px 12px; background:#F5F6FB; border:1px solid #DEE1EC; border-radius:7px; color:#0B132B; font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; }
  .knowledge-search-result{ padding:8px 0; border-bottom:1px solid #EEF0F5; font-size:12px; }
  .knowledge-search-result:last-child{ border-bottom:none; }
  .knowledge-search-result strong{ color:#0B132B; }
  .knowledge-search-result small{ display:block; color:#6E7580; margin-top:2px; }
  .knowledge-libraries{ color:#6E7580; font-size:11.5px; margin-top:7px; }
  .ai-case-btn{ margin-top:14px; width:100%; padding:11px; background:#0B132B; color:#fff; border:none; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:'IBM Plex Sans Arabic'; }
  .ai-case-btn:hover{ background:#131c3d; }
  #toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#0B132B; color:#fff; padding:12px 22px; border-radius:8px; font-size:13.5px; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.show{ opacity:1; }

  /* ── SDS-002 ── */
  .sds-section{
    background:#fff; border:1.5px solid #F2B233; border-radius:12px;
    padding:20px; margin-bottom:16px;
  }
  .sds-eyebrow{ font-family:'Space Grotesk'; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#F2B233; font-weight:600; margin-bottom:8px; }
  .sds-q{ font-size:14.5px; font-weight:600; color:#0B132B; margin-bottom:14px; line-height:1.5; }
  .sds-options{ display:flex; gap:8px; flex-wrap:wrap; }
  .sds-opt{
    flex:1; min-width:90px; padding:9px 12px; border:1.5px solid #DEE1EC;
    border-radius:8px; text-align:center; font-size:12.5px; font-weight:600;
    cursor:pointer; background:#F5F6FB; color:#6E7580; transition:all .15s;
    font-family:'IBM Plex Sans Arabic';
  }
  .sds-opt:hover{ border-color:#F2B233; color:#0B132B; }
  .sds-opt.selected{ background:#FFF8E6; border-color:#F2B233; color:#7A5C00; }
  .sds-opt.saving{ opacity:.55; cursor:not-allowed; }
  .sds-msg{ margin-top:12px; font-size:13px; color:#0B132B; display:none; }
  .sds-msg.show{ display:block; }
  .sds-suggestion{ margin-top:8px; font-size:12px; color:#6E7580; font-style:italic; display:none; }
  .sds-suggestion.show{ display:block; }
</style>
</head>
<body>

<div class="concept-nav">
  <a href="/home{{ context_query }}">اليوم</a>
  <a href="/case/{{ case_id }}/next-step{{ context_query }}" class="active">الخطوة التالية</a>
  <a href="/passport{{ context_query }}">الأصول</a>
</div>

<header>
  <a href="/home" class="back" id="backLink">← الرئيسية</a>
  <div class="case-title" id="caseTitle">...</div>
  <span class="tag" id="caseType"></span>
  <a href="/case/{{ case_id }}/next-step" id="nextStepBtn"
     style="margin-right:auto; display:flex; align-items:center; gap:6px;
            background:rgba(242,178,51,0.15); color:#F2B233; border:1px solid rgba(242,178,51,0.3);
            border-radius:8px; padding:7px 13px; font-size:12.5px; font-weight:600;
            white-space:nowrap; cursor:pointer; font-family:'IBM Plex Sans Arabic';">
     وش نسوي الآن؟
  </a>
</header>

<main id="app">
  <div class="skeleton">يجمع سنع تفاصيل القضية...</div>
</main>

<div id="toast"></div>

<script>
const CASE_ID = "{{ case_id }}";
const CONTEXT_QUERY = {{ context_query|tojson }};
let CASE_COMPANY_ID = null;

function escHtml(value){
  return String(value ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function renderAiAssessment(text, confidence){
  // ⚠ تحسين عرض فقط — لا يغيّر التحليل نفسه، فقط يقسّمه لنقاط قابلة للمسح السريع
  const cleaned = text.replace(/^\s*(تقييم سنع الشامل|التقييم الشامل)\s*:?\s*/i, '');
  const sentences = cleaned.split(/(?<=[.؟!])\s+/).map(s => s.trim()).filter(s => s.length > 3);
  const confBadge = confidence
    ? `<span class="ai-conf-badge">ثقة ${confidence}٪</span>`
    : '';
  const points = sentences.map(s => `<li>${s}</li>`).join('');
  return `
    <div class="ai-assessment">
      <div class="ai-assessment-head">
        <span class="ai-assessment-title">🧠 تقييم سنع الشامل</span>
        ${confBadge}
      </div>
      <ul class="ai-assessment-list">${points}</ul>
    </div>
  `;
}

function renderKnowledgeResult(result){
  if(!result) return `<div class="knowledge-status blocked">لم يُشغّل تشخيص مكتبة سنع بعد. شغّله قبل طلب العرض بالذكاء الاصطناعي.</div>`;
  const supported = result.supported_findings || [];
  let html = `<div class="knowledge-status ${result.status === 'SUPPORTED' ? 'supported' : 'blocked'}">
    <strong>${escHtml(result.message || '')}</strong>
    <div style="margin-top:3px;">المصدر: ${escHtml(result.knowledge_path || 'Sana Knowledge')}</div>
  </div>`;
  supported.forEach(f => {
    const recommendations = (f.recommendation || []).map(x => `<li>${escHtml(x)}</li>`).join('');
    const kpis = (f.kpis || []).map(x => `<li>${escHtml(x)}</li>`).join('');
    html += `<div class="knowledge-finding">
      <div class="knowledge-finding-title">${escHtml(f.title)}</div>
      <div class="knowledge-finding-text">${escHtml(f.problem || '')}</div>
      <div class="knowledge-meta">
        <span>المستوى ${escHtml(f.knowledge_level || 'L0')}</span>
        <span>الثقة ${escHtml(f.confidence_level || '—')}</span>
        <span>الدليل: ${escHtml((f.evidence_ids || []).join('، ') || '—')}</span>
        <span>${escHtml(f.source || '')} · ${escHtml(f.version || '')}</span>
      </div>
      <div style="font-size:12px;font-weight:600;color:#0B132B;margin-top:10px;">القرار المدعوم</div>
      <div class="knowledge-finding-text">${escHtml((f.decision_rule || {}).decision || '')}</div>
      ${recommendations ? `<div style="font-size:12px;font-weight:600;color:#0B132B;margin-top:9px;">التوصية</div><ul class="knowledge-list">${recommendations}</ul>` : ''}
      ${kpis ? `<div style="font-size:12px;font-weight:600;color:#0B132B;margin-top:9px;">مؤشرات للقياس (دون Benchmark مفترض)</div><ul class="knowledge-list">${kpis}</ul>` : ''}
    </div>`;
  });
  const missing = result.missing_evidence || [];
  const questions = result.diagnostic_questions || [];
  if(missing.length){
    html += `<div style="margin-top:11px;font-size:12px;font-weight:600;color:#765B00;">المطلوب قبل قرار نهائي</div>
      <ul class="knowledge-list">${missing.map(x => `<li>${escHtml(x)}</li>`).join('')}</ul>`;
  }
  if(questions.length){
    html += `<div style="margin-top:9px;font-size:12px;font-weight:600;color:#765B00;">أسئلة إضافية</div>
      <ul class="knowledge-list">${questions.slice(0,4).map(x => `<li>${escHtml(x)}</li>`).join('')}</ul>`;
  }
  return html;
}

function renderScanSection(scan){
  const status = scan ? scan.status : 'NOT_RUN';
  const statusLabel = status === 'REVIEW_REQUIRED'
    ? 'جاهز للمراجعة البشرية'
    : status === 'INCOMPLETE' ? 'غير مكتمل'
    : status === 'COMPLETE' ? 'اكتملت المراجعة — التقرير جاهز' : 'لم يُشغّل بعد';
  let body = '';
  if(!scan){
    body = `<div class="knowledge-status blocked">شغّل Sana Scan لجمع SDS-001 والأدلة والأصول الخمسة في تشخيص واحد.</div>`;
  } else {
    const quality = scan.diagnostic_quality || {};
    const baseline = scan.diagnostic_baseline || {};
    const bottleneck = scan.bottleneck;
    const opportunity = scan.opportunity;
    const decision = scan.proposed_decision;
    body += `<div class="knowledge-status ${status === 'REVIEW_REQUIRED' ? 'supported' : 'blocked'}">
      <strong>${escHtml(statusLabel)}</strong>
      <div style="margin-top:3px;">${escHtml(scan.methodology_version || '')}</div>
      <div style="margin-top:3px;">الدرجات المكتملة: ${scan.score_complete_count || 0}/${scan.score_total_count || 5}</div>
    </div>`;
    body += `<div class="knowledge-finding">
      <div class="knowledge-finding-title">جودة الصورة التشخيصية</div>
      <div class="knowledge-meta">
        <span>مثبتة: ${quality.verified_count || 0}</span>
        <span>إفادات ذاتية: ${quality.self_reported_count || 0}</span>
        <span>تعارضات مفتوحة: ${quality.open_conflicts_count || 0}</span>
        <span>ناقصة: ${quality.missing_count || 0}</span>
        <span>قوة الدليل: ${escHtml(quality.evidence_strength || 'WEAK')}</span>
        <span>موثوقية البيانات: ${escHtml(quality.data_reliability || 'LOW')}</span>
      </div>
      <div class="knowledge-finding-text" style="margin-top:8px;">
        الفترة المتاحة: ${escHtml(baseline.baseline_start || 'غير محددة')} — ${escHtml(baseline.baseline_end || 'غير محددة')}
        · الفترة السابقة: ${baseline.comparison_start ? `${escHtml(baseline.comparison_start)} — ${escHtml(baseline.comparison_end)}` : 'ما عندنا مقارنة الآن'}
        · طبيعة الفترة: ${escHtml(baseline.seasonality_context || 'غير محددة')}
      </div>
    </div>`;
    if(bottleneck){
      body += `<div class="knowledge-finding">
        <div class="knowledge-finding-title">الاختناق المرشح · ${escHtml(bottleneck.classification)}</div>
        <div class="knowledge-finding-text">${escHtml(bottleneck.statement)}</div>
        <div class="knowledge-meta"><span>المصادر: ${escHtml((bottleneck.source_ids || []).join('، '))}</span><span>بانتظار مراجعة بشرية</span></div>
      </div>`;
    }
    if(opportunity){
      body += `<div class="knowledge-finding">
        <div class="knowledge-finding-title">الفرصة · ${escHtml(opportunity.priority || '')}</div>
        <div class="knowledge-finding-text">${escHtml(opportunity.statement)}</div>
        <div class="knowledge-meta"><span>الأثر ${escHtml(opportunity.impact || '—')}</span><span>الجهد ${escHtml(opportunity.effort || '—')}</span><span>الثقة ${escHtml(opportunity.confidence || '—')}</span></div>
      </div>`;
    }
    if(decision){
      body += `<div class="knowledge-finding">
        <div class="knowledge-finding-title">القرار المقترح — غير معتمد</div>
        <div class="knowledge-finding-text">${escHtml(decision.statement)}</div>
        <div class="knowledge-meta"><span>${escHtml(decision.decision_status || '')}</span><span>المصادر: ${escHtml((decision.source_ids || []).join('، '))}</span></div>
      </div>`;
    }
    body += `<div style="margin-top:12px;font-size:12px;font-weight:600;color:#0B132B;">درجات الأصول الخمسة</div>`;
    (scan.asset_scores || []).forEach(asset => {
      const components = (asset.components || []).map(component =>
        `<li>${escHtml(component.label)}: <span class="num">${component.points > 0 ? '+' : ''}${component.points}</span> — ${escHtml((component.source_ids || []).join('، '))}</li>`
      ).join('');
      const missing = (asset.missing_evidence || []).map(item => `<li>${escHtml(item)}</li>`).join('');
      body += `<div class="knowledge-finding">
        <div class="knowledge-finding-title">${escHtml(asset.asset_name)} · ${escHtml(asset.score_label)}</div>

          <label>إلى<input id="caseBaselineEnd" type="date" value="${escHtml(scan?.diagnostic_baseline?.baseline_end || '')}"></label>

    <div>هذه المواد لا تغيّر التشخيص أو الدرجة أو القرار، وتستخدم لصياغة أسئلة وتجارب تحتاج تحققًا.</div></div>`;
  if(bundle.knowledge_gap){
    body += `<div class="knowledge-finding"><div class="knowledge-finding-title">فجوة معرفية صريحة</div>
      <div class="knowledge-finding-text">${escHtml(bundle.knowledge_gap)}</div></div>`;

        <span>${escHtml(x.publisher || x.source || '')}</span><span>${escHtml(x.source_version || x.version || '')}</span>

function qs(companyId, extra){
  const p = new URLSearchParams(CONTEXT_QUERY.slice(1));
  if(companyId) p.set('company_id', companyId);
  if(extra) Object.entries(extra).forEach(([k,v]) => p.set(k, v));
  const s = p.toString();
  return s ? `?${s}` : '';
}

async function loadCase(){
  const res = await fetch(`/api/cases/${CASE_ID}${CONTEXT_QUERY}`);
  const json = await res.json();
  if(!json.success){ document.getElementById('app').innerHTML = '<p>تعذر تحميل القضية</p>'; return; }
  render(json.data);
}

function buildInsightCounter(evidence, assets) {
  // قواعد If/Else ثابتة — بلا AI
  const risks = evidence.filter(e =>
    (e.source_type || '').includes('risk_if_skipped') ||
    (e.title || '').includes('[founder_dependency]') ||
    ((e.title || '').includes('مستوى اعتماد') &&
      (['يتعطل','لا تعمل','تتوقف'].some(w => (e.title||'').includes(w))))
  );
  const assetIdsWithEvidence = new Set(evidence.map(e => e.asset_id).filter(Boolean));
  const needsAttention = (assets || []).filter(a => !assetIdsWithEvidence.has(a.asset_id));
  const opportunities  = evidence.filter(e => !risks.includes(e));

  if (evidence.length === 0 && (assets||[]).length === 0) return '';

  // خريطة بحث سريع: asset_id → asset_name
  const assetMap = {};
  (assets || []).forEach(a => { assetMap[a.asset_id] = a.asset_name || a.asset_type || a.asset_id; });

  // قوالب ثابتة لكل source_type
  const WHY_MATTERS = {
    'اكتشاف_ذاتي':              'رصدته بنفسك ومتكرر بما يكفي لتلاحظه — يستحق توثيقاً رسمياً',
    'تقييم سريع':               'تقييم أولي يُظهر نقطة ضعف أو فرصة قبل أن تتفاقم',
    'SDS-002 تشخيص تراكمي':     'نمط متراكم رصده سنع عبر أكثر من جلسة — يُشير لمشكلة بنيوية لا طارئة',
    'SOP sop_protects':          'هذا الإجراء يحمي عملك من أخطاء متكررة — غيابه يعني خطر التكرار',
    'SOP risk_if_skipped':       'تخطّي هذا الإجراء يُعرّض العمليات لخطأ مكلف — الالتزام به يحمي الوقت',
    'وثيقة SOP':                 'إجراء موثَّق يُقلل الاعتماد على شخص واحد ويحمي الاستمرارية',
    'بيانات مؤسس':              'معلومة مباشرة من صاحب القرار — تأثيرها على التشغيل عالٍ',
    'ملاحظة مباشرة':            'ما شاهدته مباشرة أصدق من أي تقرير — يستحق معالجة فورية',
    'دليل تأسيسي':              'وثيقة تُحدد هوية عملك أو ملكيتك — إهمالها يُضعف موقفك القانوني',
    'sana_discovery':            'اكتشفه سنع خلال تحليل بياناتك — يستحق مراجعة قبل اتخاذ قرار',
    'تحديث داخلي موثَّق':       'تغيير داخلي مسجَّل يُؤثر على سير العمل — مراجعته تمنع الالتباس',
  };
  const NEXT_STEP = {
    'اكتشاف_ذاتي':              'وثّق هذه الملاحظة في SOP أو خطة تحسين',
    'تقييم سريع':               'حدّد إن كان يحتاج تعمقاً أو إجراءً فورياً',
    'SDS-002 تشخيص تراكمي':     'راجع هذا النمط مع فريقك وضع خطة معالجة واضحة',
    'SOP sop_protects':          'تأكد أن الفريق يطبق هذا الإجراء ووثّق حالات الاستثناء',
    'SOP risk_if_skipped':       'أضف تنبيهاً واضحاً لكل من يتجاوز هذا الإجراء',
    'وثيقة SOP':                 'درّب الفريق على هذا الإجراء وحدد تواتر مراجعته',
    'بيانات مؤسس':              'سجّل هذا القرار رسمياً حتى لا يبقى في رأس شخص واحد',
    'ملاحظة مباشرة':            'حوّل هذه الملاحظة لإجراء أو قرار مكتوب',
    'دليل تأسيسي':              'احتفظ بنسخة رقمية محمية وأخبر شخصاً ثانياً بمكانها',
    'sana_discovery':            'راجع هذا الاكتشاف وقرر ما إذا كان يستدعي إجراءً',
    'تحديث داخلي موثَّق':       'شارك هذا التحديث مع المعنيين وأكد الاستيعاب',
  };
  const DEFAULT_WHY  = 'دليل يستحق مراجعة لأثره على العمليات اليومية';
  const DEFAULT_NEXT = 'قيّمه مع فريقك وحدد الإجراء المناسب';

  // بطاقة تفصيلية لدليل (فرصة أو خطر)
  function evidenceCard(item, icon, borderColor) {
    const src      = item.source_type || '';
    const why      = WHY_MATTERS[src]  || DEFAULT_WHY;
    const next     = NEXT_STEP[src]    || DEFAULT_NEXT;
    const body     = item.ai_analysis  || item.title || '—';
    const assetLbl = item.asset_id ? (assetMap[item.asset_id] || item.asset_id) : '—';
    return `
      <div style="background:rgba(255,255,255,0.04); border-right:3px solid ${borderColor};
                  border-radius:8px; padding:12px 14px; margin-bottom:10px;">
        <div style="color:#fff; font-size:13px; font-weight:600; margin-bottom:10px; line-height:1.5;">
          ${icon} ${item.title || '—'}
        </div>
        <div style="display:flex; flex-direction:column; gap:7px;">
          <div style="font-size:12px; color:rgba(255,255,255,0.75); line-height:1.6;">
            <span style="color:rgba(255,255,255,0.4);">🧠 لماذا اكتشفها سنع؟</span><br>
            ${body}
          </div>
          <div style="font-size:12px; color:rgba(255,255,255,0.75); line-height:1.5;">
            <span style="color:rgba(255,255,255,0.4);">🎯 لماذا تهمك؟</span><br>
            ${why}
          </div>
          <div style="font-size:12px; color:rgba(255,255,255,0.6);">
            ⭐ <span style="color:rgba(255,255,255,0.4);">الأصل المتأثر:</span> ${assetLbl}
          </div>
          <div style="font-size:12px; color:#0EA5A5; font-weight:500;">
            👉 الخطوة التالية: ${next}
          </div>
        </div>
      </div>`;
  }

  // بطاقة مبسّطة للأصل بلا دليل
  function assetCard(item) {
    const name  = item.asset_name || item.asset_type || item.asset_id || '—';
    const score = item.current_score != null ? `${item.current_score}/100` : '—';
    return `
      <div style="background:rgba(255,255,255,0.04); border-right:3px solid #F2B233;
                  border-radius:8px; padding:12px 14px; margin-bottom:10px;">
        <div style="color:#fff; font-size:13px; font-weight:600; margin-bottom:8px;">
          🔍 ${name}
        </div>
        <div style="display:flex; flex-direction:column; gap:6px; font-size:12px;">
          <div style="color:rgba(255,255,255,0.5);">
            ⭐ <span style="color:rgba(255,255,255,0.4);">درجة الأصل:</span>
            <span style="color:rgba(255,255,255,0.75);">${score}</span>
          </div>
          <div style="color:#F2B233; font-weight:500;">
            👉 الخطوة التالية: أضف دليلاً مرتبطاً بهذا الأصل لتتضح صورته
          </div>
        </div>
      </div>`;
  }

  function panelHTML(items, type) {
    if (!items.length) return `<p style="color:rgba(255,255,255,0.35);font-size:12px;margin:8px 0 0;">لا توجد عناصر في هذه الفئة.</p>`;
    if (type === 'asset')
      return items.map(a => assetCard(a)).join('');
    if (type === 'risk')
      return items.map(e => evidenceCard(e, '⚠️', '#B23A2E')).join('');
    return items.map(e => evidenceCard(e, '🚀', '#0EA5A5')).join('');
  }

  function pillBtn(id, count, color, label) {
    return `<button onclick="toggleInsightPanel('${id}')"
      style="background:none; border:none; cursor:pointer; display:flex; gap:6px; align-items:center; padding:0;">
      <span style="color:${color}; font-size:19px; font-weight:700; font-family:'Space Grotesk';">${count}</span>
      <span style="color:rgba(255,255,255,0.55); font-size:13px; text-decoration:underline dotted rgba(255,255,255,0.3);">${label}</span>
    </button>`;
  }

  return `
    <div style="background:#0B132B; border-radius:10px; padding:14px 18px; margin-bottom:16px;">
      <span style="font-size:11px; color:rgba(255,255,255,0.5); font-weight:600;
                   letter-spacing:1px; text-transform:uppercase; display:block; margin-bottom:10px;">
        🧠 ماذا اكتشف سنع؟
      </span>
      <div style="display:flex; gap:20px; flex-wrap:wrap; align-items:center;">
        ${pillBtn('panel-opp', opportunities.length, '#0EA5A5', 'فرص')}
        <span style="color:rgba(255,255,255,0.15);">·</span>
        ${pillBtn('panel-risk', risks.length, '#B23A2E', 'مخاطر')}
        <span style="color:rgba(255,255,255,0.15);">·</span>
        ${pillBtn('panel-att', needsAttention.length, '#F2B233', 'أصل يحتاج اهتمامًا')}
      </div>

      <div id="panel-opp"  style="display:none; margin-top:12px; border-top:1px solid rgba(255,255,255,0.1); padding-top:12px;">${panelHTML(opportunities, 'opp')}</div>
      <div id="panel-risk" style="display:none; margin-top:12px; border-top:1px solid rgba(255,255,255,0.1); padding-top:12px;">${panelHTML(risks, 'risk')}</div>
      <div id="panel-att"  style="display:none; margin-top:12px; border-top:1px solid rgba(255,255,255,0.1); padding-top:12px;">${panelHTML(needsAttention, 'asset')}</div>
    </div>`;
}

function toggleInsightPanel(id) {
  ['panel-opp','panel-risk','panel-att'].forEach(pid => {
    const el = document.getElementById(pid);
    if (!el) return;
    el.style.display = (pid === id && el.style.display === 'none') ? 'block' : 'none';
  });
}

function knowledgeQueryString(){
  const params = new URLSearchParams();
  if(ADMIN_KEY) params.set('admin_key', ADMIN_KEY);
  if(ADMIN_KEY && CASE_COMPANY_ID) params.set('company_id', CASE_COMPANY_ID);
  return params.toString() ? `?${params.toString()}` : '';
}

async function loadKnowledgeLibraries(){
  const target = document.getElementById('knowledgeLibrarySummary');
  if(!target) return;
  try{
    const res = await fetch(`/api/knowledge/libraries${knowledgeQueryString()}`);
    const json = await res.json();
    if(!json.success) throw new Error('load failed');
    const active = (json.data.libraries || []).filter(x => x.count > 0);
    target.textContent = `${json.data.sector_label || 'قطاع غير محدد'} · ${active.length} مكتبة متاحة · النسخة ${json.data.knowledge_version}`;
  }catch(e){
    target.textContent = 'تعذر تحميل فهرس المكتبة الآن.';
  }
}

async function runKnowledgeDiagnosis(){
  const btn = document.getElementById('runKnowledgeBtn');
  const out = document.getElementById('knowledge-diagnostic-output');
  if(btn){ btn.disabled = true; btn.textContent = 'جارٍ تطبيق قواعد سنع...'; }
  try{
    const res = await fetch(`/api/cases/${CASE_ID}/diagnose`, {method:'POST'});
    const json = await res.json();
    if(!res.ok || !json.success) throw new Error(json.message || 'diagnostic failed');
    if(out) out.innerHTML = renderKnowledgeResult(json.data);
    showToast(json.data.status === 'SUPPORTED' ? 'تم الوصول إلى نتيجة مدعومة من مكتبة سنع' : 'توقّف سنع عند نقص الأدلة');
  }catch(e){
    if(out) out.innerHTML = `<div class="ai-error">تعذر تشغيل محرك المعرفة الآن.</div>`;
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'شغّل تشخيص مكتبة سنع'; }
  }
}

async function runCaseScan(){
  const out = document.getElementById('scan-output');
  const btn = document.getElementById('runScanBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'جارٍ تشغيل Sana Scan...'; }
  if(out) out.innerHTML = `<div class="knowledge-status blocked">يجمع سنع SDS-001 والأدلة والأصول الخمسة...</div>`;
  try{
    const res = await fetch(`/api/cases/${CASE_ID}/scan`, {method:'POST'});
    const json = await res.json();
    if(!res.ok || !json.success) throw new Error(json.message || 'scan failed');
    showToast('اكتمل Sana Scan — النتيجة بانتظار المراجعة البشرية');
    loadCase();
  }catch(e){
    if(out) out.innerHTML = `<div class="knowledge-status blocked">تعذر تشغيل Scan. لم تُحفظ نتيجة غير مكتملة.</div>`;
    if(btn){ btn.disabled = false; btn.textContent = 'أعد تشغيل Sana Scan'; }
  }
}

function localIso(dateValue){
  const year = dateValue.getFullYear();
  const month = String(dateValue.getMonth() + 1).padStart(2, '0');
  const day = String(dateValue.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function localDate(value){
  const [year, month, day] = String(value || '').split('-').map(Number);
  return year && month && day ? new Date(year, month - 1, day, 12) : null;
}

function formatPeriod(start, end){
  if(!start || !end) return '';
  return `${start} إلى ${end}`;
}

function setSelectedPeriodButton(value){
  document.querySelectorAll('[data-period]').forEach(button => {
    button.classList.toggle('selected', button.dataset.period === value);
  });
}

function setSelectedCompareButton(value){
  document.querySelectorAll('[data-compare]').forEach(button => {
    button.classList.toggle('selected', button.dataset.compare === value);
  });
}

function updatePeriodSummary(){
  const startInput = document.getElementById('caseBaselineStart');
  const endInput = document.getElementById('caseBaselineEnd');
  const summary = document.getElementById('casePeriodSummary');
  const note = document.getElementById('casePeriodNote');
  const compareCard = document.getElementById('caseCompareCard');
  if(!startInput?.value || !endInput?.value){
    summary.hidden = true;
    compareCard.hidden = true;
    return false;
  }
  const today = localIso(new Date());
  if(startInput.value > today || endInput.value > today){
    summary.hidden = true;
    compareCard.hidden = true;
    note.textContent = 'هذه فترة مستهدفة، وليست نتيجة فعلية بعد';
    return false;
  }
  if(endInput.value < startInput.value){
    summary.hidden = true;
    compareCard.hidden = true;
    note.textContent = 'تاريخ النهاية لازم يكون بعد تاريخ البداية.';
    return false;
  }
  summary.textContent = `الفترة المختارة: ${formatPeriod(startInput.value, endInput.value)}`;
  summary.hidden = false;
  compareCard.hidden = false;
  note.textContent = endInput.value === today
    ? 'تشمل البيانات المتاحة حتى اليوم.'
    : '';
  return true;
}

function suggestPreviousPeriod(){
  const start = localDate(document.getElementById('caseBaselineStart')?.value);
  const end = localDate(document.getElementById('caseBaselineEnd')?.value);
  if(!start || !end) return;
  const lengthMs = end.getTime() - start.getTime();
  const comparisonEnd = new Date(start);
  comparisonEnd.setDate(comparisonEnd.getDate() - 1);
  const comparisonStart = new Date(comparisonEnd.getTime() - lengthMs);
  document.getElementById('caseComparisonStart').value = localIso(comparisonStart);
  document.getElementById('caseComparisonEnd').value = localIso(comparisonEnd);
  updateComparisonSummary();
}

function updateComparisonSummary(){
  const startValue = document.getElementById('caseComparisonStart')?.value;
  const endValue = document.getElementById('caseComparisonEnd')?.value;
  const summary = document.getElementById('caseComparisonSummary');
  const note = document.getElementById('caseComparisonNote');
  if(!startValue || !endValue){
    summary.textContent = '';
    note.textContent = '';
    return;
  }
  summary.textContent = `الفترة المقترحة: ${formatPeriod(startValue, endValue)}`;
  const baseStart = localDate(document.getElementById('caseBaselineStart')?.value);
  const baseEnd = localDate(document.getElementById('caseBaselineEnd')?.value);
  const compareStart = localDate(startValue);
  const compareEnd = localDate(endValue);
  if(compareEnd && compareEnd > new Date()){
    note.textContent = 'المقارنة تحتاج فترة انتهت فعليًا';
    return;
  }
  if(compareEnd && baseStart && compareEnd >= baseStart){
    note.textContent = 'الفترة السابقة لازم تنتهي قبل الفترة الحالية.';
    return;
  }
  const baseDays = baseStart && baseEnd ? Math.round((baseEnd - baseStart) / 86400000) : null;
  const compareDays = compareStart && compareEnd ? Math.round((compareEnd - compareStart) / 86400000) : null;
  note.textContent = baseDays !== null && compareDays !== null && baseDays !== compareDays
    ? 'يفضل أن تكون الفترتان بنفس الطول حتى تكون المقارنة أوضح.'
    : '';
}

function selectPeriodPreset(preset){
  const today = new Date();
  let start = new Date(today);
  let end = new Date(today);
  const dates = document.getElementById('casePeriodDates');
  setSelectedPeriodButton(preset);
  if(preset === 'custom'){
    dates.hidden = false;
    updatePeriodSummary();
    return;
  }
  dates.hidden = true;
  if(preset === '30'){
    start.setDate(start.getDate() - 29);
  }else if(preset === '3m'){
    start.setMonth(start.getMonth() - 3);
    start.setDate(start.getDate() + 1);
  }else if(preset === 'month'){
    start = new Date(today.getFullYear(), today.getMonth(), 1, 12);
  }
  document.getElementById('caseBaselineStart').value = localIso(start);
  document.getElementById('caseBaselineEnd').value = localIso(end);
  if(updatePeriodSummary() && document.querySelector('[data-compare="yes"].selected')){
    suggestPreviousPeriod();
  }
}

function selectComparison(choice){
  setSelectedCompareButton(choice);
  const wrap = document.getElementById('caseComparisonWrap');
  if(choice === 'yes'){
    wrap.hidden = false;
    suggestPreviousPeriod();
  }else{
    wrap.hidden = true;
    document.getElementById('caseComparisonStart').value = '';
    document.getElementById('caseComparisonEnd').value = '';
  }
}

function initializePeriodForm(saved){
  const today = localIso(new Date());
  ['caseBaselineStart','caseBaselineEnd','caseComparisonStart','caseComparisonEnd'].forEach(id => {
    const field = document.getElementById(id);
    if(field) field.max = today;
  });
  document.querySelectorAll('[data-period]').forEach(button => {
    button.addEventListener('click', () => selectPeriodPreset(button.dataset.period));
  });
  document.querySelectorAll('[data-compare]').forEach(button => {
    button.addEventListener('click', () => selectComparison(button.dataset.compare));
  });
  ['caseBaselineStart','caseBaselineEnd'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', () => {
      if(updatePeriodSummary() && document.querySelector('[data-compare="yes"].selected')){
        suggestPreviousPeriod();
      }
    });
  });
  ['caseComparisonStart','caseComparisonEnd'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', updateComparisonSummary);
  });
  document.getElementById('caseComparisonEdit')?.addEventListener('click', () => {
    document.getElementById('caseComparisonDates').hidden = false;
  });
  if(saved?.baseline_start && saved?.baseline_end){
    setSelectedPeriodButton('custom');
    document.getElementById('casePeriodDates').hidden = false;
    updatePeriodSummary();
    if(saved.comparison_start && saved.comparison_end){
      setSelectedCompareButton('yes');
      document.getElementById('caseComparisonWrap').hidden = false;
      updateComparisonSummary();
    }else{
      setSelectedCompareButton('no');
    }
    const seasonality = document.getElementById('caseSeasonality');
    if(seasonality && [...seasonality.options].some(option => option.value === saved.seasonality_context)){
      seasonality.value = saved.seasonality_context;
    }
  }
}

async function saveCaseBaseline(){
  const msg = document.getElementById('caseBaselineMsg');
  const saveButton = document.getElementById('caseBaselineSave');
  const comparisonChoice = document.querySelector('[data-compare].selected')?.dataset.compare;
  if(!updatePeriodSummary()){
    msg.style.color = '#B42318';
    msg.textContent = document.getElementById('casePeriodNote').textContent || 'اختر الفترة اللي عندك عنها بيانات فعلية.';
    return;
  }
  if(!comparisonChoice){
    msg.style.color = '#B42318';
    msg.textContent = 'حدد هل تبغى تقارن بفترة سابقة.';
    return;
  }
  const payload = {
    baseline_start: document.getElementById('caseBaselineStart').value,
    baseline_end: document.getElementById('caseBaselineEnd').value,
    comparison_start: comparisonChoice === 'yes' ? document.getElementById('caseComparisonStart').value : null,
    comparison_end: comparisonChoice === 'yes' ? document.getElementById('caseComparisonEnd').value : null,
    seasonality_context: document.getElementById('caseSeasonality').value
  };
  if(comparisonChoice === 'yes'){
    const today = localIso(new Date());
    if(!payload.comparison_start || !payload.comparison_end){
      msg.style.color = '#B42318';
      msg.textContent = 'حدد الفترة السابقة، أو اختر ما عندي مقارنة الآن.';
      return;
    }
    if(payload.comparison_end > today){
      msg.style.color = '#B42318';
      msg.textContent = 'المقارنة تحتاج فترة انتهت فعليًا';
      return;
    }
    if(
      payload.comparison_start === payload.baseline_start
      && payload.comparison_end === payload.baseline_end
    ){
      msg.style.color = '#B42318';
      msg.textContent = 'الفترة السابقة لازم تكون مختلفة عن الفترة الحالية.';
      return;
    }
    if(payload.comparison_end >= payload.baseline_start){
      msg.style.color = '#B42318';
      msg.textContent = 'الفترة السابقة لازم تنتهي قبل الفترة الحالية.';
      return;
    }
  }
  try{
    saveButton.disabled = true;
    const res = await fetch(`/api/cases/${CASE_ID}/diagnostic-baseline`, {
      method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
    });
    const json = await res.json();
    if(!res.ok || !json.success) throw new Error(json.message || 'تعذر حفظ المعايرة');
    msg.style.color = '#138A72';
    msg.textContent = comparisonChoice === 'yes'
      ? 'حُفظت الفترة والفترة السابقة.'
      : 'حُفظت الفترة كنقطة بداية.';
    loadCase();
  }catch(e){
    msg.style.color = '#B42318';
    msg.textContent = e.message;
  }finally{
    saveButton.disabled = false;
  }
}

async function loadSdsSection(){
  if(!CASE_COMPANY_ID) return;
  try{
    const joiner = qs(CASE_COMPANY_ID) ? '&' : '?';
    const res  = await fetch(`/api/companies/${CASE_COMPANY_ID}/sds-question${qs(CASE_COMPANY_ID)}${joiner}case_id=${encodeURIComponent(CASE_ID)}`);
    const json = await res.json();
    if(!json.success || !json.data) return;
    const sds = json.data;

    const optHtml = sds.options.map(opt =>
      `<button class="sds-opt" onclick="sdsAnswer('${opt.replace(/'/g,"\\'")}', this)">${opt}</button>`
    ).join('');

    const sec = document.createElement('div');
    sec.className = 'sds-section';
    sec.id = 'sdsSection';
    sec.innerHTML = `
      <div class="sds-eyebrow">🧩 بقيت فجوة واحدة…</div>
      <div class="sds-q">${sds.question} <span style="font-size:11px; color:#9AA0AB; font-weight:400;">(${sds.asset_name})</span></div>
      <div class="sds-options">${optHtml}</div>
      <div class="sds-msg" id="sdsMsg">تم تحديث الصورة</div>
      <div class="sds-suggestion" id="sdsSuggestion"></div>
    `;
    document.getElementById('app').appendChild(sec);
    window._sdsMeta = sds;
  } catch(e){ /* التجاهل — SDS اختياري */ }
}

async function sdsAnswer(choice, btn){
  const sds = window._sdsMeta;
  if(!sds || !CASE_COMPANY_ID) return;
  document.querySelectorAll('.sds-opt').forEach(b => b.classList.add('saving'));
  btn.classList.add('selected');

  const title      = `${sds.question} — الإجابة: ${choice}`;
  const confMap    = { 'نعم': 90, 'جزئيًا': 60, 'قيد الإعداد': 60, 'قليل (0-2)': 90, 'متوسط (3-6)': 60 };
  const confidence = confMap[choice] || 30;

  try{
    const res  = await fetch(`/api/companies/${CASE_COMPANY_ID}/evidence`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({
        title,
        case_id:     CASE_ID,
        asset_id:    sds.asset_id,
        source_type: 'SDS-002 تشخيص تراكمي',
        source_ref: sds.question_id,
        question_id: sds.question_id,
        answer: choice,
        adaptive_answer: true,
        information_type: 'Narrative',
        verification_status: 'UNVERIFIED',
        source_category: 'SELF_REPORTED',
        confidence
      })
    });
    const json = await res.json();
    const msg  = document.getElementById('sdsMsg');
    const sug  = document.getElementById('sdsSuggestion');
    if(res.ok && json.success){
      msg.classList.add('show');
      showToast('تم تحديث الصورة');
      setTimeout(() => {
        if(json.data.next_question) location.reload();
        else location.href = json.data.result_url || `/case/${CASE_ID}/result`;
      }, 650);
    } else {
      msg.textContent = '⚠️ تعذر الحفظ — حاول مرة أخرى.';
      msg.classList.add('show');
    }
  } catch(e){
    document.getElementById('sdsMsg').textContent = '⚠️ تعذر الاتصال بالخادم.';
    document.getElementById('sdsMsg').classList.add('show');
  }
  document.querySelectorAll('.sds-opt').forEach(b => b.classList.remove('saving'));
}

async function submitApprove(id){
  const metric = (document.getElementById('mMetric').value || '').trim();
  const owner  = (document.getElementById('mOwner').value  || '').trim();
  const due    = (document.getElementById('mDue').value    || '').trim();
  const nextAction = (document.getElementById('mNextAction').value || '').trim();
  const err    = document.getElementById('mErr');
  if(!owner){ err.textContent = 'المسؤول عن التنفيذ مطلوب لاعتماد القرار.'; return; }
  if(!due){ err.textContent = 'الموعد النهائي مطلوب لاعتماد القرار.'; return; }
  if(!metric){ err.textContent = 'مقياس النجاح مطلوب لاعتماد القرار.'; return; }
  if(!nextAction){ err.textContent = 'مهمة التنفيذ التالية مطلوبة لاعتماد القرار.'; return; }
  err.textContent = '';
  const btn = document.getElementById('mConfirm');
  btn.disabled = true; btn.textContent = 'جارٍ بدء الخطوة...';
  try {
    const res = await fetch(`/api/decisions/${id}/approve`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({owner_name: owner, due_date: due, success_metric: metric, next_action: nextAction})
    });
    const json = await res.json();
    if(json.success){
      document.getElementById('approveModal').remove();
      showToast('بدأت الخطوة — وأُنشئت مهمة التنفيذ');
      loadCase();
    } else {
      err.textContent = json.message || 'تعذر بدء الخطوة — لم تتغير حالة القرار.';
      btn.disabled = false; btn.textContent = 'اعتمد وابدأ';
    }
  } catch(e) {
    err.textContent = 'تعذر الاتصال — لم تتغير حالة القرار.';
    btn.disabled = false; btn.textContent = 'اعتمد وابدأ';
  }
}

    target_value: document.getElementById('rTarget').value.trim(),
    target_source_ref: document.getElementById('rTargetSource').value.trim(),
    target_observed_at: document.getElementById('rTargetDate').value,
    actual_value: document.getElementById('rActual').value.trim(),
    actual_source_ref: document.getElementById('rActualSource').value.trim(),
    actual_observed_at: document.getElementById('rActualDate').value,
    result_summary: document.getElementById('rSummary').value.trim(),
    result_source_ref: document.getElementById('rSource').value.trim(),
    impact_outcome: document.getElementById('rOutcome').value,
    impact_notes: document.getElementById('rNotes').value.trim()
  };
  const err = document.getElementById('rErr');
  if(Object.values(payload).some(v => !v)){
    err.textContent = 'أكمل baseline وtarget وactual ومصدر وتاريخ كل قياس، ثم النتيجة وتفسير الأثر.'; return;
  }
  const btn = document.getElementById('rConfirm');
  btn.disabled = true; btn.textContent = 'جارٍ حفظ النتيجة...';
  try{
    const res = await fetch(`/api/tasks/${taskId}/p0-result`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
    });
    const json = await res.json();
    if(!res.ok || !json.success) throw new Error(json.message || 'تعذر حفظ النتيجة');
    document.getElementById('resultModal').remove();
    showToast('تم حفظ النتيجة وتوثيق الأثر');
    loadCase();
  }catch(e){
    err.textContent = e.message;
    btn.disabled = false; btn.textContent = 'حفظ النتيجة';
  }
}

async function analyzeEvidence(evidenceId){
  const box = document.getElementById(`ai-evidence-${evidenceId}`);
  if(box) box.innerHTML = `<span style="font-size:11.5px; color:#9AA0AB;">سنع يحلّل...</span>`;
  try{
    const res = await fetch(`/api/evidence/${evidenceId}/analyze`, {method:'POST'});
    const json = await res.json();
    if(!json.success){
      if(box) box.innerHTML = `<div class="ai-error">تعذر التحليل الآن. بياناتك محفوظة ويمكنك المتابعة يدويًا.</div>`;
      return;
    }
     showToast('تم فحص الدليل وفق حوكمة سنع');
    loadCase();
  }catch(e){
    if(box) box.innerHTML = `<div class="ai-error">تعذر التحليل الآن. بياناتك محفوظة ويمكنك المتابعة يدويًا.</div>`;
  }
}

async function analyzeCase(){
  const box = document.getElementById('ai-case-result');
  const profileSaved = await saveCompanySources(false);
  if(!profileSaved){
    if(box) box.innerHTML = `<div class="ai-error">صحح روابط الشركة أو احفظها قبل بدء التحليل.</div>`;
    return;
  }
  if(box) box.innerHTML = `<span style="font-size:12px; color:#9AA0AB;">سنع يحلّل القضية كاملة...</span>`;
  showToast('سنع يحلّل القضية كاملة...');
  try{
    const res = await fetch(`/api/cases/${CASE_ID}/analyze`, {method:'POST'});
    const json = await res.json();
    if(!json.success){
      if(box) box.innerHTML = `<div class="ai-error">تعذر التحليل الآن. بياناتك محفوظة ويمكنك المتابعة يدويًا.</div>`;
      return;
    }
    showToast('تم تحليل القضية كاملة بالذكاء الاصطناعي');
    loadCase();
  }catch(e){
    if(box) box.innerHTML = `<div class="ai-error">تعذر التحليل الآن. بياناتك محفوظة ويمكنك المتابعة يدويًا.</div>`;
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

loadCase();
</script>
