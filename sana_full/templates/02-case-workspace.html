<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F6FB">
<title>سنع — القضية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html{ color-scheme: light; background:#F5F6FB; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:#F5F6FB; color:#333940; font-family:'IBM Plex Sans Arabic', sans-serif; line-height:1.6; }
  .num{ font-family:'Space Grotesk', sans-serif; }
  a{ color:inherit; text-decoration:none; }

  .concept-nav{ background:#080E1F; padding:10px 20px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .concept-nav a{ font-size:11.5px; color:rgba(255,255,255,0.5); padding:6px 12px; border-radius:20px; }
  .concept-nav a.active{ background:rgba(242,178,51,0.15); color:#F2B233; font-weight:600; }

  header{ background:#080E1F; padding:14px 28px; color:#fff; display:flex; align-items:center; gap:14px; }
  .back{ font-size:12.5px; color:rgba(255,255,255,0.6); }
  .case-title{ font-weight:600; font-size:15px; }
  .tag{ background:rgba(242,178,51,0.15); color:#F2B233; font-size:11px; padding:3px 10px; border-radius:20px; }

  main{ max-width:900px; margin:0 auto; padding:26px 20px 60px; }

  .qbox{ background:#0B132B; color:#fff; border-radius:12px; padding:22px; margin-bottom:20px; }
  .qbox .lbl{ font-size:11px; color:rgba(255,255,255,0.5); margin-bottom:6px; text-transform:uppercase; letter-spacing:1px; font-family:'Space Grotesk'; }
  .qbox .declared{ font-size:13.5px; color:rgba(255,255,255,0.55); margin-bottom:14px; text-decoration:line-through; }
  .qbox .real{ font-size:17px; font-weight:600; color:#F2B233; }

  .ai-assessment{ margin-top:16px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.15); }
  .ai-assessment-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .ai-assessment-title{ font-size:12.5px; font-weight:600; color:rgba(255,255,255,0.7); }
  .ai-conf-badge{ background:rgba(242,178,51,0.15); color:#F2B233; font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:20px; font-family:'Space Grotesk'; }
  .ai-assessment-list{ list-style:none; padding:0; margin:0; }
  .ai-assessment-list li{ position:relative; padding-right:16px; margin-bottom:9px; font-size:13px; line-height:1.7; color:rgba(255,255,255,0.85); }
  .ai-assessment-list li::before{ content:"–"; position:absolute; right:0; color:#F2B233; }
  .ai-assessment-list li:last-child{ margin-bottom:0; }

  section{ background:#fff; border:1px solid #DEE1EC; border-radius:12px; padding:20px; margin-bottom:16px; }
  section h2{ font-size:14.5px; font-weight:600; color:#0B132B; margin-bottom:12px; }

  .evidence-item{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid #DEE1EC; font-size:13px; }
  .evidence-item:last-child{ border-bottom:none; }
  .evidence-item .dot{ width:6px; height:6px; border-radius:50%; background:#0EA5A5; margin-top:6px; flex-shrink:0; }
  .evidence-item .conf-tag{ font-family:'Space Grotesk'; font-size:11px; color:#6E7580; }

  .add-form{ display:flex; gap:8px; margin-top:12px; }
  .add-form input{ flex:1; padding:9px 12px; border:1px solid #DEE1EC; border-radius:7px; font-family:'IBM Plex Sans Arabic'; font-size:13px; }
  .add-form button{ padding:9px 16px; background:#0EA5A5; color:#fff; border:none; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; font-family:'IBM Plex Sans Arabic'; }

  .decision-box{ border:1px solid #DEE1EC; border-radius:10px; padding:16px; background:#F5F6FB; }
  .decision-box .t{ font-weight:600; color:#0B132B; margin-bottom:6px; }
  .decision-box .r{ font-size:12.5px; color:#6E7580; margin-bottom:12px; }
  .btn{ padding:9px 18px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; border:none; font-family:'IBM Plex Sans Arabic'; }
  .btn-primary{ background:#0B132B; color:#fff; }
  .btn-primary:disabled{ opacity:0.5; }
  .link-out{ display:inline-block; margin-top:10px; font-size:12.5px; color:#0EA5A5; font-weight:600; }
  .skeleton{ color:#9AA0AB; font-size:13px; padding:40px 0; text-align:center; }
  .ai-btn{ font-size:11px; padding:5px 10px; border-radius:6px; border:1px solid #DEE1EC; background:#fff; cursor:pointer; white-space:nowrap; font-family:'IBM Plex Sans Arabic'; }
  .ai-btn:hover{ border-color:#F2B233; }
  .ai-note{ font-size:12px; color:#0EA5A5; margin-top:4px; line-height:1.6; }
  .ai-error{ font-size:12px; color:#B23A2E; margin-top:4px; line-height:1.6; }
  .ai-case-btn{ margin-top:14px; width:100%; padding:11px; background:#0B132B; color:#fff; border:none; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:'IBM Plex Sans Arabic'; }
  .ai-case-btn:hover{ background:#131c3d; }
  #toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#0B132B; color:#fff; padding:12px 22px; border-radius:8px; font-size:13.5px; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.show{ opacity:1; }
</style>
</head>
<body>

<div class="concept-nav">
  <a href="/">① الدخول</a>
  <a href="/home">② CEO Home</a>
  <a href="/case/{{ case_id }}" class="active">③ القضية</a>
  <a href="/passport">④ جواز الشركة</a>
</div>
<script>
(function(){
  var qs = window.location.search;
  if(!qs) return;
  var current = new URLSearchParams(qs);
  document.querySelectorAll('.concept-nav a').forEach(function(a){
    var href = a.getAttribute('href');
    if(href === '/') return;
    var url = new URL(href, window.location.origin);
    ['company_id','view','admin_key'].forEach(function(k){
      if(current.has(k)) url.searchParams.set(k, current.get(k));
    });
    a.setAttribute('href', url.pathname + url.search);
  });
})();
</script>

<header>
  <a href="/home" class="back" id="backLink">← الرئيسية</a>
  <div class="case-title" id="caseTitle">...</div>
  <span class="tag" id="caseType"></span>
</header>

<main id="app">
  <div class="skeleton">يجمع سنع تفاصيل القضية...</div>
</main>

<div id="toast"></div>

<script>
const CASE_ID = "{{ case_id }}";
const VIEW = new URLSearchParams(window.location.search).get('view') === 'client' ? 'client' : 'owner';
const ADMIN_KEY = new URLSearchParams(window.location.search).get('admin_key');
let CASE_COMPANY_ID = null;

function renderAiAssessment(text, confidence){
  // ⚠ تحسين عرض فقط — لا يغيّر التحليل نفسه، فقط يقسّمه لنقاط قابلة للمسح السريع
  const cleaned = text.replace(/^\s*(تقييم سنع الشامل|التقييم الشامل)\s*:?\s*/i, '');
  const sentences = cleaned.split(/(?<=[.؟!])\s+/).map(s => s.trim()).filter(s => s.length > 3);
  const confBadge = confidence
    ? `<span class="ai-conf-badge">ثقة ${confidence}٪</span>`
    : '';
  const points = sentences.map(s => `<li>${s}</li>`).join('');
  return `
    <div class="ai-assessment">
      <div class="ai-assessment-head">
        <span class="ai-assessment-title">🧠 تقييم سنع الشامل</span>
        ${confBadge}
      </div>
      <ul class="ai-assessment-list">${points}</ul>
    </div>
  `;
}

function qs(companyId, extra){
  const p = new URLSearchParams();
  if(companyId && companyId !== 'C001') p.set('company_id', companyId);
  if(VIEW === 'client') p.set('view', 'client');
  if(ADMIN_KEY) p.set('admin_key', ADMIN_KEY);
  if(extra) Object.entries(extra).forEach(([k,v]) => p.set(k, v));
  const s = p.toString();
  return s ? `?${s}` : '';
}

async function loadCase(){
  const res = await fetch(`/api/cases/${CASE_ID}`);
  const json = await res.json();
  if(!json.success){ document.getElementById('app').innerHTML = '<p>تعذر تحميل القضية</p>'; return; }
  render(json.data);
}

function render(d){
  const c = d.case;
  CASE_COMPANY_ID = c.company_id;
  document.getElementById('backLink').href = `/home${qs(CASE_COMPANY_ID)}`;
  document.getElementById('caseTitle').textContent = c.case_title;
  document.getElementById('caseType').textContent = c.case_type || '';

  let html = `
    <div class="qbox">
      <div class="lbl">Real Question</div>
      <div class="declared">المشكلة كما وصفها المالك: "${c.declared_problem || ''}"</div>
      <div class="real">السؤال الحقيقي: ${c.real_question || ''}</div>
      ${c.ai_analysis ? renderAiAssessment(c.ai_analysis, c.confidence_score) : ''}
    </div>

    <a href="/methodology/sana-acquisition-system${qs(CASE_COMPANY_ID, {from_case: CASE_ID})}" class="link-out" style="display:inline-block; margin-bottom:16px; background:#F5F6FB; border:1px solid #DEE1EC; border-radius:8px; padding:8px 14px;">
      📘 الإطار المرجعي: نظام سنع لجلب العملاء — استخدمه لتقييم أي خطة تسويق أو مبيعات في هذه القضية ←
    </a>

    <section>
      <h2>الأدلة المرتبطة (${d.evidence.length})</h2>
  `;
  if(d.evidence.length === 0){ html += `<p style="color:#6E7580; font-size:13px;">لا توجد أدلة بعد.</p>`; }
  d.evidence.forEach(e => {
    html += `<div class="evidence-item">
      <span class="dot"></span>
      <div style="flex:1;">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:10px;">
          <div>${e.title} <span class="conf-tag">— ${e.source_type}, ثقة ${e.confidence}٪</span></div>
          <button class="ai-btn" onclick="analyzeEvidence('${e.evidence_id}')">🧠 حلّل</button>
        </div>
        <div id="ai-evidence-${e.evidence_id}">${e.ai_analysis ? `<div class="ai-note">🧠 ${e.ai_analysis}</div>` : ''}</div>
      </div>
    </div>`;
  });
  html += `
    <div class="add-form">
      <input type="text" id="newEvidence" placeholder="أضف دليلًا جديدًا...">
      <button onclick="addEvidence()">إضافة</button>
    </div>
    <button class="ai-case-btn" onclick="analyzeCase()">🧠 حلّل القضية كاملة بالذكاء الاصطناعي</button>
    <div id="ai-case-result"></div>
  </section>`;

  const decCounts = { 'معتمد': 0, 'مقترح': 0, 'قيد التنفيذ': 0 };
  d.decisions.forEach(dec => { decCounts[dec.status] = (decCounts[dec.status] || 0) + 1; });
  const decBreakdown = [
    decCounts['معتمد'] ? `${decCounts['معتمد']} معتمد` : null,
    (decCounts['مقترح'] + decCounts['قيد التنفيذ']) ? `${decCounts['مقترح'] + decCounts['قيد التنفيذ']} بانتظار الاعتماد` : null,
  ].filter(Boolean).join(' · ');
  html += `<section><h2>القرارات الناتجة (${d.decisions.length})</h2>${decBreakdown ? `<p style="font-size:12px; color:#9AA0AB; margin:-8px 0 12px;">${decBreakdown}</p>` : ''}`;
  if(d.decisions.length === 0){ html += `<p style="color:#6E7580; font-size:13px;">لا توجد قرارات بعد لهذه القضية.</p>`; }
  const decisionsByPhase = {};
  d.decisions.forEach(dec => {
    const key = dec.phase_label || null;
    (decisionsByPhase[key] = decisionsByPhase[key] || []).push(dec);
  });
  Object.keys(decisionsByPhase).forEach(phaseKey => {
    if(phaseKey !== 'null'){
      html += `<div style="font-size:12.5px; font-weight:600; color:#0EA5A5; margin:4px 0 8px;">تحت مرحلة: ${phaseKey}</div>`;
    }
    decisionsByPhase[phaseKey].forEach(dec => {
      html += `
        <div class="decision-box" style="margin-bottom:10px;">
          <div class="t">${dec.title}</div>
          <div class="r">${dec.reason || ''} — ثقة ${dec.confidence_score}٪</div>
          ${dec.structured_data ? `<a href="/services${qs(CASE_COMPANY_ID)}" class="link-out" style="margin:0 0 10px; display:inline-block;">عرض تفصيل ترتيب الخدمات ←</a><br>` : ''}
          ${dec.status==='معتمد'
            ? `<div style="font-size:12px; color:#0EA5A5; font-weight:600; margin-top:6px;">✓ تم الاعتماد${dec.owner_name ? ` — ${dec.owner_name}` : ''}${dec.due_date ? ` · ${dec.due_date}` : ''}${dec.success_metric ? `<br><span style="color:#6E7580; font-weight:400;">المقياس: ${dec.success_metric}</span>` : ''}</div>`
            : `<button class="btn btn-primary" onclick="openApproveModal('${dec.decision_id}')">اعتماد القرار</button>`
          }
        </div>`;
    });
  });
  html += `<a href="/passport${qs(CASE_COMPANY_ID)}" class="link-out">← بعد تنفيذ القرارات، شاهد أثرها على قيمة الشركة الكاملة</a></section>`;

  const requiredTasks = (d.tasks || []).filter(t => t.status !== 'منجزة');
  if(requiredTasks.length){
    const byPhaseReq = {};
    requiredTasks.forEach(t => {
      const key = t.phase_label || 'مهام أخرى';
      (byPhaseReq[key] = byPhaseReq[key] || []).push(t);
    });
    html += `<section><h2>المهام المطلوبة (${requiredTasks.length})</h2>`;
    Object.keys(byPhaseReq).forEach(phase => {
      html += `<div style="margin-bottom:14px;">
        <div style="font-size:12.5px; font-weight:600; color:#F2B233; margin-bottom:8px;">تحت مرحلة: ${phase}</div>`;
      byPhaseReq[phase].forEach(t => {
        const statusColor = t.status === 'قيد التنفيذ' ? '#0EA5A5' : '#9AA0AB';
        html += `
          <div class="evidence-item">
            <span class="dot" style="background:${statusColor};"></span>
            <div>
              <div style="font-weight:600; color:#0B132B;">${t.title}
                <span class="conf-tag" style="margin-right:6px;">— ${t.status}${t.priority ? `، أولوية ${t.priority}` : ''}${t.due_date ? `، موعده ${t.due_date}` : ''}</span>
              </div>
              ${t.value_note ? `<div style="font-size:12px; color:#6E7580; margin-top:2px;">${t.value_note}</div>` : ''}
            </div>
          </div>`;
      });
      html += `</div>`;
    });
    html += `</section>`;
  }

  const completedTasks = (d.tasks || []).filter(t => t.status === 'منجزة');
  if(completedTasks.length){
    const byPhase = {};
    completedTasks.forEach(t => {
      const key = t.phase_label || 'مهام منجزة أخرى';
      (byPhase[key] = byPhase[key] || []).push(t);
    });
    html += `<section><h2>المهام المنجزة (${completedTasks.length})</h2>`;
    Object.keys(byPhase).forEach(phase => {
      html += `<div style="margin-bottom:14px;">
        <div style="font-size:12.5px; font-weight:600; color:#0EA5A5; margin-bottom:8px;">تحت مرحلة: ${phase}</div>`;
      byPhase[phase].forEach(t => {
        html += `
          <div class="evidence-item">
            <span class="dot" style="background:#0B132B;"></span>
            <div>
              <div style="font-weight:600; color:#0B132B;">✓ ${t.title}</div>
              ${t.value_note ? `<div style="font-size:12px; color:#6E7580; margin-top:2px;">القيمة: ${t.value_note}</div>` : ''}
            </div>
          </div>`;
      });
      html += `</div>`;
    });
    html += `</section>`;
  }

  document.getElementById('app').innerHTML = html;
}

async function addEvidence(){
  const input = document.getElementById('newEvidence');
  const title = input.value.trim();
  if(!title) return;
  const res = await fetch(`/api/companies/${CASE_COMPANY_ID || 'C001'}/evidence`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({title, case_id: CASE_ID, source_type:'ملاحظة مباشرة', confidence:50})
  });
  const json = await res.json();
  if(json.success){ showToast('تمت إضافة الدليل'); input.value=''; loadCase(); }
}

// DEC-01: modal اعتماد القرار بثلاثة حقول إلزامية
function openApproveModal(decisionId){
  // أزل modal قديم إن وُجد
  const old = document.getElementById('approveModal');
  if(old) old.remove();

  const modal = document.createElement('div');
  modal.id = 'approveModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(11,19,43,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
  modal.innerHTML = `
    <div style="background:#fff;border-radius:14px;padding:28px 24px;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(11,19,43,.18);">
      <div style="font-size:16px;font-weight:700;color:#0B132B;margin-bottom:20px;text-align:center;">اعتماد القرار</div>
      <label style="display:block;font-size:12.5px;font-weight:600;color:#0B132B;margin-bottom:4px;">المسؤول عن التنفيذ</label>
      <input id="mOwner" placeholder="اسم الشخص المسؤول" style="width:100%;box-sizing:border-box;border:1.5px solid #DEE1EC;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;margin-bottom:14px;">
      <label style="display:block;font-size:12.5px;font-weight:600;color:#0B132B;margin-bottom:4px;">الموعد النهائي</label>
      <input id="mDue" type="date" style="width:100%;box-sizing:border-box;border:1.5px solid #DEE1EC;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;margin-bottom:14px;">
      <label style="display:block;font-size:12.5px;font-weight:600;color:#0B132B;margin-bottom:4px;">مقياس النجاح <span style="color:#E53935;">*</span></label>
      <input id="mMetric" placeholder="مثال: ارتفاع نسبة تحويل العملاء من 5% إلى 10%" style="width:100%;box-sizing:border-box;border:1.5px solid #DEE1EC;border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;margin-bottom:6px;">
      <div id="mErr" style="font-size:12px;color:#E53935;min-height:16px;margin-bottom:14px;"></div>
      <div style="display:flex;gap:10px;">
        <button id="mConfirm" class="btn btn-primary" style="flex:1;padding:11px;" onclick="submitApprove('${decisionId}')">اعتماد ✓</button>
        <button class="btn" style="flex:1;padding:11px;background:#F5F6FB;color:#0B132B;border:none;" onclick="document.getElementById('approveModal').remove()">إلغاء</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
  document.getElementById('mMetric').focus();
}

async function submitApprove(id){
  const metric = (document.getElementById('mMetric').value || '').trim();
  const owner  = (document.getElementById('mOwner').value  || '').trim();
  const due    = (document.getElementById('mDue').value    || '').trim();
  const err    = document.getElementById('mErr');
  if(!metric){ err.textContent = 'مقياس النجاح مطلوب لاعتماد القرار.'; return; }
  err.textContent = '';
  const btn = document.getElementById('mConfirm');
  btn.disabled = true; btn.textContent = 'جارٍ الاعتماد...';
  const res = await fetch(`/api/decisions/${id}/approve`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({owner_name: owner, due_date: due, success_metric: metric})
  });
  const json = await res.json();
  if(json.success){
    document.getElementById('approveModal').remove();
    showToast('تم اعتماد القرار — أُنشئت مهمة تنفيذية تلقائيًا');
    loadCase();
  } else {
    err.textContent = json.message || 'تعذر الاعتماد — حاول مرة أخرى.';
    btn.disabled = false; btn.textContent = 'اعتماد ✓';
  }
}

async function analyzeEvidence(evidenceId){
  const box = document.getElementById(`ai-evidence-${evidenceId}`);
  if(box) box.innerHTML = `<span style="font-size:11.5px; color:#9AA0AB;">سنع يحلّل...</span>`;
  try{
    const res = await fetch(`/api/evidence/${evidenceId}/analyze`, {method:'POST'});
    const json = await res.json();
    if(!json.success){
      if(box) box.innerHTML = `<div class="ai-error">تعذر التحليل الآن. بياناتك محفوظة ويمكنك المتابعة يدويًا.</div>`;
      return;
    }
    showToast('تم تحليل الدليل بالذكاء الاصطناعي');
    loadCase();
  }catch(e){
    if(box) box.innerHTML = `<div class="ai-error">تعذر التحليل الآن. بياناتك محفوظة ويمكنك المتابعة يدويًا.</div>`;
  }
}

async function analyzeCase(){
  const box = document.getElementById('ai-case-result');
  if(box) box.innerHTML = `<span style="font-size:12px; color:#9AA0AB;">سنع يحلّل القضية كاملة...</span>`;
  showToast('سنع يحلّل القضية كاملة...');
  try{
    const res = await fetch(`/api/cases/${CASE_ID}/analyze`, {method:'POST'});
    const json = await res.json();
    if(!json.success){
      if(box) box.innerHTML = `<div class="ai-error">تعذر التحليل الآن. بياناتك محفوظة ويمكنك المتابعة يدويًا.</div>`;
      return;
    }
    showToast('تم تحليل القضية كاملة بالذكاء الاصطناعي');
    loadCase();
  }catch(e){
    if(box) box.innerHTML = `<div class="ai-error">تعذر التحليل الآن. بياناتك محفوظة ويمكنك المتابعة يدويًا.</div>`;
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

loadCase();
</script>
