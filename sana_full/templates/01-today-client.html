<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<script>(function(){var m=document.querySelector('meta[name="csrf-token"]'),t=m.content,F=window.fetch.bind(window);window.fetch=async function(u,o){o=o||{};if(['POST','PUT','PATCH','DELETE'].includes((o.method||'GET').toUpperCase()))o.headers=Object.assign({'X-CSRFToken':t},o.headers||{});var r=await F(u,o);if(r.status===401){try{var j=await r.clone().json();if(j.redirect)window.location.assign(j.redirect)}catch(_){}}return r}})();</script>
<title>سنع — اليوم</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B132B;--gold:#F2B233;--teal:#0EA5A5;--paper:#F5F6FB;--line:#DEE1EC;--muted:#6E7580}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#333940;font-family:'IBM Plex Sans Arabic',sans-serif}
nav{height:54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:28px}
nav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:600}nav a.active{color:var(--navy);border-bottom:2px solid var(--gold);padding:17px 0}
.reset-experience{border:1px solid #D7A59F;background:#FFF8F7;color:#8F3027;border-radius:8px;padding:7px 10px;font:600 12px inherit;cursor:pointer}
main{max-width:700px;margin:42px auto;padding:0 20px 60px}.eyebrow{font-size:11px;color:var(--teal);font-weight:700;letter-spacing:1px}
h1{font-size:28px;color:var(--navy);margin:8px 0}.lead{color:var(--muted);font-size:14px;line-height:1.8;margin-bottom:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px}.label{font-size:11px;color:var(--muted);font-weight:600}.returning{margin-bottom:14px;background:var(--navy);color:#fff}.returning h2{color:#fff}.returning .reason{color:#BFC7D5}.returning .single-link{background:var(--gold);color:var(--navy)}
h2{font-size:20px;color:var(--navy);margin:6px 0}.reason{font-size:13px;line-height:1.8;color:#4D5562}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.fields input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font-family:inherit}.wide{grid-column:1/-1}
.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-family:inherit;font-weight:700;cursor:pointer}.error{font-size:12px;color:#B23A2E;min-height:20px;margin-top:8px}
.single-link{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:11px 18px;border-radius:8px;font-weight:700;margin-top:14px}
.source-card{margin-bottom:14px;padding:18px;border-right:4px solid var(--teal)}.source-card h2{font-size:16px}.source-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.source-actions .btn{width:auto;margin:0;padding:9px 14px}.source-actions .later{background:#EEF0F4;color:var(--navy)}.source-form{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.source-form input,.source-form select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-family:inherit;margin-bottom:8px;background:#fff}.source-note{font-size:11px;color:var(--muted);line-height:1.7}.source-message{font-size:12px;color:#087E7D;min-height:18px;margin-top:7px}
@media(max-width:600px){.fields{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head>
<body>
<nav><a class="active" href="/home">اليوم</a><a href="/passport">الأصول</a><a href="/logout">تسجيل الخروج</a>{% if can_reset_experience %}<button type="button" class="reset-experience" onclick="confirmExperienceReset()" aria-label="إعادة ضبط التجربة">↺ إعادة ضبط التجربة</button>{% endif %}</nav>
<main><div class="eyebrow">اليوم</div><h1>وش يستحق انتباهك الآن؟</h1><p class="lead">نبدأ بما عرفناه، ثم نكمل الناقص ونقرر الخطوة. وبعدها نتابع وش تغيّر.</p><div class="card returning"><div class="label">مراجعة سريعة</div><h2>وش تغير من آخر مرة؟</h2><div class="reason">سنراجع آخر صورة عندنا ونركز فقط على الجديد.</div><a class="single-link" href="/check-in">راجع التغيّر</a></div><div id="sourceReminder"></div><div id="card" class="card">نجهّز خطوتك التالية...</div></main>
<script>
const COMPANY_ID={{ company_id|tojson }};let currentDecision=null;
async function confirmExperienceReset(){
 const first=window.confirm('سيتم مسح بيانات التجربة الحالية لهذه الشركة فقط، مع إبقاء حساب الدخول والبريد وكلمة المرور. لا يمكن التراجع عن هذه العملية. هل تريد المتابعة؟');
 if(!first)return;
 const second=window.confirm('تأكيد أخير: هل تريد إعادة هذا الحساب إلى أول خطوة في سنع؟');
 if(!second)return;
 const r=await fetch('/api/testing/reset-experience',{method:'POST'}),j=await r.json();
 if(r.ok&&j.success){window.location.assign(j.data.redirect||'/onboarding');return}
 window.alert(j.message||'تعذر إعادة ضبط التجربة.');
}
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const sourceReminder=document.getElementById('sourceReminder');
function sourceApi(path='',options={}){return fetch(`/api/companies/${COMPANY_ID}/source-reminder${path}`,options)}
function markSourceReminderShown(){sourceApi('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'shown'})}).catch(()=>{})}
async function sourceReminderAction(action){
 try{const r=await sourceApi('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})}),j=await r.json();if(!r.ok||!j.success)throw Error();sourceReminder.innerHTML=''}catch(_){document.getElementById('sourceMessage').textContent='تعذر حفظ الاختيار الآن.'}
}
function sourceUrlForm(){
 sourceReminder.querySelector('.source-body').innerHTML=`<div class="source-form"><input id="companySourceUrl" type="url" dir="ltr" placeholder="https://example.com"><select id="companySourceType"><option value="">نوع المصدر — يُستنتج تلقائيًا</option><option value="website">الموقع الإلكتروني</option><option value="platform">منصة أو حساب اجتماعي</option><option value="other">مرجع آخر</option></select><div class="source-actions"><button class="btn" onclick="saveCompanySourceUrl()">حفظ الرابط</button><button class="btn later" onclick="sourceReminderAction('later')">إلغاء</button></div><div id="sourceMessage" class="source-message"></div></div>`;
}
function sourceFileForm(){
 sourceReminder.querySelector('.source-body').innerHTML=`<div class="source-form"><input id="companySourceFile" type="file" accept=".pdf,.doc,.docx,.txt,.csv,.xlsx,.ppt,.pptx,image/*"><div class="source-actions"><button class="btn" onclick="uploadCompanySource()">رفع الملف</button><button class="btn later" onclick="sourceReminderAction('later')">إلغاء</button></div><div class="source-note">يبقى الملف في قيد المراجعة، ولا يتحول تلقائيًا إلى حقيقة أو استنتاج.</div><div id="sourceMessage" class="source-message"></div></div>`;
}
async function saveCompanySourceUrl(){
 const url=document.getElementById('companySourceUrl').value.trim(),source_type=document.getElementById('companySourceType').value,msg=document.getElementById('sourceMessage');if(!url){msg.textContent='أضف الرابط أولًا.';return}msg.textContent='جارٍ حفظ الرابط...';
 try{const r=await sourceApi('/url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,source_type})}),j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'failed');sourceReminder.innerHTML=''}catch(e){msg.textContent=e.message==='INVALID_SOURCE_URL'?'تأكد أن الرابط صحيح.':'تعذر حفظ الرابط.'}
}
async function uploadCompanySource(){
 const input=document.getElementById('companySourceFile'),file=input.files[0],msg=document.getElementById('sourceMessage');if(!file){msg.textContent='اختر ملفًا أولًا.';return}msg.textContent='جارٍ رفع الملف...';const body=new FormData();body.append('file',file);
 try{const r=await sourceApi('/upload',{method:'POST',body}),j=await r.json();if(!r.ok||!j.success)throw Error(j.error||'failed');sourceReminder.innerHTML=''}catch(e){msg.textContent=e.message==='DUPLICATE_FILE'?'هذا الملف مضاف مسبقًا.':e.message==='FILE_TOO_LARGE'?'الحد الأقصى 50 ميجابايت.':'تعذر رفع الملف.'}
}
function renderSourceReminder(reminder){
 if(!reminder||!reminder.show){sourceReminder.innerHTML='';return}
 if(reminder.kind==='freshness'){
  sourceReminder.innerHTML=`<section class="card source-card"><div class="label">تأكيد سريع</div><h2>هل هذه المعلومات ما زالت صحيحة؟</h2><div class="source-body"><div class="source-actions"><button class="btn" onclick="sourceReminderAction('confirmed')">نعم</button><button class="btn later" onclick="sourceUrlForm()">تغيّر شيء</button></div><div id="sourceMessage" class="source-message"></div></div></section>`;
 }else{
  sourceReminder.innerHTML=`<section class="card source-card"><div class="label">اختياري</div><h2>كمّل صورة شركتك</h2><div class="reason">عندك رابط أو ملف يخلّي سنع يفهم شركتك أدق؟</div><div class="source-body"><div class="source-actions"><button class="btn" onclick="sourceUrlForm()">أضف رابطًا</button><button class="btn" onclick="sourceFileForm()">ارفع ملفًا</button><button class="btn later" onclick="sourceReminderAction('later')">لاحقًا</button></div><div id="sourceMessage" class="source-message"></div></div></section>`;
 }
 markSourceReminderShown();
}
function show(d){const firstCase=(d.cases||[])[0],dec=d.top_decision,task=d.next_task;
 if(task){document.getElementById('card').innerHTML=`<div class="label">وش تسوي الآن؟</div><h2>${esc(task.title)}</h2><div class="reason">المسؤول: ${esc(task.owner_user_id||'—')} · الموعد: ${esc(task.due_date||'—')}<br>مقياس النجاح: ${esc(task.kpi||'—')}</div><a class="single-link" href="${firstCase?`/case/${firstCase.case_id}/result`:'/passport'}">ابدأ</a>`;return}
 if(!dec){document.getElementById('card').innerHTML=`<div class="label">وش ناقص؟</div><h2>باقي كم نقطة ونكمل الصورة.</h2><div class="reason">ما لا نعرفه يبقى واضحًا إلى أن نتأكد منه؛ لا نفترض أرقامًا أو نتائج.</div><a class="single-link" href="${firstCase?`/case/${firstCase.case_id}/result`:'/case/new'}">${firstCase?'نكمل الصورة':'ابدأ من شركتك'}</a>`;return}
 currentDecision=dec;document.getElementById('card').innerHTML=`<div class="label">وش القرار؟</div><h2>${esc(dec.title)}</h2><div class="reason">${esc(dec.reason||'ننتظر وضوحًا كافيًا قبل أن نبدأ.')}</div><div class="fields"><input id="owner" placeholder="من يتولاها؟ *"><input id="due" type="date" aria-label="الموعد *"><input id="metric" class="wide" placeholder="كيف نعرف أنها نجحت؟ *"><input id="next" class="wide" placeholder="وش أول خطوة؟ *"></div><button class="btn" onclick="approve()">اعتمد وابدأ</button><div id="error" class="error"></div>`}
 async function approve(){const field=id=>document.getElementById(id),body={owner_name:field('owner').value.trim(),due_date:field('due').value,success_metric:field('metric').value.trim(),next_action:field('next').value.trim()},errorBox=field('error');if(Object.values(body).some(v=>!v)){errorBox.textContent='أكمل من يتولاها والموعد وكيف نعرف أنها نجحت.';return}const r=await fetch(`/api/decisions/${currentDecision.decision_id}/approve`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(r.ok&&j.success){location.reload()}else errorBox.textContent=j.message||'تعذر بدء الخطوة.'}
 fetch(`/api/companies/${COMPANY_ID}/summary`).then(r=>r.json()).then(j=>{renderSourceReminder(j.data.source_reminder);show(j.data)}).catch(()=>card.innerHTML='<div class="label">خطوتك التالية</div><h2>ارجع للصورة العامة</h2><div class="reason">لم نتمكن من تحديد الأولوية الآن. يمكنك العودة إلى صفحة الأصول أو المحاولة لاحقًا.</div><a class="single-link" href="/passport">عرض الحالة</a>');
</script></body></html>
