<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<meta name="color-scheme" content="light">
<title>سنع — الإدارة الداخلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#091126;--ink:#222b38;--muted:#6f7886;--line:#e3e7ee;--bg:#f5f7fa;--teal:#0b8d89;--gold:#e9aa2b;--red:#b43f36;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",sans-serif}
button,input,select{font:inherit}.num{font-family:"Space Grotesk",sans-serif}
header{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:5}
.brand{font-weight:700;font-size:18px}.internal{font-size:11px;color:var(--gold);border:1px solid rgba(233,170,43,.35);border-radius:20px;padding:3px 9px}
.search{margin-right:auto;width:min(440px,55vw);position:relative}.search input{width:100%;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:9px;padding:10px 13px;outline:none}
.search input::placeholder{color:rgba(255,255,255,.45)}#searchResults{position:absolute;top:46px;right:0;left:0;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(5,12,30,.18);max-height:360px;overflow:auto;display:none}
.search-row{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}.search-row:hover{background:#f3f7f8}.search-row small{color:var(--muted);display:block}
main{max-width:1180px;margin:auto;padding:24px 18px 70px}.headline{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}.eyebrow{color:var(--teal);font-size:11px;font-weight:700;letter-spacing:1px}.headline h1{margin:3px 0;font-size:26px}.headline p{margin:0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;padding:8px 15px;cursor:pointer}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:16px}.metric{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px}.metric b{font-size:22px;color:var(--navy);display:block}.metric span{font-size:11.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:14px}.card h2{font-size:15px;margin:0 0 12px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:16px;background:#eef2f5;color:var(--muted)}.badge.CRITICAL{background:#fdeceb;color:var(--red)}.badge.HIGH{background:#fff3d8;color:#8a6200}.badge.READY,.badge.Active{background:#e8f6f3;color:#08706d}.badge.NOT_READY,.badge.Suspended{background:#fdeceb;color:var(--red)}
.queue-item,.health-row{display:flex;align-items:flex-start;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.queue-item:last-child,.health-row:last-child{border-bottom:none}.queue-item strong{font-size:13px}.queue-item p{font-size:11.5px;color:var(--muted);margin:2px 0}.health-row{justify-content:space-between;font-size:12.5px}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:840px}th,td{text-align:right;padding:10px 9px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:top}th{color:var(--muted);font-weight:600;background:#fafbfc;position:sticky;top:0}.muted{color:var(--muted);font-size:11px}.action{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 8px;cursor:pointer;font-size:11px}.action.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.section{display:none}.section.active{display:block}.empty{color:var(--muted);font-size:13px;text-align:center;padding:24px}.loading{padding:50px;text-align:center;color:var(--muted)}
.role-note{font-size:11px;color:var(--muted)}.filters{display:flex;gap:8px;margin-bottom:12px}.filters input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:260px}
@media(max-width:900px){.metrics{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.search{width:45vw}}
@media(max-width:560px){header{padding:12px;flex-wrap:wrap}.search{order:3;width:100%;margin:0}.metrics{grid-template-columns:repeat(2,1fr)}main{padding:17px 11px 50px}.headline h1{font-size:21px}}
</style>
</head>
<body>
<header>
  <div class="brand">سنع</div><span class="internal">إدارة داخلية</span>
  <div class="search">
    <input id="globalSearch" placeholder="ابحث عن شركة، مستخدم، Case، Decision، Task، KPI، Finding">
    <div id="searchResults"></div>
  </div>
  <a href="/logout" style="color:rgba(255,255,255,.6);font-size:12px;text-decoration:none">خروج</a>
</header>
<main>
  <div class="headline"><div><span class="eyebrow">MASTER ADMIN</span><h1>ماذا يحتاج انتباهي الآن؟</h1><p>حالة سنع ورحلة P0 من مصدر البيانات الحالي.</p></div><div id="role" class="role-note"></div></div>
  <div class="tabs">
    <button class="tab active" data-tab="overview">الملخص</button>
    <button class="tab" data-tab="companies">الشركات</button>
    <button class="tab" data-tab="users">المستخدمون</button>
    <button class="tab" data-tab="queue">يحتاج تدخل</button>
    <button class="tab" data-tab="audit">سجل التدقيق</button>
  </div>
  <section id="overview" class="section active"><div class="loading">جارٍ جمع الحالة التشغيلية...</div></section>
  <section id="companies" class="section"><div class="loading">جارٍ تحميل الشركات...</div></section>
  <section id="users" class="section"><div class="loading">جارٍ تحميل المستخدمين...</div></section>
  <section id="queue" class="section"><div class="loading">جارٍ بناء قائمة التدخل...</div></section>
  <section id="audit" class="section"><div class="loading">جارٍ تحميل السجل...</div></section>
</main>
<script>
const csrf=document.querySelector('meta[name="csrf-token"]').content;
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){options.headers=Object.assign({'X-CSRFToken':csrf},options.headers||{});const r=await fetch(url,options);const j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||j.error||'تعذر الطلب');return j.data}
function metric(label,value){return `<div class="metric"><b class="num">${esc(value)}</b><span>${esc(label)}</span></div>`}
function queueHtml(items){if(!items.length)return '<div class="empty">لا توجد حالات تحتاج تدخلًا الآن.</div>';return items.map(x=>`<div class="queue-item"><span class="badge ${esc(x.priority)}">${esc(x.priority)}</span><div><strong>${esc(x.title)}</strong><p>${esc(x.reason)}</p><span class="muted">${esc(x.type)} · ${esc(x.entity_id)}</span></div></div>`).join('')}
function healthHtml(s){const sched=s.schedulers||{};return [
  ['التطبيق',s.app],['قاعدة البيانات',s.database],['Supabase',s.supabase],
  ['Railway',s.railway],['آخر deployment',s.last_deployment],
  ['آخر خطأ حرج',s.last_critical_error],
  ['Schedulers',`reminders=${sched.execution_reminders} · backup=${sched.knowledge_backup} · research=${sched.research}`]
].map(([k,v])=>`<div class="health-row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}
async function loadOverview(){const d=await api('/api/admin/overview');document.getElementById('role').textContent=`صلاحيتك: ${d.role}`;const m=d.metrics;document.getElementById('overview').innerHTML=`
  <div class="metrics">${metric('الشركات',m.companies)}${metric('المستخدمون النشطون',m.active_users)}${metric('الحالات المفتوحة',m.open_cases)}${metric('الحالات المكتملة',m.completed_cases)}${metric('Sana Scans',m.scans)}${metric('Diagnostic Reviews',m.diagnostic_reviews)}${metric('القرارات المفتوحة',m.open_decisions)}${metric('المهام المفتوحة',m.open_tasks)}${metric('Impact Reviews',m.impact_reviews)}${metric('Evidence غير كافٍ',m.evidence_gaps)}${metric('يحتاج تدخل',m.needs_attention)}</div>
  <div class="grid"><div class="card"><div class="card-head"><h2>يحتاج تدخل</h2><button class="action" onclick="showTab('queue')">عرض الكل</button></div>${queueHtml(d.queue_preview)}</div>
  <div class="card"><h2>System Health</h2>${healthHtml(d.system)}</div></div>`}
async function loadCompanies(){const rows=await api('/api/admin/companies');document.getElementById('companies').innerHTML=`<div class="card"><div class="card-head"><h2>الشركات</h2><span class="badge">${rows.length}</span></div><div class="table-wrap"><table><thead><tr><th>الشركة</th><th>الحالة</th><th>مرحلة P0</th><th>آخر Scan</th><th>Top Bottleneck</th><th>المهام</th><th>Evidence</th><th>إجراء</th></tr></thead><tbody>${rows.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="muted">${esc(c.company_id)} · ${esc(c.users_active)} مستخدم</div></td><td><span class="badge ${esc(c.status)}">${esc(c.status)}</span></td><td>${esc(c.p0_phase)}</td><td>${esc(c.latest_scan?.status||'NOT_RUN')}</td><td>${esc(c.top_bottleneck)}</td><td>${esc(c.open_tasks)} مفتوحة${c.overdue_tasks?` · ${esc(c.overdue_tasks)} متأخرة`:''}</td><td><span class="badge ${esc(c.evidence_readiness.status)}">${esc(c.evidence_readiness.status)}</span></td><td><button class="action primary" onclick="openCompany('${esc(c.company_id)}')">فتح داخلي</button> <button class="action" onclick="changeCompanyStatus('${esc(c.company_id)}','${esc(c.status)}')">الحالة</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function openCompany(id){const c=await api(`/api/admin/companies/${encodeURIComponent(id)}`);alert(`${c.name}\nمرحلة P0: ${c.p0_phase}\nEvidence: ${c.evidence_readiness.status}\nآخر قرار: ${c.latest_decision?.title||'—'}\nآخر Impact: ${c.latest_impact_review?.impact_outcome||'—'}`);loadAudit()}
async function changeCompanyStatus(id,current){const status=prompt('الحالة: Active / Trial / Suspended / Archived',current);if(!status)return;const reason=prompt('سبب التغيير (إلزامي)');if(!reason)return;await api(`/api/admin/companies/${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({lifecycle_status:status,reason})});loadCompanies();loadOverview();loadAudit()}
async function loadUsers(q=''){const rows=await api(`/api/admin/users?q=${encodeURIComponent(q)}`);document.getElementById('users').innerHTML=`<div class="card"><div class="card-head"><h2>المستخدمون</h2><span class="badge">${rows.length}</span></div><div class="filters"><input id="userFilter" placeholder="بحث بالبريد أو الشركة" value="${esc(q)}"><button class="action" onclick="loadUsers(document.getElementById('userFilter').value)">بحث</button></div><div class="table-wrap"><table><thead><tr><th>الحساب</th><th>الشركة</th><th>الدور</th><th>الحالة</th><th>آخر دخول</th><th>إجراء</th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u.email)}<div class="muted">${esc(u.account_id)}</div></td><td>${esc(u.company_name)}<div class="muted">${esc(u.company_id)}</div></td><td>${esc(u.admin_role)}</td><td><span class="badge">${esc(u.account_status)}</span></td><td>${esc(u.last_login_at)}</td><td><button class="action" onclick="toggleUser('${esc(u.account_id)}','${u.account_status==='active'?'disabled':'active'}')">${u.account_status==='active'?'تعطيل':'تفعيل'}</button> <button class="action" onclick="changeRole('${esc(u.account_id)}','${esc(u.admin_role)}')">الدور</button></td></tr>`).join('')}</tbody></table></div></div>`}
async function toggleUser(id,status){const reason=prompt('سبب التغيير (إلزامي)');if(!reason)return;await api(`/api/admin/users/${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({account_status:status,reason})});loadUsers();loadAudit()}
async function changeRole(id,current){const role=prompt('الدور: USER / ADMIN / SUPER_ADMIN',current);if(!role)return;const reason=prompt('سبب تغيير الصلاحية (إلزامي)');if(!reason)return;try{await api(`/api/admin/users/${encodeURIComponent(id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin_role:role,reason})});loadUsers();loadAudit()}catch(e){alert(e.message)}}
async function loadQueue(){const rows=await api('/api/admin/ops-queue');document.getElementById('queue').innerHTML=`<div class="card"><div class="card-head"><h2>يحتاج تدخل</h2><span class="badge">${rows.length}</span></div>${queueHtml(rows)}</div>`}
async function loadAudit(){const rows=await api('/api/admin/audit');document.getElementById('audit').innerHTML=`<div class="card"><div class="card-head"><h2>سجل العمليات الحساسة</h2><span class="badge">${rows.length}</span></div><div class="table-wrap"><table><thead><tr><th>الوقت</th><th>الفاعل</th><th>العملية</th><th>الهدف</th><th>الشركة</th><th>السبب</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.actor_email)}</td><td>${esc(x.action)}</td><td>${esc(x.target_type)} · ${esc(x.target_id)}</td><td>${esc(x.company_id)}</td><td>${esc(x.reason)}</td></tr>`).join('')}</tbody></table></div></div>`}
function showTab(id){document.querySelectorAll('.section').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===id));({overview:loadOverview,companies:loadCompanies,users:loadUsers,queue:loadQueue,audit:loadAudit}[id]||(()=>{}))()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
let searchTimer;document.getElementById('globalSearch').oninput=e=>{clearTimeout(searchTimer);const q=e.target.value.trim(),box=document.getElementById('searchResults');if(q.length<2){box.style.display='none';return}searchTimer=setTimeout(async()=>{try{const rows=await api(`/api/admin/search?q=${encodeURIComponent(q)}`);box.innerHTML=rows.length?rows.map(x=>`<div class="search-row" onclick="searchSelect('${esc(x.company_id)}')"><b>${esc(x.title)}</b><small>${esc(x.type)} · ${esc(x.id)} · ${esc(x.company_id)}</small></div>`).join(''):'<div class="empty">لا نتائج</div>';box.style.display='block'}catch(e){box.style.display='none'}},250)};
function searchSelect(companyId){document.getElementById('searchResults').style.display='none';showTab('companies');setTimeout(()=>openCompany(companyId),300)}
Promise.all([loadOverview(),loadCompanies(),loadUsers(),loadQueue(),loadAudit()]).catch(e=>{document.getElementById('overview').innerHTML=`<div class="card"><b>تعذر تحميل لوحة الإدارة</b><p class="muted">${esc(e.message)}</p></div>`});
</script>
</body>
</html>
