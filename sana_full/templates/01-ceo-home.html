<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F6FB">
<title>سنع — CEO Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html{ color-scheme: light; background:#F5F6FB; }
  :root{
    --navy:#0B132B; --navy-deep:#080E1F; --teal:#0EA5A5; --teal-light:#E1F5F5;
    --gold:#F2B233; --paper:#F5F6FB; --paper-warm:#EBEDF5; --ink:#333940; --slate:#6E7580;
    --line:#DEE1EC; --red-risk:#B23A2E;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:#F5F6FB; color:#333940; font-family:'IBM Plex Sans Arabic', sans-serif; line-height:1.6; }
  .num{ font-family:'Space Grotesk', sans-serif; }
  a{ color:inherit; text-decoration:none; }

  .concept-nav{ background:#080E1F; padding:10px 20px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .concept-nav a{ font-size:11.5px; color:rgba(255,255,255,0.5); padding:6px 12px; border-radius:20px; }
  .concept-nav a.active{ background:rgba(242,178,51,0.15); color:#F2B233; font-weight:600; }

  header{ background:#080E1F; padding:16px 28px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(255,255,255,0.08); }
  .brand{ display:flex; align-items:center; gap:10px; color:#fff; font-weight:600; }
  .brand .mark{ width:26px; height:26px; }
  .company-chip{ background:rgba(255,255,255,0.06); color:#fff; padding:5px 12px; border-radius:20px; font-size:12.5px; display:flex; align-items:center; gap:6px; }
  .company-chip .dot{ width:6px; height:6px; border-radius:50%; background:#4CAF7D; }

  .context-bar{ background:#fff; border-bottom:1px solid #DEE1EC; padding:10px 28px; display:flex; justify-content:space-between; font-size:12px; color:#6E7580; }
  .state-badge{ background:#EBEDF5; padding:3px 10px; border-radius:20px; }

  main{ max-width:1000px; margin:0 auto; padding:28px 20px 60px; }
  .eyebrow{ font-family:'Space Grotesk'; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#0EA5A5; font-weight:600; margin-bottom:12px; display:block; }
  h1{ font-size:clamp(20px,3vw,28px); font-weight:600; color:#0B132B; margin-bottom:20px; }
  h1 .hl{ color:#F2B233; }

  .grid5{ display:grid; grid-template-columns:repeat(5,1fr); border:1px solid #DEE1EC; background:#fff; border-radius:10px; overflow:hidden; margin-bottom:28px; }
  .cell{ padding:16px 14px; border-left:1px solid #DEE1EC; }
  .cell:last-child{ border-left:none; }
  .cell .label{ font-size:10.5px; color:#6E7580; margin-bottom:6px; }
  .cell .val{ font-family:'Space Grotesk'; font-size:18px; font-weight:600; color:#0B132B; }
  .cell.gold .val{ color:#F2B233; }
  .cell.risk .val{ color:#B23A2E; font-size:13px; font-family:'IBM Plex Sans Arabic'; }
  .cell.opp .val{ color:#0EA5A5; font-size:13px; font-family:'IBM Plex Sans Arabic'; }

  section{ background:#fff; border:1px solid #DEE1EC; border-radius:12px; padding:22px; margin-bottom:18px; }
  section h2{ font-size:15.5px; font-weight:600; color:#0B132B; margin-bottom:14px; }
  .decision-title{ font-size:16px; font-weight:600; color:#0B132B; margin-bottom:6px; }
  .decision-reason{ color:#6E7580; font-size:13px; margin-bottom:16px; }
  .btn{ padding:10px 20px; border-radius:7px; font-size:13.5px; font-weight:600; cursor:pointer; border:none; font-family:'IBM Plex Sans Arabic'; }
  .btn-primary{ background:#0B132B; color:#fff; }
  .btn-primary:disabled{ opacity:0.5; cursor:not-allowed; }
  .asset-row{ display:grid; grid-template-columns:110px 1fr 40px auto; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid #DEE1EC; font-size:13px; }
  .asset-row:last-child{ border-bottom:none; }
  .bar{ height:6px; background:#EBEDF5; border-radius:4px; overflow:hidden; }
  .bar span{ display:block; height:100%; }
  .weak{ background:#B23A2E; } .mid{ background:#F2B233; } .strong{ background:#0EA5A5; }
  .diff-tag{ font-family:'Space Grotesk'; font-size:11px; font-weight:600; padding:2px 7px; border-radius:20px; white-space:nowrap; }
  .diff-pos{ background:#E1F5F5; color:#0EA5A5; }
  .diff-neg{ background:#FDECEA; color:#B23A2E; }
  .diff-zero{ background:#EBEDF5; color:#6E7580; }
  .link-out{ display:inline-block; margin-top:10px; font-size:12.5px; color:#0EA5A5; font-weight:600; }
  .suggest-card{ background:#F5F6FB; border:1px solid #DEE1EC; border-radius:10px; padding:14px 16px; margin-top:12px; }
  .suggest-card:not(:last-child){ margin-bottom:10px; }
  .suggest-card .sc-asset{ font-family:'Space Grotesk'; font-size:10.5px; font-weight:600; letter-spacing:1px; text-transform:uppercase; color:#0EA5A5; margin-bottom:6px; }
  .suggest-card .sc-title{ font-size:13.5px; font-weight:600; color:#0B132B; margin-bottom:4px; }
  .suggest-card .sc-action{ font-size:12.5px; color:#333940; margin-bottom:4px; }
  .suggest-card .sc-reason{ font-size:12px; color:#6E7580; }
  .suggest-card .sc-existing{ font-size:11px; color:#F2B233; font-weight:600; margin-top:6px; }
  #toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#0B132B; color:#fff; padding:12px 22px; border-radius:8px; font-size:13.5px; opacity:0; transition:opacity .3s; pointer-events:none; }
  #toast.show{ opacity:1; }
  .skeleton{ color:#9AA0AB; font-size:13px; padding:20px 0; text-align:center; }
</style>
</head>
<body>

<div class="concept-nav">
  <a href="/">① الدخول</a>
  <a href="/home" class="active">② CEO Home</a>
  <a href="/case/new" id="caseNavLink">③ القضية</a>
  <a href="/passport">④ جواز الشركة</a>
</div>
<script>
(function(){
  var qs = window.location.search;
  if(!qs) return;
  var current = new URLSearchParams(qs);
  document.querySelectorAll('.concept-nav a').forEach(function(a){
    var href = a.getAttribute('href');
    if(href === '/') return;
    var url = new URL(href, window.location.origin);
    ['company_id','view','admin_key'].forEach(function(k){
      if(current.has(k)) url.searchParams.set(k, current.get(k));
    });
    a.setAttribute('href', url.pathname + url.search);
  });
})();
</script>

<header>
  <div class="brand">
    <svg class="mark" viewBox="0 0 100 100"><path d="M78,32 L78,17 L19,17 L19,83 L78,83 L78,68" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="square"/><rect x="44" y="41" width="19" height="19" fill="#F2B233"/></svg>
    سنع
  </div>
  <div style="display:flex; align-items:center; gap:10px;">
    <span class="state-badge" id="viewModeBadge" style="display:none; background:rgba(242,178,51,0.15); color:#F2B233;">بوابة العميل</span>
    <div class="company-chip"><span class="dot"></span> <span id="companyName">...</span></div>
    <select id="companySwitcher" onchange="switchCompany(this.value)" style="display:none; font-family:'IBM Plex Sans Arabic'; font-size:12px; border-radius:20px; border:none; background:rgba(255,255,255,0.1); color:#fff; padding:5px 10px;"></select>
  </div>
</header>

<div class="context-bar">
  <div>الرئيسية</div>
  <div id="adminTools" style="display:flex; gap:10px; align-items:center;">
    <span class="state-badge">قيد التنفيذ</span>
    <span class="state-badge">النضج: Level 2</span>
    <a href="/case/new" onclick="this.href='/case/new'+CQS" style="color:#0EA5A5; font-weight:600;">+ تشخيص جديد</a>
    <a href="/sop-builder" onclick="this.href='/sop-builder'+CQS" style="color:#6E7580; font-weight:600;">📄 بناء SOP</a>
    <a href="/assessment" onclick="this.href='/assessment'+CQS" style="color:#6E7580; font-weight:600;">📊 تقييم سريع</a>
  </div>
</div>

<main id="app">
  <div class="skeleton">يجمع سنع بيانات الشركة...</div>
</main>

<div id="toast"></div>

<script>
const COMPANY_ID = new URLSearchParams(window.location.search).get('company_id') || "{{ default_company_id }}";
const VIEW = new URLSearchParams(window.location.search).get('view') === 'client' ? 'client' : 'owner';
const ADMIN_KEY = new URLSearchParams(window.location.search).get('admin_key');

function barClass(score){ if(score<40) return 'weak'; if(score<65) return 'mid'; return 'strong'; }

// يحافظ على اختيار الشركة (والوضع الحالي) عند التنقّل بين الصفحات
const CQS = (() => {
  const p = new URLSearchParams();
  if(COMPANY_ID !== 'C001') p.set('company_id', COMPANY_ID);
  if(VIEW === 'client') p.set('view', 'client');
  if(ADMIN_KEY) p.set('admin_key', ADMIN_KEY);
  const s = p.toString();
  return s ? `?${s}` : '';
})();

if(VIEW === 'client'){
  // وضع العميل: بيانات شركته فقط، بدون أدوات الإدارة العامة أو التبديل بين الشركات
  document.getElementById('adminTools').style.display = 'none';
  document.getElementById('viewModeBadge').style.display = 'inline-block';
} else {
  // وضع صاحب سنع: يمكنه التبديل بين كل الشركات المسجلة
  loadCompanySwitcher();
}

async function loadCompanySwitcher(){
  try{
    const res = await fetch('/api/companies');
    const json = await res.json();
    if(!json.success || !json.data.length) return;
    const sel = document.getElementById('companySwitcher');
    sel.innerHTML = json.data.map(c =>
      `<option value="${c.company_id}" ${c.company_id === COMPANY_ID ? 'selected' : ''}>${c.name}</option>`
    ).join('');
    sel.style.display = 'inline-block';
  }catch(e){ /* تجاهل بصمت — التبديل ميزة إضافية وليست جوهرية للعرض */ }
}

function switchCompany(companyId){
  const p = new URLSearchParams();
  if(companyId !== 'C001') p.set('company_id', companyId);
  if(ADMIN_KEY) p.set('admin_key', ADMIN_KEY);
  const s = p.toString();
  window.location.href = `/home${s ? '?' + s : ''}`;
}

// يُبقي استدعاءات fetch للـ API الخاصة بالشركة تعمل في وضع العرض الداخلي للمشرف
// (?admin_key=...)، بنفس طريقة CQS الحالية للروابط — دون أي تغيير في السلوك
// لحساب عميل حقيقي مسجَّل الدخول (لا يضيف شيئًا إذا ADMIN_KEY غير موجود).
function apiQS(){
  return ADMIN_KEY ? `?admin_key=${encodeURIComponent(ADMIN_KEY)}` : '';
}

async function loadData(){
  const res = await fetch(`/api/companies/${COMPANY_ID}/summary${apiQS()}`);
  const json = await res.json();
  if(!json.success){ document.getElementById('app').innerHTML = '<p>تعذر تحميل البيانات</p>'; return; }
  render(json.data);
}

let lastSuggestions = null;

function render(d){
  const c = d.company;
  document.getElementById('companyName').textContent = `${c.name} — ${c.sector}`;
  const topDecision = d.top_decision;

  // تحديث رابط القضية في شريط التنقل بأول قضية حقيقية للشركة، أو صفحة إنشاء قضية إن لم توجد
  const caseNavLink = document.getElementById('caseNavLink');
  if(caseNavLink){
    const firstCase = d.cases && d.cases[0];
    caseNavLink.href = firstCase ? `/case/${firstCase.case_id}${CQS}` : `/case/new${CQS}`;
  }

  let html = '';

  // ⚠ جلسة أولى: كل الأصول صفر ولا يوجد أي نشاط بعد — رسالة ترحيبية بدل أرقام مربكة بلا سياق
  const isFirstSession = d.quality_score === 0 && d.open_decisions_count === 0 && !topDecision;
  if(isFirstSession){
    html += `
      <span class="eyebrow">مرحبًا بك في سنع</span>
      <h1>شركتك جديدة هنا — لا توجد بيانات بعد، وهذا طبيعي تمامًا.</h1>
      <p style="color:#6E7580; font-size:13.5px; margin:8px 0 20px; line-height:1.7;">
        الدرجة 0/100 لكل الأصول لأنه لا توجد أدلة أو قرارات مسجَّلة بعد — لا لأن شركتك ضعيفة. ابدأ بأي من الخيارين:
      </p>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <a href="/case/new${CQS}" class="btn btn-primary" style="text-align:center; display:block;">🔍 ابدأ تشخيصًا جديدًا</a>
        <a href="/company/${COMPANY_ID}/tasks-board" class="btn btn-primary" style="text-align:center; display:block; background:#0B132B;">📋 طبّق حزمة مهام جاهزة لقطاعك</a>
      </div>
    `;
    document.getElementById('app').innerHTML = html;
    return;
  }

  html += `
    <span class="eyebrow">الملخص التنفيذي</span>
    <h1>أكبر فرصة اليوم في <span class="hl">${d.weakest_asset ? d.weakest_asset.asset_name : ''}</span>.${topDecision ? ' قرار واحد ينتظر اعتمادك.' : ''}</h1>

    <div class="grid5">
      <div class="cell gold"><div class="label">الدرجة</div><div class="val num">${d.quality_score}<span style="font-size:11px;">/100</span></div></div>
      <div class="cell"><div class="label">الإيرادات</div><div class="val num">${(c.annual_revenue/1000).toFixed(0)}<span style="font-size:10px;">ألف</span></div></div>
      <div class="cell risk"><div class="label">أهم خطر</div><div class="val">${d.weakest_asset ? d.weakest_asset.asset_name + ' ضعيف' : '—'}</div></div>
      <div class="cell opp"><div class="label">أهم فرصة</div><div class="val">${topDecision ? topDecision.title : '—'}</div></div>
      <div class="cell"><div class="label">بانتظار اعتمادك</div><div class="val num">${d.open_decisions_count}</div></div>
    </div>

    <section id="scoreExplainSection">
      <button onclick="toggleScoreExplain()" id="scoreExplainToggle" style="width:100%; text-align:right; background:#fff; border:1px solid #DEE1EC; border-radius:10px; padding:12px 16px; font-size:13.5px; font-weight:600; color:#0B132B; cursor:pointer; font-family:'IBM Plex Sans Arabic';">
        💡 لماذا هذه الدرجة؟ وماذا لو نفّذت القرارات المعتمدة؟
      </button>
      <div id="scoreExplainBody" style="display:none; margin-top:10px;"></div>
    </section>
  `;

  if(topDecision){
    const alreadyApproved = topDecision.status === 'معتمد';
    html += `
    <section>
      <h2>القرار المطلوب اليوم</h2>
      <div class="decision-title">${topDecision.title}</div>
      <div class="decision-reason">${topDecision.reason || ''}</div>
      ${alreadyApproved
        ? `<div style="font-size:12.5px; color:#6E7580; margin:10px 0;">
             ${topDecision.owner_name ? `👤 المسؤول: ${topDecision.owner_name}` : ''}
             ${topDecision.due_date ? ` · 📅 الموعد: ${topDecision.due_date}` : ''}
             ${(!topDecision.owner_name && !topDecision.due_date) ? 'لم يُحدَّد مسؤول أو موعد لهذا القرار.' : ''}
           </div>`
        : `<div style="display:flex; gap:8px; margin:12px 0;">
             <input id="ownerInput" type="text" placeholder="المسؤول عن التنفيذ (اختياري)" style="flex:1; padding:9px 10px; border:1px solid #DEE1EC; border-radius:8px; font-size:13px; font-family:'IBM Plex Sans Arabic';">
             <input id="dueDateInput" type="date" style="padding:9px 10px; border:1px solid #DEE1EC; border-radius:8px; font-size:13px; font-family:'IBM Plex Sans Arabic';">
           </div>`
      }
      <button class="btn btn-primary" onclick="approveDecision('${topDecision.decision_id}')" ${alreadyApproved?'disabled':''}>
        ${alreadyApproved ? 'تم الاعتماد ✓' : 'اعتماد القرار'}
      </button>
      ${topDecision.case_id ? `<a href="/case/${topDecision.case_id}${CQS}" class="link-out" style="display:block; margin-top:12px;">← افتح القضية الكاملة لرؤية التفاصيل والأدلة</a>` : ''}
    </section>`;
  } else {
    // Section 17: لا يوجد قرار مقترح أو قيد التنفيذ
    html += `
    <section style="background:#F5F6FB; border:1px solid #DEE1EC; border-radius:12px; padding:20px 18px; text-align:center;">
      <div style="font-size:14px; font-weight:600; color:#0B132B; margin-bottom:8px;">لم نحدد فرصة التحسين الأولى بعد.</div>
      <div style="font-size:13px; color:#6E7580; margin-bottom:14px; line-height:1.7;">صف مشكلة حقيقية في شركتك وسنع يحوّلها إلى قرار مدعوم بدليل.</div>
      <a href="/case/new${CQS}" class="btn btn-primary" style="display:inline-block; padding:10px 22px;">ابدأ التشخيص</a>
    </section>`;
  }

  // ⚠ هذي القيم خاصة بأثر مشرق (C001) فقط منذ البداية — لا تُطبَّق على أي شركة أخرى
  // (كانت تُطبَّق خطأً على الجميع سابقًا، منتجة فروقات غلط لأي شركة غير C001)
  const baselineScores = COMPANY_ID === 'C001'
    ? { Knowledge: 18, Operations: 41, Brand: 72, Data: 65, Independence: 22 }
    : {};
  html += `<section><h2>خريطة الأصول</h2>`;
  d.assets.forEach(a => {
    const baseline = baselineScores[a.asset_type];
    const diff = (baseline !== undefined) ? a.current_score - baseline : null;
    let diffTag = '';
    if(diff !== null){
      if(diff > 0) diffTag = `<span class="diff-tag diff-pos num">+${diff}</span>`;
      else if(diff < 0) diffTag = `<span class="diff-tag diff-neg num">${diff}</span>`;
      else diffTag = `<span class="diff-tag diff-zero num">0</span>`;
    }
    html += `<div class="asset-row"><div>${a.asset_name}</div><div class="bar"><span class="${barClass(a.current_score)}" style="width:${a.current_score}%"></span></div><div class="num" style="text-align:left;">${a.current_score}</div>${diffTag}</div>`;
  });
  html += `<a href="/passport${CQS}" class="link-out">← شاهد كيف تتحول هذه الأصول إلى قيمة الشركة الكاملة (Business Passport)</a>
    <button class="btn btn-primary" id="suggestBtn" onclick="suggestDecisions()" style="margin-top:16px;">💡 اقترح 3 قرارات لأضعف الأصول</button>
    <div id="suggestPanel"></div>
  </section>`;

  html += `<section><h2>المهام الحالية</h2>
    <a href="/company/${COMPANY_ID}/tasks-board" class="link-out" style="display:inline-block; margin-bottom:12px;">📋 افتح لوحة المهام الكاملة (حزم جاهزة + تقرير سير العمل) ←</a>`;
  if(d.tasks && d.tasks.length){
    d.tasks.forEach(t => {
      const done = t.status === 'منجزة';
      html += `<div class="asset-row" style="grid-template-columns:1fr auto;">
        <div>${t.title}${done ? ' <span style="color:#4CAF7D; font-size:12px;">— منجزة ✓</span>' : ''}</div>
        <div style="text-align:left;">${done ? '' : `<button class="btn btn-primary" onclick="completeTask('${t.task_id}')">إنجاز المهمة</button>`}</div>
      </div>`;
    });
  } else {
    html += `<div class="decision-reason" style="text-align:center; padding:12px 0;">اعتمد قرارًا وسيحوّله سنع إلى خطوات. <a href="/case/new${CQS}" style="color:#0EA5A5; font-weight:600; text-decoration:none;">ابدأ التشخيص ←</a></div>`;
  }
  html += `</section>`;

  document.getElementById('app').innerHTML = html;
  renderSuggestPanel();
}

function renderSuggestPanel(){
  const panel = document.getElementById('suggestPanel');
  if(!panel || !lastSuggestions) return;
  if(!lastSuggestions.length){
    panel.innerHTML = `<div class="decision-reason" style="margin-top:12px;">لا توجد أصول لاقتراح قرارات لها.</div>`;
    return;
  }
  panel.innerHTML = lastSuggestions.map(s => `
    <div class="suggest-card">
      <div class="sc-asset">${s.asset_name} — ${s.current_score}/100</div>
      <div class="sc-title">${s.title}</div>
      <div class="sc-action">${s.recommended_action}</div>
      <div class="sc-reason">${s.reason}</div>
      ${s.created ? '' : '<div class="sc-existing">⚠ يوجد مسبقًا قرار مقترح لهذا الأصل — لم يُنشأ قرار مكرر.</div>'}
    </div>
  `).join('');
}

async function approveDecision(id){
  const ownerEl = document.getElementById('ownerInput');
  const dueEl = document.getElementById('dueDateInput');
  const res = await fetch(`/api/decisions/${id}/approve${apiQS()}`, {
    method:'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      owner_name: ownerEl ? ownerEl.value : '',
      due_date: dueEl ? dueEl.value : '',
    })
  });
  const json = await res.json();
  if(json.success){ showToast('تم اعتماد القرار — أُنشئت مهمة تنفيذية تلقائيًا'); loadData(); }
}

let scoreExplainLoaded = false;
async function toggleScoreExplain(){
  const body = document.getElementById('scoreExplainBody');
  const isOpen = body.style.display !== 'none';
  if(isOpen){ body.style.display = 'none'; return; }
  body.style.display = 'block';
  if(scoreExplainLoaded) return;
  body.innerHTML = `<p style="font-size:12.5px; color:#9AA0AB; padding:4px 2px;">جارٍ التحميل...</p>`;
  const res = await fetch(`/api/companies/${COMPANY_ID}/score-explanation${apiQS()}`);
  const json = await res.json();
  if(!json.success){ body.innerHTML = `<p style="font-size:12.5px; color:#9AA0AB;">تعذّر تحميل التفاصيل.</p>`; return; }
  scoreExplainLoaded = true;
  const d = json.data;

  let html = '';
  html += `<div style="background:#fff; border:1px solid #DEE1EC; border-radius:10px; padding:14px 16px; margin-bottom:8px;">
    <div style="font-size:12px; color:#9AA0AB; font-weight:600; margin-bottom:8px;">لماذا الدرجة ${d.current_score}؟ — آخر ما أثّر فيها فعليًا</div>`;
  if(d.recent_changes.length === 0){
    html += `<p style="font-size:12.5px; color:#9AA0AB;">لا توجد مهام مُنجزة بعد تؤثر على الدرجة.</p>`;
  } else {
    d.recent_changes.forEach(c => {
      html += `<div style="font-size:12.5px; padding:5px 0; border-bottom:1px solid #F0F1F5; display:flex; justify-content:space-between;">
        <span>${c.title} <span style="color:#9AA0AB;">(${c.asset_name})</span></span>
        <span style="color:#0E7C7B; font-weight:600;">+${c.impact}</span>
      </div>`;
    });
  }
  html += `</div>`;

  html += `<div style="background:#FCEFD2; border:1px solid #F2B233; border-radius:10px; padding:14px 16px;">
    <div style="font-size:12px; color:#8a6414; font-weight:600; margin-bottom:8px;">⚠ متوقَّع لا مضمون — ماذا لو نفّذت القرارات المعتمدة الحالية؟</div>`;
  if(d.pending_decisions.length === 0){
    html += `<p style="font-size:12.5px; color:#8a6414;">لا توجد قرارات معتمدة بانتظار التنفيذ حاليًا.</p>`;
  } else {
    d.pending_decisions.forEach(p => {
      html += `<div style="font-size:12.5px; padding:4px 0; color:#5c4a10;">— ${p.title} <span style="opacity:0.7;">(${p.asset_name}، +${p.impact})</span></div>`;
    });
    html += `<div style="margin-top:10px; padding-top:10px; border-top:1px solid rgba(184,134,11,0.3); font-size:14px; font-weight:700; color:#0B132B;">
      الدرجة المتوقَّعة: ${d.projected_score}/100 <span style="color:#0E7C7B; font-weight:600;">(+${d.projected_delta})</span>
    </div>`;
  }
  html += `</div>`;

  body.innerHTML = html;
}

async function completeTask(id){
  const res = await fetch(`/api/tasks/${id}/complete${apiQS()}`, {method:'POST'});
  const json = await res.json();
  if(json.success){
    const assets = json.data.updated_assets || [];
    if(assets.length){
      const parts = assets.map(a => `${a.asset_name} إلى ${a.new_score}`);
      showToast(`تم إنجاز المهمة — ارتفعت: ${parts.join('، ')}`);
    } else {
      showToast('تم إنجاز المهمة');
    }
    loadData();
  } else {
    const msg = json.message || 'تعذر إنجاز المهمة — قد تكون منجزة بالفعل';
    showToast(msg, true);
  }
}
async function suggestDecisions(){
  const btn = document.getElementById('suggestBtn');
  btn.disabled = true;
  btn.textContent = 'جارٍ التحليل...';
  try{
    const res = await fetch(`/api/companies/${COMPANY_ID}/decisions/suggest${apiQS()}`, { method:'POST' });
    const json = await res.json();
    if(json.success){
      lastSuggestions = json.data.suggestions || [];
      showToast('تم توليد اقتراحات القرارات لأضعف الأصول');
      await loadData(); // يعيد بناء الصفحة كاملة، ثم يعيد عرض لوحة الاقتراحات المحفوظة في lastSuggestions
    } else {
      showToast('تعذر توليد الاقتراحات', true);
    }
  } catch(e){
    showToast('تعذر الاتصال بالخادم', true);
  }
  const freshBtn = document.getElementById('suggestBtn');
  if(freshBtn){
    freshBtn.disabled = false;
    freshBtn.textContent = '💡 اقترح 3 قرارات لأضعف الأصول';
  }
}

function showToast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#8B0000' : '#0B132B';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), isError ? 4000 : 2500);
}

loadData();
</script>
