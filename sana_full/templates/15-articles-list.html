<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>مقالات سنع — معرفة قابلة للتطبيق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html{ color-scheme:light; background:#F5F6FB; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:#F5F6FB; color:#333940; font-family:'IBM Plex Sans Arabic',sans-serif; line-height:1.6; }
  a{ color:inherit; text-decoration:none; }

  .concept-nav{ background:#080E1F; padding:10px 20px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .concept-nav a{ font-size:11.5px; color:rgba(255,255,255,0.5); padding:6px 12px; border-radius:20px; }
  .concept-nav a.active{ background:rgba(242,178,51,0.15); color:#F2B233; font-weight:600; }

  header{ background:#080E1F; padding:18px 28px; color:#fff; }
  header .eyebrow{ font-family:'Space Grotesk'; font-size:10.5px; letter-spacing:2px; text-transform:uppercase; color:#F2B233; font-weight:600; margin-bottom:6px; }
  header h1{ font-size:20px; font-weight:600; }
  header .sub{ color:rgba(255,255,255,0.55); font-size:13px; margin-top:4px; }

  main{ max-width:760px; margin:0 auto; padding:28px 20px 80px; }

  .article-card{ background:#fff; border:1px solid #DEE1EC; border-radius:14px; padding:20px 22px; margin-bottom:14px; display:block; transition:box-shadow .15s, border-color .15s; }
  .article-card:hover{ box-shadow:0 4px 16px rgba(11,19,43,0.08); border-color:#0EA5A5; }
  .article-card .title{ font-size:16px; font-weight:700; color:#0B132B; margin-bottom:6px; }
  .article-card .sub{ font-size:13px; color:#6E7580; }
  .article-card .arrow{ color:#0EA5A5; font-size:13px; margin-top:10px; font-weight:600; }

  .empty{ text-align:center; padding:60px 0; color:#9AA0AB; font-size:14px; }
</style>
</head>
<body>

<div class="concept-nav">
  <a href="/">① الدخول</a>
  <a href="/home">② CEO Home</a>
  <a href="/articles" class="active">📚 مقالات</a>
  <a href="/passport">④ جواز الشركة</a>
</div>

<header>
  <div class="eyebrow">معرفة قابلة للتطبيق</div>
  <h1>مقالات سنع</h1>
  <div class="sub">تشخيص حقيقي — قرارات واضحة — تنفيذ قابل للقياس</div>
</header>

<main>
  {% if articles %}
    {% for a in articles %}
    <a class="article-card" href="/articles/{{ a.slug }}">
      <div class="title">{{ a.title }}</div>
      {% if a.subtitle %}<div class="sub">{{ a.subtitle }}</div>{% endif %}
      <div class="arrow">اقرأ المقال ←</div>
    </a>
    {% endfor %}
  {% else %}
    <div class="empty">لا توجد مقالات بعد.</div>
  {% endif %}
</main>

</body>
</html>
