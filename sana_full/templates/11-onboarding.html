<!DOCTYPE html>
{% from '_sana-mark.html' import sana_mark %}
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% include '_csrf-fetch.html' %}
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F6FB">
<title>سنع — أخبرنا عن شركتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html{ color-scheme: light; background:#F5F6FB; }
  :root{
    --navy:#0B132B; --teal:#0EA5A5; --gold:#F2B233; --paper:#F5F6FB;
    --ink:#333940; --slate:#6E7580; --line:#DEE1EC; --red:#B23A2E;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start;
    padding:28px 20px 40px;
  }
  .mark{ width:36px; height:36px; margin-bottom:18px; }

  /* خطوات — stepper بسيط */
  .stepper{
    display:flex; gap:6px; align-items:center; margin-bottom:28px;
  }
  .step{
    width:32px; height:4px; border-radius:2px; background:var(--line);
    transition:background .2s;
  }
  .step.done{ background:var(--teal); }
  .step.active{ background:var(--navy); }

  .card{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:28px 24px 24px; max-width:520px; width:100%;
  }
  h1{ font-size:19px; font-weight:700; color:var(--navy); margin-bottom:6px; text-align:center; }
  .sub{ font-size:12.5px; color:var(--slate); text-align:center; margin-bottom:24px; line-height:1.7; }

  label{ display:block; font-size:12.5px; font-weight:600; color:var(--navy); margin-bottom:6px; }
  .req{ color:var(--teal); margin-right:2px; }
  input, select, textarea{
    width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:8px;
    font-family:inherit; font-size:13.5px; margin-bottom:18px; background:#F9FAFC;
    transition:border-color .15s;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--teal); background:#fff; }

  .other-field,.dependent-field{ display:none; margin-bottom:18px; }
  .other-field.show{ display:block; }
  .dependent-field.show{ display:block; }
  .other-field input{ margin-bottom:0; }

  .error{
    display:none; background:#FCEBEA; color:var(--red); font-size:12.5px;
    padding:10px 12px; border-radius:8px; margin-bottom:16px;
  }
  .error.show{ display:block; }

  .btn{
    width:100%; padding:12px; border:none; border-radius:8px; background:var(--navy); color:#fff;
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; transition:opacity .15s;
  }
  .btn:hover{ opacity:.9; }
  .btn:disabled{ opacity:.6; cursor:not-allowed; }
</style>
</head>
<body>

{{ sana_mark(size=36, class_name='mark', decorative=true, stroke_width=9) }}

<div class="stepper">
  <div class="step done"></div>
  <div class="step active"></div>
  <div class="step"></div>
</div>

<div class="card">
  <h1>أخبرنا عن عملك</h1>
  <div class="sub">إجابات قصيرة تساعدنا على فهم أولويتك.</div>

  <div class="error" id="errorMsg"></div>

  <label for="name">اسم الشركة <span class="req">*</span></label>
  <input type="text" id="name" value="{{ company.name if company and company.name != 'شركة جديدة' else '' }}" placeholder="مثال: مؤسسة النجاح للتجارة">

  <label for="sectorSelect">ما مجال العمل؟ <span class="req">*</span></label>
  <select id="sectorSelect" onchange="onSectorChange(this.value)">
    <option value="">— اختر المجال —</option>
    {% for sector in sectors %}
    <option value="{{ sector.key }}" {% if company.sector == sector.key %}selected{% endif %}>{{ sector.icon }} {{ sector.label }}</option>
    {% endfor %}
  </select>

  <div class="other-field" id="otherField">
    <label for="otherInput">اكتب مجالها باختصار <span class="req">*</span></label>
    <input type="text" id="otherInput" value="{{ company.sector_other or '' }}" placeholder="مثال: شحن دولي، تنظيم فعاليات...">
  </div>

  <div class="dependent-field" id="businessTypeField">
    <label for="businessTypeSelect">ما نوع النشاط؟ <span class="req">*</span></label>
    <select id="businessTypeSelect">
      <option value="">— اختر نوع النشاط —</option>
    </select>
  </div>

  <label for="respondentRole">ما صفتك في العمل؟ <span class="req">*</span></label>
  <select id="respondentRole">
    <option value="">— اختر صفتك —</option>
    {% for role in respondent_roles %}
    <option value="{{ role.key }}" {% if company.respondent_role == role.key %}selected{% endif %}>{{ role.label }}</option>
    {% endfor %}
  </select>

  <label for="employeeCount" style="margin-top:2px;">كم شخصًا يعمل معك تقريبًا؟</label>
  <input type="number" id="employeeCount" min="1" placeholder="مثال: 12">

  <label for="goal90Days">ما النتيجة الأهم خلال 90 يومًا؟ <span class="req">*</span></label>
  <textarea id="goal90Days" rows="2" placeholder="مثال: زيادة المبيعات الشهرية">{{ company.goal_90_days or '' }}</textarea>

  <label for="primaryChallenge">ما أكبر تحدٍ في العمل الآن؟ <span class="req">*</span></label>
  <textarea id="primaryChallenge" rows="2" placeholder="مثال: تأخر متابعة العملاء">{{ company.primary_challenge or '' }}</textarea>

  <button class="btn" id="submitBtn" onclick="submitOnboarding()">حفظ ومتابعة</button>
</div>

<script>
const SECTOR_BUSINESS_TYPES = {{ sector_business_types|tojson }};
const CURRENT_BUSINESS_TYPE = {{ (company.business_type or '')|tojson }};
const ONBOARDING_SUBMIT_URL = {{ onboarding_submit_url|tojson }};
const DISCOVERY_URL = {{ discovery_url|tojson }};

function onSectorChange(val){
  document.getElementById('otherField').classList.toggle('show', val === 'other');
  const businessTypeField = document.getElementById('businessTypeField');
  const businessTypeSelect = document.getElementById('businessTypeSelect');
  const options = SECTOR_BUSINESS_TYPES[val] || [];
  businessTypeSelect.innerHTML = '<option value="">— اختر نوع النشاط —</option>';
  options.forEach(item => businessTypeSelect.add(new Option(item.label, item.key)));
  businessTypeField.classList.toggle('show', options.length > 0);
  businessTypeSelect.disabled = options.length === 0;
  document.getElementById('errorMsg').classList.remove('show');
}

async function submitOnboarding(){
  const name          = document.getElementById('name').value.trim();
  const employee_count = document.getElementById('employeeCount').value.trim();
  const selectedSector = document.getElementById('sectorSelect').value;
  const otherText     = document.getElementById('otherInput').value.trim();
  const business_type = document.getElementById('businessTypeSelect').value;
  const respondent_role = document.getElementById('respondentRole').value;
  const goal_90_days = document.getElementById('goal90Days').value.trim();
  const primary_challenge = document.getElementById('primaryChallenge').value.trim();
  const errorMsg      = document.getElementById('errorMsg');
  const btn           = document.getElementById('submitBtn');
  errorMsg.classList.remove('show');

  if(!name){
    errorMsg.textContent = 'اسم الشركة مطلوب.';
    errorMsg.classList.add('show');
    return;
  }
  if(!selectedSector){
     errorMsg.textContent = 'اختر مجال الشركة حتى نكمل الصورة.';
    errorMsg.classList.add('show');
    document.getElementById('sectorSelect').focus();
    return;
  }
  if(selectedSector === 'other' && !otherText){
     errorMsg.textContent = 'اكتب مجال الشركة باختصار.';
    errorMsg.classList.add('show');
    document.getElementById('otherInput').focus();
    return;
  }
  if(!business_type){
    errorMsg.textContent = 'اختر نوع النشاط حتى نخصص الأسئلة لك.';
    errorMsg.classList.add('show');
    document.getElementById('businessTypeSelect').focus();
    return;
  }
  if(!respondent_role){
    errorMsg.textContent = 'اختر صفتك في العمل.';
    errorMsg.classList.add('show');
    document.getElementById('respondentRole').focus();
    return;
  }
  if(!goal_90_days || !primary_challenge){
     errorMsg.textContent = 'اكتب النتيجة التي تريدها وأكبر تحدٍ الآن.';
    errorMsg.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'جارٍ الحفظ...';
  try {
    const payload = {
      name, sector: selectedSector, employee_count,
      business_type, respondent_role, goal_90_days, primary_challenge
    };
    if(selectedSector === 'other') payload.sector_other = otherText;
    const res = await fetch(ONBOARDING_SUBMIT_URL, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const contentType = res.headers.get('content-type') || '';
    const json = contentType.includes('application/json') ? await res.json() : null;
    if(res.ok && json.success){
      window.location.assign(json.data.redirect || DISCOVERY_URL);
    } else {
      errorMsg.textContent = (json && json.message) || `تعذّر الحفظ (${res.status}). حاول مرة أخرى.`;
      errorMsg.classList.add('show');
      btn.disabled = false;
       btn.textContent = 'حفظ ومتابعة';
    }
  } catch(e){
    errorMsg.textContent = 'تعذّر الاتصال بالخادم، حاول مرة أخرى.';
    errorMsg.classList.add('show');
    btn.disabled = false;
      btn.textContent = 'حفظ ومتابعة';
  }
}

onSectorChange(document.getElementById('sectorSelect').value);
if(CURRENT_BUSINESS_TYPE){
  document.getElementById('businessTypeSelect').value = CURRENT_BUSINESS_TYPE;
}
</script>

</body>
</html>
