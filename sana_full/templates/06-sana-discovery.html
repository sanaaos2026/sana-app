<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% include '_csrf-fetch.html' %}
<title>جلسة الاكتشاف — سنع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B132B; --navy2: #111d3e;
    --gold: #F2B233; --gold-dim: rgba(242,178,51,.15); --gold-border: rgba(242,178,51,.35);
    --teal: #0EA5A5; --teal-dim: rgba(14,165,165,.12);
    --ink: #E8ECF4; --muted: #7A8DA8; --line: rgba(255,255,255,.09);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--navy);
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    color: var(--ink); overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; align-items: center; }

  /* ── Progress bar ── */
  #progress-wrap {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 14px 24px 0; display: flex; flex-direction: column; gap: 6px;
    opacity: 0; transition: opacity .3s;
  }
  #progress-wrap.visible { opacity: 1; }
  #progress-track {
    height: 3px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden;
  }
  #progress-fill {
    height: 100%; background: var(--gold); border-radius: 99px;
    transition: width .6s cubic-bezier(.4,0,.2,1);
  }
  #progress-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--muted); letter-spacing: .04em; text-align: left; direction: ltr;
  }
  .reset-experience-tool{
    position:fixed; top:12px; left:12px; z-index:120;
    border:1px solid rgba(178,58,46,.38); background:#fff; color:#8F3027;
    border-radius:8px; padding:7px 10px; font:600 11.5px 'IBM Plex Sans Arabic',sans-serif;
    cursor:pointer; box-shadow:0 4px 14px rgba(11,19,43,.08);
  }
  .journey-hint {
    width: 100%; margin-bottom: 16px; padding: 9px 12px;
    border: 1px solid rgba(255,255,255,.1); border-radius: 9px;
    color: var(--muted); font-size: 12px; line-height: 1.65; text-align: center;
  }

  /* ── Stage ── */
  #stage {
    width: 100%; max-width: 480px;
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 64px 20px 72px; position: relative;
  }

  /* ── Screen ── */
  .screen {
    width: 100%; display: flex; flex-direction: column; align-items: center;
    gap: 0;
  }
  .screen.entering { animation: sldIn .35s cubic-bezier(.25,.46,.45,.94) forwards; }
  .screen.exiting  { animation: sldOut .3s cubic-bezier(.55,0,1,.45) forwards; }
  @keyframes sldIn  { from { opacity: 0; transform: translateX(32px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes sldOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-32px); } }

  /* ── Question icon ── */
  .q-icon { width: 52px; height: 52px; margin-bottom: 20px; }

  /* ── Question title ── */
  .q-title {
    font-family: 'Cairo', sans-serif; font-weight: 800;
    font-size: clamp(19px, 5vw, 23px); color: #fff;
    text-align: center; line-height: 1.45; margin-bottom: 8px;
  }
  .q-sub {
    font-size: 14px; color: var(--muted); text-align: center;
    margin-bottom: 20px; line-height: 1.6;
  }

  /* ── Choice grid ── */
  .choices {
    display: flex; flex-direction: column; gap: 10px; width: 100%;
  }
  .choices.grid2 {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .choice {
    background: rgba(255,255,255,.04); border: 1.5px solid var(--line);
    border-radius: 12px; padding: 13px 16px;
    font-size: 14px; font-weight: 500; color: var(--ink);
    cursor: pointer; text-align: right; width: 100%; font-family: inherit;
    appearance: none; -webkit-appearance: none;
    transition: background .15s, border-color .15s, color .15s;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .choice:hover { background: rgba(242,178,51,.08); border-color: var(--gold-border); }
  .choice.selected {
    background: var(--gold-dim); border-color: var(--gold);
    color: var(--gold); font-weight: 700;
  }
  .choice.sel-teal {
    background: var(--teal-dim); border-color: var(--teal);
    color: var(--teal); font-weight: 700;
  }

  /* ── Follow-up section ── */
  .followup-wrap {
    width: 100%; margin-top: 18px;
    border-top: 1px solid var(--line); padding-top: 16px;
    opacity: 0; transform: translateY(8px);
    transition: opacity .3s, transform .3s;
    pointer-events: none;
  }
  .followup-wrap.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .followup-label {
    font-size: 13px; color: var(--muted); margin-bottom: 12px; text-align: center;
  }
  .followup-input {
    width: 100%; background: transparent;
    border: none; border-bottom: 1.5px solid rgba(255,255,255,.2);
    color: #fff; font-size: 14.5px; font-family: inherit;
    padding: 8px 2px; outline: none; transition: border-color .2s;
    text-align: right;
  }
  .followup-input:focus { border-bottom-color: var(--gold); }
  .followup-input::placeholder { color: var(--muted); }
  .followup-input[type="date"] {
    direction: ltr;
    unicode-bidi: plaintext;
    text-align: left;
    color-scheme: dark;
  }

  /* ── Mobile-first period picker ── */
  .calibration-wrap {
    width: 100%; max-width: 420px; text-align: right; direction: rtl;
  }
  .calibration-kicker {
    color: #fff; font-family: 'Cairo', sans-serif; font-weight: 800;
    font-size: clamp(20px, 5.4vw, 25px); line-height: 1.45;
    text-align: center;
  }
  .calibration-note {
    color: var(--muted); font-size: 13px; text-align: center;
    margin: 4px 0 24px;
  }
  .calibration-question {
    color: var(--ink); font-family: 'Cairo', sans-serif; font-size: 17px;
    font-weight: 800; margin-bottom: 12px;
  }
  .period-options {
    display: flex; flex-direction: column; gap: 10px; width: 100%;
  }
  .period-option {
    width: 100%; min-height: 58px; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; direction: rtl;
    background: rgba(255,255,255,.04); border: 1.5px solid var(--line);
    border-radius: 14px; padding: 13px 16px; color: var(--ink);
    font-family: inherit; text-align: right; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .period-option:active { transform: scale(.985); }
  .period-option.selected {
    background: var(--gold-dim); border-color: var(--gold);
  }
  .period-option-copy { display: flex; flex-direction: column; gap: 2px; }
  .period-option-title { font-size: 15px; font-weight: 700; color: #fff; }
  .period-option.selected .period-option-title { color: var(--gold); }
  .period-option-hint { color: var(--muted); font-size: 11px; line-height: 1.4; }
  .period-radio {
    width: 19px; height: 19px; flex: 0 0 19px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.32); position: relative;
  }
  .period-option.selected .period-radio { border-color: var(--gold); }
  .period-option.selected .period-radio::after {
    content: ""; position: absolute; inset: 4px; border-radius: 50%;
    background: var(--gold);
  }
  .period-confirmation {
    color: rgba(255,255,255,.52); font-size: 11px; line-height: 1.6;
    margin-top: 12px; text-align: right;
  }
  .period-custom-fields {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
  }
  .period-field { min-width: 0; }
  .period-field label {
    display: block; color: var(--ink); font-size: 13px; font-weight: 700;
    margin-bottom: 5px; text-align: right;
  }
  .period-field .followup-input {
    background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.2);
    border-radius: 10px; padding: 11px 10px; min-height: 45px;
    width: 100%; min-width: 0; box-sizing: border-box;
  }
  .period-field .followup-input[type="date"] {
    display: block;
    font-size: 16px;
    color: #fff;
    -webkit-text-fill-color: #fff;
  }
  .period-field .followup-input::-webkit-calendar-picker-indicator {
    cursor: pointer; opacity: .78;
  }
  .period-error {
    color: #ffb4a8; font-size: 12px; min-height: 20px; margin-top: 9px;
  }
  .period-continue {
    margin-top: 18px; opacity: 1; pointer-events: auto; transform: none;
  }
  @media (max-width: 380px) {
    .period-custom-fields { grid-template-columns: 1fr; gap: 10px; }
    .period-option { padding: 12px 14px; }
    .period-field .followup-input { font-size: 16px; }
  }

  /* ── Next / submit button ── */
  .next-btn {
    margin-top: 22px; width: 100%;
    background: var(--gold); color: var(--navy);
    font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 15px;
    border: none; border-radius: 12px; padding: 15px 24px;
    cursor: pointer; transition: opacity .2s, transform .1s;
    opacity: 0; pointer-events: none; transform: translateY(4px);
    transition: opacity .25s, transform .25s;
  }
  .next-btn.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .next-btn:active { transform: scale(.98); }

  /* ── Motivation toast ── */
  #motivation {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: rgba(14,165,165,.18); border: 1px solid rgba(14,165,165,.4);
    backdrop-filter: blur(8px); border-radius: 30px;
    padding: 10px 22px; font-size: 13.5px; color: var(--teal);
    white-space: nowrap; max-width: calc(100% - 40px);
    opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 200;
    text-align: center; font-weight: 600;
  }
  #motivation.show { opacity: 1; }

  /* ── Welcome screen ── */
  .welcome-logo { margin-bottom: 28px; }
  .welcome-title {
    font-family: 'Cairo', sans-serif; font-weight: 900;
    font-size: clamp(26px, 7vw, 34px); color: #fff; text-align: center;
    margin-bottom: 12px; line-height: 1.3;
  }
  .welcome-sub {
    font-size: 15px; color: var(--muted); text-align: center;
    margin-bottom: 28px; line-height: 1.7; max-width: 340px;
  }
  .memory-card {
    width:100%; box-sizing:border-box; margin:0 0 18px; padding:14px 16px;
    border:1px solid rgba(45,212,191,.32); border-radius:14px;
    background:rgba(45,212,191,.07); color:var(--ink); text-align:right;
  }
  .memory-card-title { color:var(--teal); font-weight:700; font-size:12px; margin-bottom:6px; }
  .memory-card-value { color:#fff; font-size:14px; line-height:1.6; }
  .memory-card-meta { color:var(--muted); font-size:11px; margin-top:5px; }
  .memory-card-actions { display:flex; gap:8px; margin-top:11px; }
  .memory-card-actions button {
    flex:1; padding:9px 10px; border-radius:9px; cursor:pointer;
    font-family:'IBM Plex Sans Arabic',sans-serif; font-weight:600;
  }
  .memory-confirm { border:0; background:var(--teal); color:var(--navy); }
  .memory-update { border:1px solid rgba(255,255,255,.18); background:transparent; color:var(--ink); }
  .start-btn {
    background: var(--gold); color: var(--navy);
    font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 16px;
    border: none; border-radius: 14px; padding: 16px 52px;
    cursor: pointer; transition: opacity .2s, transform .1s;
  }
  .start-btn:active { transform: scale(.97); }

  /* ── Outro screen ── */
  .outro-wrap { text-align: center; }
  /* ── Passport rows ── */
  .pp-row { display:flex; gap:12px; align-items:flex-start; }
  .pp-icon { font-size:18px; min-width:26px; padding-top:1px; }
  .pp-label { display:block; color:rgba(255,255,255,0.4); font-size:11px;
              letter-spacing:.03em; margin-bottom:3px; }
  .pp-val { display:block; color:#E8ECF4; font-size:14px; line-height:1.45; }
  .outro-logo { animation: logoIn .6s ease forwards; margin-bottom: 24px; }
  @keyframes logoIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
  .outro-title {
    font-family: 'Cairo', sans-serif; font-weight: 900;
    font-size: 26px; color: #fff; margin-bottom: 14px;
  }
  .outro-body {
    font-size: 14.5px; color: var(--muted); line-height: 1.8;
    margin-bottom: 32px; max-width: 340px; text-align: center;
  }
  .outro-btn {
    background: var(--gold); color: var(--navy);
    font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 16px;
    border: none; border-radius: 14px; padding: 16px 36px;
    cursor: pointer; transition: opacity .2s, transform .1s; display: inline-block;
  }
  .outro-btn:active { transform: scale(.97); }
  .loading-dots { color: var(--muted); font-size: 22px; letter-spacing: 4px; }

  /* ── Back button ── */
  .back-btn {
    margin-top: 12px; width: 100%;
    background: transparent;
    border: 1.5px solid rgba(255,255,255,.12);
    border-radius: 12px; padding: 11px 24px;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    font-size: 13px; font-weight: 500; color: var(--muted);
    cursor: pointer; transition: border-color .2s, color .2s;
    direction: rtl;
  }
  .back-btn:hover { border-color: rgba(255,255,255,.3); color: var(--ink); }
  .back-btn:active { opacity: .7; }

  /* ── Reversed slide animations (for going back) ── */
  @keyframes sldInBack  { from { opacity: 0; transform: translateX(-32px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes sldOutBack { from { opacity: 1; transform: translateX(0); }    to { opacity: 0; transform: translateX(32px); } }
  .screen.entering-back { animation: sldInBack  .35s cubic-bezier(.25,.46,.45,.94) forwards; }
  .screen.exiting-back  { animation: sldOutBack .3s  cubic-bezier(.55,0,1,.45)    forwards; }

  /* ── Multi-select badge ── */
  .multi-count {
    font-family: 'IBM Plex Mono', monospace; direction: ltr;
    font-size: 11px; color: var(--teal); text-align: left;
    margin-bottom: 10px;
  }

  /* ── Sana logo SVG inline ── */
  .sana-logo { display: block; }
</style>
{% include '_customer-journey-styles.html' %}
</head>
<body>
{% set journey_step = 'discovery' %}
{% include '_customer-journey-nav.html' %}
{% if can_reset_experience %}
<button type="button" class="reset-experience-tool" onclick="confirmExperienceReset()" aria-label="إعادة ضبط التجربة">↺ إعادة ضبط التجربة</button>
{% endif %}

<!-- Progress bar -->
<div id="progress-wrap">
  <div id="progress-track"><div id="progress-fill" style="width:0%"></div></div>
  <div id="progress-label">بقي 7 أسئلة</div>
</div>

<!-- Stage -->
<div id="stage">
  <div class="screen" id="screen"></div>
</div>

<!-- Motivation toast -->
<div id="motivation"></div>

<script>
const PREVIEW_QUERY = (() => {
  const params = new URLSearchParams(window.location.search);
  const adminKey = params.get('admin_key');
  const companyId = params.get('company_id');
  if (!adminKey || !companyId) return '';
  return `?${new URLSearchParams({admin_key: adminKey, company_id: companyId}).toString()}`;
})();
const JOURNEY_URLS = {{ journey_urls|tojson }};
const withContext = url => `${url}${PREVIEW_QUERY}`;
const caseUrl = (template, caseId) =>
  template.replace('__CASE_ID__', encodeURIComponent(caseId));
const FULL_REASSESSMENT = {{ (full_reassessment|default(false))|tojson }};
const COMPANY_MEMORY = {{ (company_memory|default({"items": []}))|tojson }};
const INITIAL_DISCOVERY_DRAFT = {{ (discovery_draft or {})|tojson }};
const MEMORY_KEY_BY_QUESTION = {
  q1: 'goal:primary',
  q2: 'problem:declared',
  q4: 'acquisition:source',
  q5: 'founder:dependency',
  q6: 'decision:style'
};

// ────────────────────────────────────────────────
// SANA LOGO SVG
// ────────────────────────────────────────────────
const LOGO_SVG = `<svg class="sana-logo" width="44" height="44" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M76 20 H24 V80 H76 V64" stroke="#FFFFFF" stroke-width="7" stroke-linecap="butt" stroke-linejoin="miter" fill="none"/>
  <path d="M76 20 V36" stroke="#FFFFFF" stroke-width="7" stroke-linecap="butt" fill="none"/>
  <rect x="50" y="42" width="16" height="16" fill="#F2B233"/>
</svg>`;

const LOGO_LG = `<svg class="sana-logo" width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M76 20 H24 V80 H76 V64" stroke="#FFFFFF" stroke-width="7" stroke-linecap="butt" stroke-linejoin="miter" fill="none"/>
  <path d="M76 20 V36" stroke="#FFFFFF" stroke-width="7" stroke-linecap="butt" fill="none"/>
  <rect x="50" y="42" width="16" height="16" fill="#F2B233"/>
</svg>`;

// ────────────────────────────────────────────────
// ICONS per question
// ────────────────────────────────────────────────
function icon(inner) {
  return `<svg class="q-icon" viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
}
const ICONS = {
  // Q1 — هدف / radar
  q1: icon(`<circle cx="26" cy="26" r="22" stroke="rgba(255,255,255,.15)" stroke-width="2"/>
    <circle cx="26" cy="26" r="14" stroke="rgba(255,255,255,.25)" stroke-width="2"/>
    <rect x="22" y="22" width="8" height="8" fill="#F2B233"/>
    <line x1="26" y1="4" x2="26" y2="10" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="42" x2="26" y2="48" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="4" y1="26" x2="10" y2="26" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="42" y1="26" x2="48" y2="26" stroke="white" stroke-width="2" stroke-linecap="round"/>`),

  // Q2 — تحدٍّ / wrench
  q2: icon(`<path d="M34 10 C38 14 38 22 34 26 L18 42 C16 44 13 44 11 42 C9 40 9 37 11 35 L27 19 C31 15 30 11 34 10 Z" stroke="white" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
    <rect x="22" y="28" width="8" height="8" fill="#F2B233" transform="rotate(45 26 32)"/>
    <circle cx="14" cy="40" r="2.5" fill="rgba(255,255,255,.4)"/>`),

  // Q3 — أصل / star
  q3: icon(`<polygon points="26,6 31.5,18.5 45,20 35,30 37.5,44 26,37 14.5,44 17,30 7,20 20.5,18.5" stroke="white" stroke-width="2" stroke-linejoin="round" fill="none"/>
    <rect x="22" y="21" width="8" height="8" fill="#F2B233"/>`),

  // Q4 — اكتساب عملاء / people+arrow
  q4: icon(`<path d="M10 36 C10 28 18 24 26 24 C34 24 42 28 42 36" stroke="white" stroke-width="2.2" fill="none"/>
    <circle cx="18" cy="20" r="6" stroke="rgba(255,255,255,.5)" stroke-width="2" fill="none"/>
    <circle cx="34" cy="20" r="6" stroke="rgba(255,255,255,.5)" stroke-width="2" fill="none"/>
    <rect x="22" y="30" width="8" height="8" fill="#F2B233"/>`),

  // Q5 — مؤسس / person badge
  q5: icon(`<rect x="16" y="6" width="20" height="24" rx="2" stroke="white" stroke-width="2" fill="none"/>
    <rect x="20" y="10" width="8" height="8" fill="#F2B233"/>
    <path d="M10 46 C10 40 16 36 26 36 C36 36 42 40 42 46" stroke="rgba(255,255,255,.6)" stroke-width="2" fill="none"/>`),

  // Q6 — قرار / clock
  q6: icon(`<circle cx="26" cy="26" r="18" stroke="white" stroke-width="2.2" fill="none"/>
    <line x1="26" y1="14" x2="26" y2="18" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="34" x2="26" y2="38" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="26" x2="18" y2="26" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="26" x2="38" y2="26" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="26" x2="26" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <line x1="26" y1="26" x2="34" y2="22" stroke="#F2B233" stroke-width="2" stroke-linecap="round"/>
    <circle cx="26" cy="26" r="2.5" fill="#F2B233"/>`),

  // Q7 — مستقبل / arrow up
  q7: icon(`<path d="M26 44 L26 26" stroke="#F2B233" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M14 34 L26 26 L38 34" stroke="#F2B233" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M20 14 L26 8 L32 14" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="26" y1="8" x2="26" y2="20" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="26" cy="22" r="2.5" fill="white"/>

let draftSaveTimer = null;
let draftSaveInFlight = null;
let discoveryFinalizing = false;
const DRAFT_ENABLED = {{ (discovery_drafts_enabled|default(false))|tojson }};

function draftSnapshot() {
  const snapshot = JSON.parse(JSON.stringify(ans));
  snapshot.calibration_draft = {
    baseline_start: calibrationDraft.baseline_start || '',
    baseline_end: calibrationDraft.baseline_end || '',
    period_choice: calibrationPeriodChoice || ''
  };
  return snapshot;
}

async function saveDraftNow(keepalive = false) {
  if (!DRAFT_ENABLED || discoveryFinalizing || step > 8) return null;
  const request = fetch(withContext(JOURNEY_URLS.discovery_draft), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    keepalive,
    body: JSON.stringify({ payload: draftSnapshot(), current_step: step })
  });
  draftSaveInFlight = request.catch(() => null).finally(() => {
    draftSaveInFlight = null;
  });
  return draftSaveInFlight;
}

function scheduleDraftSave() {
  if (!DRAFT_ENABLED || discoveryFinalizing) return;
  clearTimeout(draftSaveTimer);
  draftSaveTimer = setTimeout(() => {
    draftSaveTimer = null;
    saveDraftNow();
  }, 350);
}

function restoreDiscoveryDraft(draft) {
  if (!draft || !draft.payload) return false;
  const payload = draft.payload;
  if (payload.fit_gate && typeof payload.fit_gate === 'object') {
    ans.fit_gate = {
      operating_duration: payload.fit_gate.operating_duration || null,
      paying_customers: payload.fit_gate.paying_customers || null,
      delivery_mode: payload.fit_gate.delivery_mode || null
    };
  }
  ['q1', 'q2', 'q3', 'q4', 'q4_fu', 'q5', 'q5_text', 'q6'].forEach(key => {
    if (typeof payload[key] === 'string') ans[key] = payload[key];
  });
  if (Array.isArray(payload.q7)) ans.q7 = payload.q7.slice(0, 3);
  if (payload.diagnostic_baseline && typeof payload.diagnostic_baseline === 'object') {
    ans.diagnostic_baseline = {...payload.diagnostic_baseline};
  }
  const calibration = payload.calibration_draft;
  if (calibration && typeof calibration === 'object') {
    calibrationDraft.baseline_start = calibration.baseline_start || '';
    calibrationDraft.baseline_end = calibration.baseline_end || '';
    calibrationPeriodChoice = calibration.period_choice || null;
  }
  const restoredStep = Number(draft.current_step);
  if (Number.isInteger(restoredStep) && restoredStep >= 0 && restoredStep <= 8) {
    step = restoredStep;
  }
  return true;
}

function transitionTo(renderFn, backward = false) {
  const cur = $screen;
  cur.classList.add(backward ? 'exiting-back' : 'exiting');
  setTimeout(() => {
    cur.className = 'screen';
    renderFn();
    cur.classList.add(backward ? 'entering-back' : 'entering');
    setTimeout(() => cur.classList.remove('entering', 'entering-back'), 350);
  }, 290);
}

function isoDate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function shiftCalendarMonths(date, months) {
  const shifted = new Date(date);
  const originalDay = shifted.getDate();
  shifted.setDate(1);
  shifted.setMonth(shifted.getMonth() + months);
  const lastDay = new Date(
    shifted.getFullYear(), shifted.getMonth() + 1, 0
  ).getDate();
  shifted.setDate(Math.min(originalDay, lastDay));
  return shifted;
}

function getPresetPeriod(choice) {
  const end = new Date();
  end.setHours(12, 0, 0, 0);
  let start = new Date(end);
  if (choice === 'last_30_days') {
    start.setDate(start.getDate() - 29);
  } else {
    const months = choice === 'last_6_months' ? 6 :
      choice === 'last_12_months' ? 12 : 3;
    start = shiftCalendarMonths(start, -months);
    start.setDate(start.getDate() + 1);
  }
  return { start: isoDate(start), end: isoDate(end) };
}

function getMatchingPreviousPeriod(start, end) {
  if (!start || !end) return { start: '', end: '' };
  const startDate = new Date(`${start}T12:00:00`);
  const endDate = new Date(`${end}T12:00:00`);
  const duration = Math.round((endDate - startDate) / 86400000) + 1;
  const previousEnd = new Date(startDate);
  previousEnd.setDate(previousEnd.getDate() - 1);
  const previousStart = new Date(previousEnd);
  previousStart.setDate(previousStart.getDate() - duration + 1);
  return { start: isoDate(previousStart), end: isoDate(previousEnd) };
}

function formatPeriodForDisplay(start, end) {
  const format = value => {
    const date = new Date(`${value}T12:00:00`);
    return new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn', {
      day: 'numeric', month: 'short', year: 'numeric'
    }).format(date);
  };
  return `من ${format(start)} إلى ${format(end)}`;
}

function captureCalibrationDraft() {
  [
    ['baseline-start', 'baseline_start'],
    ['baseline-end', 'baseline_end']
  ].forEach(([id, key]) => {
    const input = document.getElementById(id);
    if (input) calibrationDraft[key] = input.value;
  });
}

function refreshCustomPeriod() {
  captureCalibrationDraft();
  scheduleDraftSave();
  if (calibrationDraft.baseline_start && calibrationDraft.baseline_end) {
    renderCalibration();
  }
}

function selectCalibrationPeriod(choice) {
  captureCalibrationDraft();
  calibrationPeriodChoice = choice;
  scheduleDraftSave();
  renderCalibration();
}

function submitCalibration() {
  const error = document.getElementById('calibration-error');
  const previous = ans.diagnostic_baseline || {};
  let period;
  if (calibrationPeriodChoice === 'custom') {
    period = {
      start: document.getElementById('baseline-start')?.value || '',
      end: document.getElementById('baseline-end')?.value || ''
    };
    if (!period.start || !period.end) {
      error.textContent = 'حدد تاريخ البداية والنهاية.';
      return;
    }
  } else {
    period = getPresetPeriod(calibrationPeriodChoice || 'last_3_months');
  }
  if (period.end < period.start) {
    error.textContent = 'تأكد أن تاريخ «إلى» بعد تاريخ «من».';
    return;
  }
  const comparison = getMatchingPreviousPeriod(period.start, period.end);
  if (comparison.end >= period.start) {
    error.textContent = 'خلّ فترة المقارنة قبل الفترة الحالية.';
    return;
  }
  ans.diagnostic_baseline = {
    ...previous,
    baseline_start: period.start,
    baseline_end: period.end,
    comparison_start: comparison.start,
    comparison_end: comparison.end,
    seasonality_context: previous.seasonality_context || 'غير معروف — يحتاج تحقق'
  };
  goNext();
}

// step 9 — شاشة انتظار مؤقتة بينما يحفظ سنع الجلسة في الخلفية
function renderOutro() {
  $screen.innerHTML = `
    <div class="outro-wrap journey-state-panel dark" role="status" style="align-items:center;">
      <div class="outro-logo">${LOGO_LG}</div>
      <div class="loading-dots" style="margin:24px 0; font-size:28px; color:var(--gold);">· · ·</div>
      <div style="color:rgba(255,255,255,0.5); font-size:13px;">يجمع سنع ملخص شركتك…</div>
    </div>`;
  saveAndFinish();
}

// شاشة جواز الشركة — تظهر مباشرة بعد اكتمال الحفظ (Step 8 النهائي)

async function saveAndFinish() {
  discoveryFinalizing = true;
  if (draftSaveTimer) {
    clearTimeout(draftSaveTimer);
    draftSaveTimer = null;
  }
  if (draftSaveInFlight) {
    await draftSaveInFlight.catch(() => {});
  }
  let saveData = { case_id: null };
  try {
    const res = await fetch(withContext(JOURNEY_URLS.discovery_save), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({...ans, full_reassessment: FULL_REASSESSMENT})
    });
    const json = await res.json();
    if (json.success && json.data) {
      saveData    = json.data;
      if (saveData.qualified === false && saveData.redirect) {
        window.location.href = saveData.redirect;
        return;
      }
      firstCaseId = json.data.case_id;
    } else {
      throw new Error(json.message || 'تعذر حفظ جلسة الاكتشاف.');
    }
  } catch(e) {
    $screen.innerHTML = `
      <div class="outro-wrap journey-state-panel dark error" role="alert">
        <div class="outro-title">لم تُحفظ الإجابات بعد</div>
        <div class="outro-body">${escHtml(e.message || 'تعذر الاتصال بالخادم. إجاباتك ما زالت في هذه الصفحة.')}</div>
        <button class="outro-btn" onclick="saveAndFinish()">أعد المحاولة</button>
        <button class="back-btn" onclick="goBack()">راجع الإجابات</button>
      </div>`;
    return;
  }

  // إثراء البيانات بإجابات الجلسة الحالية (تكون موجودة حتى لو فشل الـ API)
  saveData.main_goal        = saveData.main_goal        || ans.q1  || null;
  saveData.top_asset        = saveData.top_asset        || ans.q3  || null;
  saveData.declared_problem = saveData.declared_problem || ans.q2  || null;
  if (!saveData.case_id && firstCaseId) saveData.case_id = firstCaseId;

  // لا نعرض نجاحًا وهميًا: هذه الشاشة لا تظهر إلا بعد تأكيد الحفظ من الخادم.
  transitionTo(() => renderPassport(saveData));
}

function renderQuestion(q) {
  const chosen = ans[q.key];
  const journeyCopy = {
    q1: 'نحدد النتيجة التي تريدها الشركة.',
    q2: 'نفهم أين يتعطل العمل فعليًا.',
    q3: 'نرصد ما تعتمد عليه الشركة في تقديم خدمتها.',
    q4: 'نفهم كيف يصل العملاء وما مدى ثبات القناة.',
    q5: 'نفهم كيف يستمر العمل عند غياب صاحب القرار.',
    q6: 'نفهم الآن طريقة اتخاذ القرار في شركتك.',
    q7: 'نحدد النتيجة التي سنقيسها لاحقًا.'
  };

  let body = '';
  body += renderMemorySuggestion(q);

  if (q.type === 'single') {
    body += renderChoices(q.choices, q.key, 'single', chosen);
  }

  if (q.type === 'single+text') {
    body += renderChoices(q.choices, q.key, 'single', chosen);
    const textVal = ans[q.textKey] || '';
    const showFu = shouldShowFollowup(q, chosen);
    if (showFu) {
      body += `
        <div class="followup-wrap show" id="fu-wrap">
          <div class="followup-label">${q.textLabel}</div>
          <input class="followup-input" type="text"
            placeholder="${escHtml(q.textPlaceholder || 'اكتب هنا...')}"
            value="${escHtml(textVal)}"
            id="fu-input"
            onchange="ans['${q.textKey}']=this.value; scheduleDraftSave()"
            oninput="ans['${q.textKey}']=this.value; scheduleDraftSave()">
        </div>`;
    }
    body += `
      <button class="next-btn${chosen ? ' show' : ''}" id="next-btn"
        onclick="afterFollowupText()">التالي ←</button>`;
  }

  if (q.type === 'single+followup-choice') {
    const fuChosen = ans[q.fuKey];
    body += renderChoices(q.choices, q.key, 'single', chosen);
    const showFu = !!chosen;
    body += `
      <div class="followup-wrap${showFu ? ' show' : ''}" id="fu-wrap">
        <div class="followup-label">${q.fuLabel}</div>
        ${renderChoices(q.fuChoices, q.fuKey, 'fu-single', fuChosen, true)}
      </div>`;
  }

  if (q.type === 'multi') {
    const sel = ans[q.key] || [];
    body += `<div class="multi-count" id="multi-count">محدد ${sel.length}/${q.maxSelect}</div>`;
    body += renderChoices(q.choices, q.key, 'multi', sel);
    body += `<button class="next-btn${sel.length > 0 ? ' show' : ''}" id="next-btn"
      onclick="submitMulti()">إنهاء ←</button>`;
  }

  // زر الرجوع — من السؤال 2 فصاعدًا
  if (step >= 2) {
    body += `<button class="back-btn" onclick="goBack()">← رجوع للسؤال السابق</button>`;
  }

  $screen.innerHTML = `
    ${q.icon}
    <div class="q-title">${q.title}</div>
    <div class="journey-hint">${journeyCopy[q.key] || 'نبني صورة واقعية عن شركتك.'}</div>
    ${q.sub ? `<div class="q-sub">${q.sub}</div>` : ''}
    ${body}`;
}

function memoryValueText(value) {
  if (value === null || value === undefined) return 'غير معروف';
  if (Array.isArray(value)) return value.join('، ');
  if (typeof value === 'object') {
    if (value.value !== undefined) return `${value.value}${value.unit ? ` ${value.unit}` : ''}`;
    return Object.values(value).filter(v => v !== null && v !== '').join('، ');
  }
  return String(value);
}

function memoryForQuestion(q) {
  const key = MEMORY_KEY_BY_QUESTION[q.key];
  if (!key) return null;
  return (COMPANY_MEMORY.items || []).find(item => item.memory_key === key) || null;
}

function renderMemorySuggestion(q) {
  const item = memoryForQuestion(q);
  if (!item) return '';
  const hasConflict = item.conflict_status === 'OPEN';
  const freshness = item.freshness === 'STALE' ? 'قديمة وتحتاج تحديثًا' :
    hasConflict ? 'يوجد تعارض مفتوح ويتطلب مراجعة' :
    item.reusable ? 'موثقة وحديثة' : 'تحتاج تأكيدًا سريعًا';
  return `<div class="memory-card" id="memory-${escHtml(q.key)}">
    <div class="memory-card-title">معلومة سابقة من ذاكرة شركتك</div>
    <div class="memory-card-value">${escHtml(memoryValueText(item.value))}</div>
    <div class="memory-card-meta">${escHtml(freshness)} · آخر تحقق ${escHtml(item.observed_at || 'غير معروف')}</div>
    <div class="memory-card-actions">
      ${hasConflict
        ? '<button class="memory-confirm" disabled style="opacity:.55;cursor:not-allowed">راجع التعارض أولًا</button>'
        : `<button class="memory-confirm" onclick="confirmMemory('${escHtml(q.key)}','${escHtml(item.memory_id)}','${escHtml(item.version_id)}')">صحيحة، استخدمها</button>`}
      <button class="memory-update" onclick="updateMemory('${escHtml(q.key)}')">تغيّرت، سأحدّثها</button>
    </div>
  </div>`;
}

async function confirmMemory(questionKey, memoryId, displayedVersionId) {
  const item = (COMPANY_MEMORY.items || []).find(row => row.memory_id === memoryId);
  if (!item) return;
  try {
    const response = await fetch(`/api/companies/{{ company_id|default('') }}/memory/${encodeURIComponent(memoryId)}/confirm${PREVIEW_QUERY}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        reason:'تأكيد من تدفق Discovery',
        presented_version_id:displayedVersionId
      })
    });
    const payload = await response.json();
    if (!response.ok || !payload.success) throw new Error(payload.error || 'تعذر التأكيد');
    if (!payload.data || payload.data.status !== 'ACTIVE' ||
        payload.data.current_version_id !== payload.data.version_id) {
      throw new Error('لم تصبح المعلومة مؤكدة؛ راجع التعارض قبل استخدامها.');
    }
    ans[questionKey] = item.value;
    scheduleDraftSave();
    showToast('تم التأكيد؛ ستُستخدم المعلومة في هذه الإجابة.', () => render());
  } catch (error) {
    showToast(error.message || 'تعذر تأكيد المعلومة الآن.');
  }
}

function updateMemory(questionKey) {
  const card = document.getElementById(`memory-${questionKey}`);
  if (card) card.remove();
  delete ans[questionKey];
  scheduleDraftSave();
  showToast('لن نستخدم القيمة القديمة؛ اختر الإجابة الحالية.');
}

function renderChoices(choices, key, mode, current, inline = false) {
  const isMulti = mode === 'multi';
  const isFu    = mode === 'fu-single';
  const sel = isMulti ? (current || []) : null;
  const useGrid2 = choices.length <= 4 || inline;
  const cls = useGrid2 ? 'choices grid2' : 'choices';

  const items = choices.map(c => {
    let selectedCls = '';
    if (isMulti)   selectedCls = (sel || []).includes(c) ? ' sel-teal' : '';
    else if (isFu) selectedCls = current === c ? ' sel-teal' : '';
    else           selectedCls = current === c ? ' selected' : '';
    const clickFn = isMulti
      ? `toggleMulti('${escJs(c)}')`
      : isFu
        ? `pickFuChoice('${escJs(key)}','${escJs(c)}')`
        : `pickChoice('${escJs(key)}','${escJs(c)}')`;
    return `<button type="button" class="choice${selectedCls}" aria-pressed="${selectedCls ? 'true' : 'false'}" onclick="${clickFn}">${c}</button>`;
  }).join('');

  return `<div class="${cls}" id="${isFu ? 'fu-choices' : 'main-choices'}">${items}</div>`;
}

// ────────────────────────────────────────────────
// INTERACTIONS
// ────────────────────────────────────────────────
function pickChoice(key, value) {
  ans[key] = value;
  scheduleDraftSave();
  const q = Q[step - 1];
  const choiceEls = document.getElementById('main-choices');
  if (choiceEls) {
    choiceEls.querySelectorAll('.choice').forEach(el => {
      el.className = 'choice' + (el.textContent.trim() === value ? ' selected' : '');
    });
  }

  if (q.type === 'single') {
    showToast(q.motivation, goNext);
  } else if (q.type === 'single+text') {
    if (!shouldShowFollowup(q, value) && q.textKey) delete ans[q.textKey];
    renderQuestion(q);
  } else {
    // show follow-up
    const showFu = shouldShowFollowup(q, value);
    const fw = document.getElementById('fu-wrap');
    const nb = document.getElementById('next-btn');
    if (fw) {
      fw.hidden = !showFu;
      fw.setAttribute('aria-hidden', String(!showFu));
      fw.classList.toggle('show', showFu);
    }
    if (nb) nb.classList.add('show');
  }
}

function shouldShowFollowup(q, choice) {
  return !!choice && !(q.hideFollowupFor || []).includes(choice);
}

function pickFuChoice(fuKey, value) {
  ans[fuKey] = value;
  scheduleDraftSave();
  const q = Q[step - 1];
  const fuEl = document.getElementById('fu-choices');
  if (fuEl) {
    fuEl.querySelectorAll('.choice').forEach(el => {
      el.className = 'choice' + (el.textContent.trim() === value ? ' sel-teal' : '');
    });
  }
  showToast(q.motivation, goNext);
}

function afterFollowupText() {
  const q = Q[step - 1];
  scheduleDraftSave();
  showToast(q.motivation, goNext);
}

function toggleMulti(value) {
  const q = Q[step - 1];
  if (!ans[q.key]) ans[q.key] = [];
  const arr = ans[q.key];
  const idx = arr.indexOf(value);
  if (idx >= 0) {
    arr.splice(idx, 1);
  } else if (arr.length < q.maxSelect) {
    arr.push(value);
  }
  scheduleDraftSave();
  const cnt = document.getElementById('multi-count');
  const nb  = document.getElementById('next-btn');
  if (cnt) cnt.textContent = `محدد ${arr.length}/${q.maxSelect}`;
  if (nb) nb.classList.toggle('show', arr.length > 0);
  const mainCh = document.getElementById('main-choices');
  if (mainCh) {
    mainCh.querySelectorAll('.choice').forEach(el => {
      el.className = 'choice' + (arr.includes(el.textContent.trim()) ? ' sel-teal' : '');
    });
  }
}

function submitMulti() {
  const q = Q[step - 1];
  if (!ans[q.key] || ans[q.key].length === 0) return;
  showToast(q.motivation, goNext);
}

function goNext() {
  step++;
  scheduleDraftSave();
  transitionTo(render, false);
}

function goBack() {
  step--;
  scheduleDraftSave();
  transitionTo(render, true);
}

// ────────────────────────────────────────────────
// ESCAPE HELPERS
// ────────────────────────────────────────────────
function escHtml(str) { return (str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function escJs(str) { return (str||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

// ────────────────────────────────────────────────
// INIT
// dev: ?step=N يفتح سؤالًا محددًا مباشرة (للمعاينة فقط)
// ────────────────────────────────────────────────
const _devStep = parseInt(new URL(location.href).searchParams.get('step') || '0');
function showDiscoveryLoadError(error) {
  console.error('Discovery failed to render', error);
  $progress.classList.remove('visible');
  $screen.innerHTML = `
    <div class="journey-state-panel dark error">
      <div>تعذر فتح أسئلة الاكتشاف الآن.</div>
      <button type="button" class="journey-retry" onclick="window.location.reload()">أعد المحاولة</button>
      <a class="journey-retry" href="${JOURNEY_URLS.onboarding}">ارجع للبيانات الأساسية</a>
    </div>`;
}

try {
  if (_devStep > 0 && _devStep <= 8) step = _devStep;
  if (!_devStep) restoreDiscoveryDraft(INITIAL_DISCOVERY_DRAFT);
  if (
    !_devStep &&
    INITIAL_DISCOVERY_DRAFT &&
    INITIAL_DISCOVERY_DRAFT.payload &&
    INITIAL_DISCOVERY_DRAFT.current_step === 0 &&
    INITIAL_DISCOVERY_DRAFT.payload.fit_gate &&
    Object.values(INITIAL_DISCOVERY_DRAFT.payload.fit_gate).some(Boolean)
  ) {
    renderFitGate();
  } else {
    render();
  }
} catch (error) {
  showDiscoveryLoadError(error);
}
window.addEventListener('pagehide', () => {
  if (DRAFT_ENABLED && !discoveryFinalizing) saveDraftNow(true);
});
</script>
