<html lang="ar" dir="rtl">

<meta charset="UTF-8">

<title>جلسة الاكتشاف — سنع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0B132B; --navy2: #111d3e;
    --gold: #F2B233; --gold-dim: rgba(242,178,51,.15); --gold-border: rgba(242,178,51,.35);
    --teal: #0EA5A5; --teal-dim: rgba(14,165,165,.12);
    --ink: #E8ECF4; --muted: #7A8DA8; --line: rgba(255,255,255,.09);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: var(--navy);
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    color: var(--ink); overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; align-items: center; }

  /* ── Progress bar ── */
  #progress-wrap {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 14px 24px 0; display: flex; flex-direction: column; gap: 6px;
    opacity: 0; transition: opacity .3s;
  }
  #progress-wrap.visible { opacity: 1; }
  #progress-track {
    height: 3px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden;
  }
  #progress-fill {
    height: 100%; background: var(--gold); border-radius: 99px;
    transition: width .6s cubic-bezier(.4,0,.2,1);
  }
  #progress-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--muted); letter-spacing: .04em; text-align: left; direction: ltr;
  }

  /* ── Stage ── */
  #stage {
    width: 100%; max-width: 480px;
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 80px 20px 100px; position: relative;
  }

  /* ── Screen ── */
  .screen {
    width: 100%; display: flex; flex-direction: column; align-items: center;
    gap: 0;
  }
  .screen.entering { animation: sldIn .35s cubic-bezier(.25,.46,.45,.94) forwards; }
  .screen.exiting  { animation: sldOut .3s cubic-bezier(.55,0,1,.45) forwards; }
  @keyframes sldIn  { from { opacity: 0; transform: translateX(32px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes sldOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(-32px); } }

  /* ── Question icon ── */
  .q-icon { width: 52px; height: 52px; margin-bottom: 20px; }

  /* ── Question title ── */
  .q-title {
    font-family: 'Cairo', sans-serif; font-weight: 800;
    font-size: clamp(19px, 5vw, 23px); color: #fff;
    text-align: center; line-height: 1.45; margin-bottom: 8px;
  }
  .q-sub {
    font-size: 14px; color: var(--muted); text-align: center;
    margin-bottom: 26px; line-height: 1.6;
  }

  /* ── Choice grid ── */
  .choices {
    display: flex; flex-direction: column; gap: 10px; width: 100%;
  }
  .choices.grid2 {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .choice {
    background: rgba(255,255,255,.04); border: 1.5px solid var(--line);
    border-radius: 12px; padding: 13px 16px;
    font-size: 14px; font-weight: 500; color: var(--ink);
    cursor: pointer; text-align: right;
    transition: background .15s, border-color .15s, color .15s;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .choice:hover { background: rgba(242,178,51,.08); border-color: var(--gold-border); }
  .choice.selected {
    background: var(--gold-dim); border-color: var(--gold);
    color: var(--gold); font-weight: 700;
  }
  .choice.sel-teal {
    background: var(--teal-dim); border-color: var(--teal);
    color: var(--teal); font-weight: 700;
  }

  /* ── Follow-up section ── */
  .followup-wrap {
    width: 100%; margin-top: 18px;
    border-top: 1px solid var(--line); padding-top: 16px;
    opacity: 0; transform: translateY(8px);
    transition: opacity .3s, transform .3s;
    pointer-events: none;
  }
  .followup-wrap.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .followup-label {
    font-size: 13px; color: var(--muted); margin-bottom: 12px; text-align: center;
  }
  .followup-input {
    width: 100%; background: transparent;
    border: none; border-bottom: 1.5px solid rgba(255,255,255,.2);
    color: #fff; font-size: 14.5px; font-family: inherit;
    padding: 8px 2px; outline: none; transition: border-color .2s;
    text-align: right;
  }
  .followup-input:focus { border-bottom-color: var(--gold); }
  .followup-input::placeholder { color: var(--muted); }

  /* ── Next / submit button ── */
  .next-btn {
    margin-top: 22px; width: 100%;
    background: var(--gold); color: var(--navy);
    font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 15px;
    border: none; border-radius: 12px; padding: 15px 24px;
    cursor: pointer; transition: opacity .2s, transform .1s;
    opacity: 0; pointer-events: none; transform: translateY(4px);
    transition: opacity .25s, transform .25s;
  }
  .next-btn.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .next-btn:active { transform: scale(.98); }

  /* ── Motivation toast ── */
  #motivation {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: rgba(14,165,165,.18); border: 1px solid rgba(14,165,165,.4);
    backdrop-filter: blur(8px); border-radius: 30px;
    padding: 10px 22px; font-size: 13.5px; color: var(--teal);
    white-space: nowrap; max-width: calc(100% - 40px);
    opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 200;
    text-align: center; font-weight: 600;
  }
  #motivation.show { opacity: 1; }

  /* ── Welcome screen ── */
  .welcome-logo { margin-bottom: 28px; }
  .welcome-title {
    font-family: 'Cairo', sans-serif; font-weight: 900;
    font-size: clamp(26px, 7vw, 34px); color: #fff; text-align: center;
    margin-bottom: 12px; line-height: 1.3;
  }
  .welcome-sub {
    font-size: 15px; color: var(--muted); text-align: center;
    margin-bottom: 36px; line-height: 1.7; max-width: 340px;
  }
  .start-btn {
    background: var(--gold); color: var(--navy);
    font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 16px;
    border: none; border-radius: 14px; padding: 16px 52px;
    cursor: pointer; transition: opacity .2s, transform .1s;
  }
  .start-btn:active { transform: scale(.97); }

  /* ── Outro screen ── */
  .outro-wrap { text-align: center; }
  /* ── Passport rows ── */
  .pp-row { display:flex; gap:12px; align-items:flex-start; }
  .pp-icon { font-size:18px; min-width:26px; padding-top:1px; }
  .pp-label { display:block; color:rgba(255,255,255,0.4); font-size:11px;
              letter-spacing:.03em; margin-bottom:3px; }
  .pp-val { display:block; color:#E8ECF4; font-size:14px; line-height:1.45; }
  .outro-logo { animation: logoIn .6s ease forwards; margin-bottom: 24px; }
  @keyframes logoIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }
  .outro-title {
    font-family: 'Cairo', sans-serif; font-weight: 900;
    font-size: 26px; color: #fff; margin-bottom: 14px;
  }
  .outro-body {
    font-size: 14.5px; color: var(--muted); line-height: 1.8;
    margin-bottom: 32px; max-width: 340px; text-align: center;
  }
  .outro-btn {
    background: var(--gold); color: var(--navy);
    font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 16px;
    border: none; border-radius: 14px; padding: 16px 36px;
    cursor: pointer; transition: opacity .2s, transform .1s; display: inline-block;
  }
  .outro-btn:active { transform: scale(.97); }
  .loading-dots { color: var(--muted); font-size: 22px; letter-spacing: 4px; }

  /* ── Multi-select badge ── */
  .multi-count {
    font-family: 'IBM Plex Mono', monospace; direction: ltr;
    font-size: 11px; color: var(--teal); text-align: left;
    margin-bottom: 10px;
  }

  /* ── Sana logo SVG inline ── */
  .sana-logo { display: block; }
</style>

  $fill.style.width = pct + '%';
  const rem = 7 - s;
  $label.textContent = rem === 0 ? 'السؤال الأخير' : `بقي ${rem === 1 ? 'سؤال واحد' : rem + ' أسئلة'}`;
}

let toastTimer;
function showToast(msg, cb) {
  clearTimeout(toastTimer);
  $toast.textContent = msg;
  $toast.classList.add('show');
  toastTimer = setTimeout(() => {
    $toast.classList.remove('show');
    if (cb) setTimeout(cb, 300);
  }, 1600);
}

function transitionTo(renderFn) {
  const cur = $screen;
  cur.classList.add('exiting');
  setTimeout(() => {
    cur.className = 'screen';
    renderFn();
    cur.classList.add('entering');
    setTimeout(() => cur.classList.remove('entering'), 350);
  }, 290);
}

// ────────────────────────────────────────────────
// RENDERERS
// ────────────────────────────────────────────────
function render() {
  updateProgress(step);
  if (step === 0) return renderWelcome();
  if (step === 8) return renderOutro();
  renderQuestion(Q[step - 1]);
}

let _welcomeTimer = null;

function renderWelcome() {
  $screen.innerHTML = `
    <div style="display:flex; flex-direction:column; align-items:center; gap:0; width:100%; max-width:420px;">
      <div class="welcome-logo">${LOGO_LG}</div>
      <div class="welcome-title" style="margin-bottom:20px;">مرحبًا في سنع</div>

      <div style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.10);
                  border-radius:14px; padding:22px 22px; text-align:right; margin-bottom:24px;
                  display:flex; flex-direction:column; gap:14px;">
        <p style="color:#fff; font-size:15px; font-weight:600; line-height:1.6; margin:0;">
          سنع ليس CRM، وليس ERP.
        </p>
        <p style="color:rgba(255,255,255,0.65); font-size:13.5px; line-height:1.75; margin:0;">
          سنع هو نظام الوضوح الإداري لشركتك — يساعدك تشوف شركتك من الداخل بعيون موضوعية،
          وتعرف أين القوة الحقيقية، وأين الخطر قبل ما يكبر.
        </p>
        <div style="border-top:1px solid rgba(255,255,255,0.08); padding-top:14px;
                    display:flex; flex-direction:column; gap:8px;">
          <div style="display:flex; gap:10px; align-items:flex-start; color:rgba(255,255,255,0.7); font-size:13px;">
            <span>📌</span><span>تشخيص واضح لأكبر تحدٍّ تواجهه اليوم</span>
          </div>
          <div style="display:flex; gap:10px; align-items:flex-start; color:rgba(255,255,255,0.7); font-size:13px;">
            <span>📌</span><span>خريطة أصول شركتك الخمسة</span>
          </div>
          <div style="display:flex; gap:10px; align-items:flex-start; color:rgba(255,255,255,0.7); font-size:13px;">
            <span>📌</span><span>أول توصية قابلة للتنفيذ هذا الأسبوع</span>
          </div>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:14px; width:100%;">
        <button class="start-btn" style="flex:1; margin:0;" onclick="skipWelcome()">
          ابدأ الجلسة ←
        </button>
        <div style="display:flex; flex-direction:column; align-items:center; gap:2px; min-width:44px;">
          <div id="welcome-count" style="font-family:'IBM Plex Mono',monospace; font-size:20px;
               font-weight:600; color:var(--gold);">30</div>
          <div style="font-size:10px; color:var(--muted);">ثانية</div>
        </div>
      </div>
    </div>`;

  // عدّاد 30 ثانية — يبدأ فور ظهور الشاشة
  let count = 30;
  _welcomeTimer = setInterval(() => {
    count--;
    const el = document.getElementById('welcome-count');
    if (el) el.textContent = count;
    if (count <= 0) { clearInterval(_welcomeTimer); _welcomeTimer = null; goNext(); }
  }, 1000);
}

function skipWelcome() {
  if (_welcomeTimer) { clearInterval(_welcomeTimer); _welcomeTimer = null; }
  goNext();
}

// step 8 — شاشة انتظار مؤقتة بينما يحفظ سنع الجلسة في الخلفية
function renderOutro() {
  $screen.innerHTML = `
    <div class="outro-wrap" style="align-items:center;">
      <div class="outro-logo">${LOGO_LG}</div>
      <div class="loading-dots" style="margin:24px 0; font-size:28px; color:var(--gold);">· · ·</div>
      <div style="color:rgba(255,255,255,0.5); font-size:13px;">يجمع سنع ملخص شركتك…</div>
    </div>`;
  saveAndFinish();
}

// شاشة جواز الشركة — تظهر مباشرة بعد اكتمال الحفظ (Step 8 النهائي)
function renderPassport(data) {
  const topAssetLabel = {
    '📚 الخبرة والمعرفة':         'المعرفة والخبرة',
    '⚙️ طريقة التشغيل والتنفيذ': 'التشغيل',
    '🏷️ الاسم والسمعة والبراند': 'البراند',
    '📊 البيانات والتقارير':      'البيانات',
    '👤 وجود المؤسس ومتابعته':   'الاستقلالية',
  };
  const dest = data.case_id ? `/case/${data.case_id}` : '/home';

  const rows = [
    data.sector        ? `<div class="pp-row"><span class="pp-icon">🏢</span><div><span class="pp-label">القطاع</span><span class="pp-val">${data.sector}</span></div></div>` : '',
    data.employee_count? `<div class="pp-row"><span class="pp-icon">👥</span><div><span class="pp-label">الفريق</span><span class="pp-val">${data.employee_count} موظف</span></div></div>` : '',
    data.main_goal     ? `<div class="pp-row"><span class="pp-icon">🎯</span><div><span class="pp-label">الهدف</span><span class="pp-val">${data.main_goal}</span></div></div>` : '',
    (data.top_asset && data.top_asset !== '❓ ما أعرف')
      ? `<div class="pp-row"><span class="pp-icon">⭐</span><div><span class="pp-label">تعتمد أكثر على</span><span class="pp-val" style="color:var(--gold);">${topAssetLabel[data.top_asset] || data.top_asset}</span></div></div>` : '',
    data.declared_problem ? `<div class="pp-row"><span class="pp-icon">⚠️</span><div><span class="pp-label">أكبر تحدٍّ</span><span class="pp-val">${data.declared_problem}</span></div></div>` : '',
  ].filter(Boolean).join('');

  $screen.innerHTML = `
    <div style="display:flex; flex-direction:column; align-items:center; width:100%; max-width:420px;">
      <div class="outro-logo">${LOGO_LG}</div>
      <div class="outro-title" style="font-size:17px; margin-bottom:6px;">🏢 جواز شركتك</div>
      <div style="color:rgba(255,255,255,0.45); font-size:12px; margin-bottom:20px;">
        ملخص ما رصده سنع من جلسة الاكتشاف
      </div>
      <div style="background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.10);
                  border-radius:14px; padding:18px 20px; width:100%;
                  display:flex; flex-direction:column; gap:14px;">
        ${rows || '<div style="color:var(--muted);font-size:13px;">جاري تحميل البيانات…</div>'}
      </div>
      <button class="outro-btn" style="margin-top:22px; width:100%;"
              onclick="location.href='${dest}'">
        ابدأ أول تشخيص ←
      </button>
    </div>`;
}

async function saveAndFinish() {
  let saveData = { case_id: null };
  try {
    const res = await fetch('/api/discovery/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(ans)
    });
    const json = await res.json();
    if (json.success && json.data) {
      saveData    = json.data;
      firstCaseId = json.data.case_id;
    }
  } catch(e) { /* silently continue — passport يظهر بإجابات الجلسة */ }

  // إثراء البيانات بإجابات الجلسة الحالية (تكون موجودة حتى لو فشل الـ API)
  saveData.main_goal        = saveData.main_goal        || ans.q1  || null;
  saveData.top_asset        = saveData.top_asset        || ans.q3  || null;
  saveData.declared_problem = saveData.declared_problem || ans.q2  || null;
  if (!saveData.case_id && firstCaseId) saveData.case_id = firstCaseId;

  // الانتقال لشاشة الجواز مباشرة (بغض النظر عن نجاح الـ API أو فشله)
  transitionTo(() => renderPassport(saveData));
}

function renderQuestion(q) {
  const chosen = ans[q.key];

  let body = '';

  if (q.type === 'single') {
    body += renderChoices(q.choices, q.key, 'single', chosen);
  }

  if (q.type === 'single+text') {
    body += renderChoices(q.choices, q.key, 'single', chosen);
    const textVal = ans[q.textKey] || '';
    const showFu = !!chosen;
    body += `
      <div class="followup-wrap${showFu ? ' show' : ''}" id="fu-wrap">
        <div class="followup-label">${q.textLabel}</div>
        <input class="followup-input" type="text"
          placeholder="اكتب هنا..."
          value="${escHtml(textVal)}"
          id="fu-input"
          onchange="ans['${q.textKey}']=this.value"
          oninput="ans['${q.textKey}']=this.value">
      </div>
      <button class="next-btn${showFu ? ' show' : ''}" id="next-btn"
        onclick="afterFollowupText()">التالي ←</button>`;
  }

  if (q.type === 'single+followup-choice') {
    const fuChosen = ans[q.fuKey];
    body += renderChoices(q.choices, q.key, 'single', chosen);
    const showFu = !!chosen;
    body += `
      <div class="followup-wrap${showFu ? ' show' : ''}" id="fu-wrap">
        <div class="followup-label">${q.fuLabel}</div>
        ${renderChoices(q.fuChoices, q.fuKey, 'fu-single', fuChosen, true)}
      </div>`;
  }

  if (q.type === 'multi') {
    const sel = ans[q.key] || [];
    body += `<div class="multi-count" id="multi-count">مختار ${sel.length}/${q.maxSelect}</div>`;
    body += renderChoices(q.choices, q.key, 'multi', sel);
    body += `<button class="next-btn${sel.length > 0 ? ' show' : ''}" id="next-btn"
      onclick="submitMulti()">إنهاء ←</button>`;
  }

  $screen.innerHTML = `
    ${q.icon}
    <div class="q-title">${q.title}</div>
    ${q.sub ? `<div class="q-sub">${q.sub}</div>` : ''}
    ${body}`;
}

function renderChoices(choices, key, mode, current, inline = false) {
  const isMulti = mode === 'multi';
  const isFu    = mode === 'fu-single';
  const sel = isMulti ? (current || []) : null;
  const useGrid2 = choices.length <= 4 || inline;
  const cls = useGrid2 ? 'choices grid2' : 'choices';

  const items = choices.map(c => {
    let selectedCls = '';
    if (isMulti)   selectedCls = (sel || []).includes(c) ? ' sel-teal' : '';
    else if (isFu) selectedCls = current === c ? ' sel-teal' : '';
    else           selectedCls = current === c ? ' selected' : '';
    const clickFn = isMulti
      ? `toggleMulti('${escJs(c)}')`
      : isFu
        ? `pickFuChoice('${escJs(key)}','${escJs(c)}')`
        : `pickChoice('${escJs(key)}','${escJs(c)}')`;
    return `<div class="choice${selectedCls}" onclick="${clickFn}">${c}</div>`;
  }).join('');

  return `<div class="${cls}" id="${isFu ? 'fu-choices' : 'main-choices'}">${items}</div>`;
}

// ────────────────────────────────────────────────
// INTERACTIONS
// ────────────────────────────────────────────────
function pickChoice(key, value) {
  ans[key] = value;
  const q = Q[step - 1];
  const choiceEls = document.getElementById('main-choices');
  if (choiceEls) {
    choiceEls.querySelectorAll('.choice').forEach(el => {
      el.className = 'choice' + (el.textContent.trim() === value ? ' selected' : '');
    });
  }

  if (q.type === 'single') {
    showToast(q.motivation, goNext);
  } else {
    // show follow-up
    const fw = document.getElementById('fu-wrap');
    const nb = document.getElementById('next-btn');
    if (fw) fw.classList.add('show');
    if (nb) nb.classList.add('show');
  }
}

function pickFuChoice(fuKey, value) {
  ans[fuKey] = value;
  const q = Q[step - 1];
  const fuEl = document.getElementById('fu-choices');
  if (fuEl) {
    fuEl.querySelectorAll('.choice').forEach(el => {
      el.className = 'choice' + (el.textContent.trim() === value ? ' sel-teal' : '');
    });
  }
  showToast(q.motivation, goNext);
}

function afterFollowupText() {
  const q = Q[step - 1];
  showToast(q.motivation, goNext);
}

function toggleMulti(value) {
  const q = Q[step - 1];
  if (!ans[q.key]) ans[q.key] = [];
  const arr = ans[q.key];
  const idx = arr.indexOf(value);
  if (idx >= 0) {
    arr.splice(idx, 1);
  } else if (arr.length < q.maxSelect) {
    arr.push(value);
  }
  const cnt = document.getElementById('multi-count');
  const nb  = document.getElementById('next-btn');
  if (cnt) cnt.textContent = `مختار ${arr.length}/${q.maxSelect}`;
  if (nb) nb.classList.toggle('show', arr.length > 0);
  const mainCh = document.getElementById('main-choices');
  if (mainCh) {
    mainCh.querySelectorAll('.choice').forEach(el => {
      el.className = 'choice' + (arr.includes(el.textContent.trim()) ? ' sel-teal' : '');
    });
  }
}

function submitMulti() {
  const q = Q[step - 1];
  if (!ans[q.key] || ans[q.key].length === 0) return;
  showToast(q.motivation, goNext);
}

function goNext() {
  step++;
  transitionTo(render);
}

// ────────────────────────────────────────────────
// ESCAPE HELPERS
// ────────────────────────────────────────────────
function escHtml(str) { return (str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function escJs(str) { return (str||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

// ────────────────────────────────────────────────
// INIT
// dev: ?step=N يفتح سؤالًا محددًا مباشرة (للمعاينة فقط)
// ────────────────────────────────────────────────
const _devStep = parseInt(new URL(location.href).searchParams.get('step') || '0');
if (_devStep > 0 && _devStep <= 8) step = _devStep;
render();
</script>
