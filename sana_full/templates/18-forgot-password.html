<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<script>(function(){var m=document.querySelector('meta[name="csrf-token"]');if(!m)return;var t=m.content;var S=new Set(['POST','PUT','PATCH','DELETE']);var F=window.fetch.bind(window);window.fetch=function(u,o){o=o||{};if(S.has((o.method||'GET').toUpperCase())){o.headers=Object.assign({'X-CSRFToken':t},o.headers||{});}return F(u,o);};})();</script>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F6FB">
<title>سنع — نسيت كلمة المرور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html{ color-scheme: light; background:#F5F6FB; }
  :root{
    --navy:#0B132B; --teal:#0EA5A5; --teal-light:#E1F5F5;
    --gold:#F2B233; --paper:#F5F6FB; --ink:#333940; --slate:#6E7580; --line:#DEE1EC; --red-risk:#B23A2E;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  .mark{ width:36px; height:36px; margin-bottom:18px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:32px 28px; max-width:380px; width:100%; }
  h1{ font-size:19px; font-weight:600; color:var(--navy); margin-bottom:6px; text-align:center; }
  .sub{ font-size:12.5px; color:var(--slate); text-align:center; margin-bottom:26px; line-height:1.7; }
  label{ display:block; font-size:12.5px; font-weight:600; color:var(--navy); margin-bottom:6px; }
  input{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:8px; font-family:inherit;
    font-size:13.5px; margin-bottom:16px; background:#F9FAFC;
  }
  input:focus{ outline:none; border-color:var(--teal); background:#fff; }
  .btn{
    width:100%; padding:12px; border:none; border-radius:8px; background:var(--navy); color:#fff;
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; transition:opacity .15s;
  }
  .btn:hover{ opacity:.9; }
  .btn:disabled{ opacity:.6; cursor:not-allowed; }
  .msg{ display:none; font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:16px; }
  .msg.error{ background:#FCEBEA; color:var(--red-risk); }
  .msg.success{ background:#E6F7F0; color:#1A7A50; }
  .msg.show{ display:block; }
  .foot{ text-align:center; margin-top:20px; font-size:12.5px; color:var(--slate); }
  .foot a{ color:var(--teal); font-weight:600; text-decoration:none; }
</style>
</head>
<body>

  <svg class="mark" viewBox="0 0 100 100">
    <path d="M78,32 L78,17 L19,17 L19,83 L78,83 L78,68" fill="none" stroke="#0B132B" stroke-width="9" stroke-linecap="square"/>
    <rect x="44" y="41" width="19" height="19" fill="#F2B233"/>
  </svg>

  <div class="card">
    <h1>نسيت كلمة المرور؟</h1>
    <div class="sub">أدخل بريدك وسنرسل رابطًا صالحًا لمدة 30 دقيقة.</div>

    <div class="msg error" id="errorMsg"></div>
    <div class="msg success" id="successMsg"></div>

    <div id="formSection">
      <label for="email">البريد الإلكتروني</label>
      <input type="email" id="email" autocomplete="email" placeholder="بريدك الإلكتروني">

      <button class="btn" id="submitBtn" onclick="doForgot()">إرسال الرابط</button>
    </div>

    <div class="foot"><a href="/login">→ العودة لتسجيل الدخول</a></div>
  </div>

<script>
async function doForgot(){
  const email    = document.getElementById('email').value.trim();
  const errorMsg = document.getElementById('errorMsg');
  const successMsg = document.getElementById('successMsg');
  const btn      = document.getElementById('submitBtn');
  errorMsg.classList.remove('show');
  successMsg.classList.remove('show');

  if(!email){
    errorMsg.textContent = 'الرجاء إدخال بريدك الإلكتروني.';
    errorMsg.classList.add('show');
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'جارٍ الإرسال...';

  try{
    const res  = await fetch('/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const json = await res.json();

    if(json.success){
      // أخفِ النموذج وأظهر الرسالة فقط
      document.getElementById('formSection').style.display = 'none';
      successMsg.textContent = json.message;
      successMsg.classList.add('show');
    } else {
      errorMsg.textContent = json.message || 'حدث خطأ، حاول مرة أخرى.';
      errorMsg.classList.add('show');
      btn.disabled    = false;
      btn.textContent = 'إرسال الرابط';
    }
  } catch(e){
    errorMsg.textContent = 'تعذّر الاتصال بالخادم، حاول مرة أخرى.';
    errorMsg.classList.add('show');
    btn.disabled    = false;
    btn.textContent = 'إرسال الرابط';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('email').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') doForgot();
  });
});
</script>

</body>
</html>
