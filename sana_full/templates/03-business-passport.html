<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<script>(function(){var m=document.querySelector('meta[name="csrf-token"]');if(!m)return;var t=m.content;var S=new Set(['POST','PUT','PATCH','DELETE']);var F=window.fetch.bind(window);window.fetch=function(u,o){o=o||{};if(S.has((o.method||'GET').toUpperCase())){o.headers=Object.assign({'X-CSRFToken':t},o.headers||{});}return F(u,o);};})();</script>
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F6FB">
<title>سنع — جواز سفر الشركة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html{ color-scheme: light; background:#F5F6FB; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:#F5F6FB; color:#333940; font-family:'IBM Plex Sans Arabic', sans-serif; line-height:1.6; }
  .num{ font-family:'Space Grotesk', sans-serif; }
  a{ color:inherit; text-decoration:none; }

  .concept-nav{ background:#080E1F; padding:10px 20px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap; }
  .concept-nav a{ font-size:11.5px; color:rgba(255,255,255,0.5); padding:6px 12px; border-radius:20px; }
  .concept-nav a.active{ background:rgba(242,178,51,0.15); color:#F2B233; font-weight:600; }

  .cover{ background:#0B132B; color:#fff; padding:40px 28px 34px; text-align:center; }
  .cover .name{ font-size:22px; font-weight:700; margin-bottom:4px; }
  .cover .sub{ font-size:12.5px; color:rgba(255,255,255,0.5); margin-bottom:26px; }
  .cover .value-row{ display:flex; justify-content:center; gap:40px; flex-wrap:wrap; }
  .cover .vitem .label{ font-size:11px; color:rgba(255,255,255,0.5); margin-bottom:6px; }
  .cover .vitem .val{ font-family:'Space Grotesk'; font-size:24px; font-weight:600; }
  .cover .vitem.gold .val{ color:#F2B233; }
  .cover .vitem.teal .val{ color:#0EA5A5; }

  main{ max-width:900px; margin:0 auto; padding:26px 20px 60px; }
  section{ background:#fff; border:1px solid #DEE1EC; border-radius:12px; padding:22px; margin-bottom:18px; }
  section h2{ font-size:15px; font-weight:600; color:#0B132B; margin-bottom:14px; }

  .gap-bar{ height:30px; border-radius:8px; background:#EBEDF5; position:relative; overflow:hidden; margin-bottom:10px; }
  .gap-bar .fill{ position:absolute; top:0; right:0; height:100%; background:#0EA5A5; }
  .gap-labels{ display:flex; justify-content:space-between; font-size:12px; color:#6E7580; }

  .disclaimer{ font-size:11px; color:#9AA0AB; margin-top:10px; font-style:italic; }

  .asset-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #DEE1EC; font-size:13px; }
  .asset-row:last-child{ border-bottom:none; }
  .asset-row .ar-name{ min-width:90px; }
  .asset-row .ar-score{ font-family:'Space Grotesk'; font-weight:600; min-width:30px; text-align:left; }
  .ev-bar{ flex:1; height:6px; background:#EBEDF5; border-radius:3px; overflow:hidden; }
  .ev-bar-fill{ height:100%; background:#0EA5A5; border-radius:3px; transition:width .4s; }
  .ev-count{ font-family:'Space Grotesk'; font-size:11px; color:#9AA0AB; min-width:28px; text-align:left; }
  .skeleton{ color:#9AA0AB; font-size:13px; padding:40px 0; text-align:center; }
  .journey-card{ border:1.5px solid #DEE1EC; background:#fff; }
  .journey-card.neutral{ border-color:#BFC7D8; }
  .journey-card.warning{ border-color:#F2B233; background:#FFFDF7; }
  .journey-card.review,.journey-card.complete{ border-color:#0EA5A5; background:#F7FFFE; }
  .journey-kicker{ color:#6E7580; font-size:10px; letter-spacing:1.5px; font-weight:700; margin-bottom:5px; }
  .journey-title{ color:#0B132B; font-size:16px; font-weight:700; margin-bottom:6px; }
  .journey-message{ color:#6E7580; font-size:13px; line-height:1.7; }
  .journey-action{ display:inline-block; margin-top:14px; padding:9px 16px; border-radius:7px; background:#0B132B; color:#fff; font-size:12.5px; font-weight:600; }
  .deferred-note{ background:#F5F6FB; border:1px solid #DEE1EC; border-radius:10px; padding:14px 16px; color:#6E7580; font-size:12.5px; line-height:1.7; }

  /* ── SDS-002: قسم "بقيت فجوة واحدة" ── */
  .sds-section{
    background:#fff; border:1.5px solid #F2B233; border-radius:12px;
    padding:22px; margin:0 20px 60px; max-width:900px;
    margin-left:auto; margin-right:auto;
  }
  .sds-eyebrow{ font-family:'Space Grotesk'; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#F2B233; font-weight:600; margin-bottom:10px; }
  .sds-q{ font-size:15px; font-weight:600; color:#0B132B; margin-bottom:18px; line-height:1.5; }
  .sds-options{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:0; }
  .sds-opt{
    flex:1; min-width:100px; padding:10px 14px; border:1.5px solid #DEE1EC;
    border-radius:8px; text-align:center; font-size:13px; font-weight:600;
    cursor:pointer; background:#F5F6FB; color:#6E7580; transition:all .15s;
    font-family:'IBM Plex Sans Arabic';
  }
  .sds-opt:hover{ border-color:#F2B233; color:#0B132B; }
  .sds-opt.selected{ background:#FFF8E6; border-color:#F2B233; color:#7A5C00; }
  .sds-opt.saving{ opacity:.55; cursor:not-allowed; }
  .sds-msg{ margin-top:14px; font-size:13px; color:#0B132B; display:none; }
  .sds-msg.show{ display:block; }
  .sds-suggestion{ margin-top:10px; font-size:12.5px; color:#6E7580; font-style:italic; display:none; }
  .sds-suggestion.show{ display:block; }
</style>
</head>
<body>

<div class="concept-nav">
  <a href="/home{{ context_query }}">اليوم</a>
  <a href="/passport{{ context_query }}" class="active">الأصول</a>
  <a href="/logout">تسجيل الخروج</a>
</div>

<div id="app">
  <div class="skeleton">يحسب سنع قيمة الشركة...</div>
</div>

<script>
const COMPANY_ID = {{ company_id|tojson }};
const CQS = {{ context_query|tojson }};

async function loadPassport(){
  const [passRes, sdsRes] = await Promise.all([
    fetch(`/api/companies/${COMPANY_ID}/passport${CQS}`),
    fetch(`/api/companies/${COMPANY_ID}/sds-question${CQS}`)
  ]);
  const passJson = await passRes.json();
  const sdsJson  = await sdsRes.json();
  if(!passJson.success){ document.getElementById('app').innerHTML = '<p>تعذر تحميل الجواز</p>'; return; }
  render(passJson.data, passJson.meta, sdsJson.success ? sdsJson.data : null);
}

function render(d, meta, sds){
  const journey = d.journey || {
    status:'NOT_RUN',
    label:'لم يُشغّل بعد',
    message:'لم تكتمل صورة الشركة بعد.',
    action_label:'ابدأ تقييم الأصول',
    action_url:'/assessment',
    tone:'neutral'
  };
  const scoreProgress = d.score_progress || {complete:0, total:0};
  const scoreByType = Object.fromEntries(
    (d.scan_asset_scores || []).map(item => [item.asset_type, item])
  );

  let html = `
    <div class="cover">
      <div class="name">${d.company.name}</div>
      <div class="sub">صورة الشركة الحالية · مُحدَّثة الآن</div>
      <div class="value-row">
        <div class="vitem teal"><div class="label">مؤشر الجاهزية التشغيلي</div><div class="val num">${d.operational_score == null ? '—' : d.operational_score}<span style="font-size:13px;">${d.operational_score == null ? '' : '/100'}</span></div></div>
        <div class="vitem"><div class="label">وضعك الآن</div><div class="val" style="font-family:'IBM Plex Sans Arabic';font-size:15px;">${journey.label}</div></div>
        <div class="vitem gold"><div class="label">المحاور المكتملة</div><div class="val num">${scoreProgress.complete}<span style="font-size:13px;">/${scoreProgress.total || 0}</span></div></div>
      </div>
    </div>

    <main>
      <section class="journey-card ${journey.tone}" data-testid="live-scan-journey" data-scan-status="${journey.status}">
        <div class="journey-kicker">خطوتك التالية</div>
        <div class="journey-title">${journey.label}</div>
        <div class="journey-message">${journey.message}</div>
        <a class="journey-action" href="${journey.action_url}${CQS}">${journey.action_label} ←</a>
      </section>

      <section data-testid="live-passport-summary">
        <div class="journey-kicker">صورة الشركة</div>
        <h2>أين تحتاج أن تبدأ؟</h2>
        <p style="font-size:12px;color:#6E7580;margin:-6px 0 12px;line-height:1.7;">ابدأ بالأصل الأقل جاهزية. يمكنك فتح التقرير عند الحاجة لمراجعة التفاصيل.</p>
  `;
  // التقدم هو تغطية المعلومات لكل أصل، لا عدد الأسئلة.
  d.assets.slice().sort((a,b)=>(a.current_score || 0)-(b.current_score || 0)).forEach(a=>{
    const scanScore = scoreByType[a.asset_type] || {};
    const coverage = ((scanScore.information_completeness || {}).score || 0);
    const scoreText = scanScore.score == null ? 'بانتظار المعلومات' : `${scanScore.score}/100`;
    html += `<div class="asset-row">
      <span class="ar-name">${a.client_asset_name}</span>
      <div class="ev-bar" title="تغطية المعلومات"><div class="ev-bar-fill" style="width:${coverage}%"></div></div>
      <span class="ev-count">${coverage}%</span>
      <span class="ar-score" style="font-size:11px;">${scoreText}</span>
    </div>`;
  });
  html += `</section>
      <section>
        <h2>التقييم المالي</h2>
        <div class="deferred-note">${meta.financial_value_note || 'لا يمكن عرض قيمة مالية الآن؛ نحتاج معلومات مالية موثقة أولًا.'}</div>
      </section>
      ${d.weakest_asset_case_id ? `
      <section style="text-align:center;">
        <a href="/case/${d.weakest_asset_case_id}/result${CQS}" style="color:#0EA5A5; font-weight:600; font-size:13.5px;">← ابدأ من أضعف أصل: افتح نتيجة التشخيص</a>
      </section>` : ''}
      <section style="text-align:center;">
        <div style="font-size:11.5px;color:#6E7580;margin-bottom:8px;">راجع التفاصيل قبل اتخاذ قرار كبير.</div>
        <a data-testid="executive-report-link" href="${journey.report_url || `/company/${COMPANY_ID}/scan-report`}" style="display:inline-block;color:#0EA5A5;font-weight:600;font-size:13.5px;margin-bottom:8px;">عرض الملخص التنفيذي ←</a>
        ${['REVIEW_REQUIRED','COMPLETE'].includes(journey.status) ? `<a data-testid="execution-plan-link" href="/company/${COMPANY_ID}/execution-plan${CQS}" style="display:inline-block;color:#0B132B;font-weight:600;font-size:13.5px;margin:0 12px 8px;">خطة التنفيذ ←</a>` : ''}
        <br>
        <button class="btn" id="downloadReportBtn" onclick="downloadReport()"
          style="background:#0B132B; color:#fff; border:none; padding:11px 22px; border-radius:7px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:'IBM Plex Sans Arabic';">
          ⬇ تحميل التقرير
        </button>
      </section>
    </main>
  `;
  document.getElementById('app').innerHTML = html;

  if(sds && sds.question){
    const optHtml = sds.options.map(opt =>
      `<button class="sds-opt" onclick="sdsAnswer('${opt.replace(/'/g,"\\'")}', this)">${opt}</button>`
    ).join('');
    const sec = document.createElement('div');
    sec.className = 'sds-section';
    sec.id = 'sdsSection';
    sec.innerHTML = `
      <div class="sds-eyebrow">خطوة سريعة</div>
      <div class="sds-q">${sds.question} <span style="font-size:11px; color:#9AA0AB; font-weight:400;">(${sds.client_asset_name})</span></div>
      <div style="font-size:12px;color:#6E7580;margin:-8px 0 14px;">تغطية المعرفة ${sds.progress?.knowledge_coverage || 0}% · جودة الأدلة ${sds.progress?.evidence_quality || 0}% · سؤال واحد يؤثر في القرار.</div>
      <div class="sds-options">${optHtml}</div>
      <div class="sds-msg" id="sdsMsg">تم تحديث الصورة</div>
      <div class="sds-suggestion" id="sdsSuggestion"></div>
    `;
    document.getElementById('app').after(sec);
    // حفظ البيانات لدالة الإجابة
    window._sdsMeta = sds;
  }
}

// ── SDS-002: حفظ الإجابة كـ evidence بنفس الـendpoint المستخدم في assessment ──
async function sdsAnswer(choice, btn){
  const sds = window._sdsMeta;
  if(!sds) return;
  // تعطيل كل الأزرار أثناء الحفظ
  document.querySelectorAll('.sds-opt').forEach(b => b.classList.add('saving'));
  btn.classList.add('selected');
  const pendingMsg = document.getElementById('sdsMsg');
  pendingMsg.textContent = 'جارٍ الحفظ وتحديث الصورة…';
  pendingMsg.classList.add('show');

  const title = `${sds.question} — الإجابة: ${choice}`;
  const confMap = { 'نعم': 90, 'جزئيًا': 60, 'قيد الإعداد': 60, 'قليل (0-2)': 90, 'متوسط (3-6)': 60 };
  const confidence = confMap[choice] || 30;

  try{
    const res = await fetch(`/api/companies/${COMPANY_ID}/evidence`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title,
        case_id:     sds.case_id,
        asset_id:    sds.asset_id,
        source_type: 'SDS-002 تشخيص تراكمي',
        source_ref: sds.question_id,
        question_id: sds.question_id,
        answer: choice,
        adaptive_answer: true,
        information_type: 'Narrative',
        verification_status: 'UNVERIFIED',
        source_category: 'SELF_REPORTED',
        confidence
      })
    });
    const json = await res.json();
    const msg  = document.getElementById('sdsMsg');
    const sug  = document.getElementById('sdsSuggestion');
    if(res.ok && json.success){
      msg.textContent = 'تم حفظ الإجابة وتحديث الصورة';
      msg.classList.add('show');
      setTimeout(() => {
        if(json.data.next_question) location.reload();
        else location.href = json.data.result_url || `/case/${sds.case_id}/result`;
      }, 180);
    } else {
      msg.textContent = '⚠️ تعذر الحفظ — حاول مرة أخرى.';
      msg.classList.add('show');
    }
  } catch(e){
    document.getElementById('sdsMsg').textContent = '⚠️ تعذر الاتصال بالخادم.';
    document.getElementById('sdsMsg').classList.add('show');
  }
  document.querySelectorAll('.sds-opt').forEach(b => b.classList.remove('saving'));
}

async function downloadReport(){
  const btn = document.getElementById('downloadReportBtn');
  btn.disabled = true;
  const originalText = btn.textContent;
  btn.textContent = 'جارٍ التحضير...';
  try{
    const res = await fetch(`/api/companies/${COMPANY_ID}/scan/report-pdf${CQS}`);
    if(res.ok){
      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href = url;
      a.download = `ملخص الشركة.pdf`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } else {
      showToast('تعذر توليد PDF — حاول مرة أخرى');
    }
  } catch(e){ showToast('تعذر الاتصال بالخادم'); }
  btn.disabled = false;
  btn.textContent = originalText;
}

loadPassport();
</script>
</body>
</html>
