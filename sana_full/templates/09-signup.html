<!DOCTYPE html>
{% from '_sana-mark.html' import sana_mark %}
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% include '_csrf-fetch.html' %}
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F5F6FB">
<title>سنع — إنشاء حساب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html{ color-scheme: light; background:#F5F6FB; }
  :root{
    --navy:#0B132B; --teal:#0EA5A5; --teal-light:#E1F5F5;
    --gold:#F2B233; --paper:#F5F6FB; --ink:#333940; --slate:#6E7580; --line:#DEE1EC; --red-risk:#B23A2E;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{
    background:var(--paper); color:var(--ink); font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  .mark{ width:36px; height:36px; margin-bottom:18px; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:32px 28px; max-width:380px; width:100%; }
  h1{ font-size:19px; font-weight:600; color:var(--navy); margin-bottom:6px; text-align:center; }
  .sub{ font-size:12.5px; color:var(--slate); text-align:center; margin-bottom:26px; line-height:1.7; }
  label{ display:block; font-size:12.5px; font-weight:600; color:var(--navy); margin-bottom:6px; }
  .hint{ font-size:11px; color:var(--slate); margin:-12px 0 16px; }
  input{
    width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:8px; font-family:inherit;
    font-size:13.5px; margin-bottom:6px; background:#F9FAFC;
  }
  input:focus{ outline:none; border-color:var(--teal); background:#fff; }
  .btn{
    width:100%; padding:12px; border:none; border-radius:8px; background:var(--navy); color:#fff;
    font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; transition:opacity .15s; margin-top:10px;
  }
  .btn:hover{ opacity:.9; }
  .btn:disabled{ opacity:.6; cursor:not-allowed; }
  .error{ display:none; background:#FCEBEA; color:var(--red-risk); font-size:12.5px; padding:10px 12px; border-radius:8px; margin-bottom:16px; }
  .error.show{ display:block; }
  .error a{ color:var(--red-risk); font-weight:700; text-decoration:underline; }
  .foot{ text-align:center; margin-top:20px; font-size:12.5px; color:var(--slate); }
  .foot a{ color:var(--teal); font-weight:600; text-decoration:none; }
</style>
</head>
<body>

  {{ sana_mark(size=36, class_name='mark', decorative=true, stroke_width=9) }}

  <div class="card">
    <h1>أنشئ حساب شركتك</h1>
    <div class="sub">ابدأ الآن واحفظ معلومات عملك في مكان واحد.</div>

    <div class="error" id="errorMsg"></div>

    <label for="email">البريد الإلكتروني</label>
    <input type="email" id="email" autocomplete="username" placeholder="بريدك الإلكتروني">

    <label for="password">كلمة المرور</label>
    <input type="password" id="password" autocomplete="new-password" placeholder="8 أحرف على الأقل">

    <label for="referralSource">من أين سمعت عنا؟ <span style="font-weight:400; color:var(--slate);">(اختياري)</span></label>
    <input type="text" id="referralSource" placeholder="مثال: توصية من صديق">

    <button class="btn" id="submitBtn" onclick="doSignup()">إنشاء الحساب</button>

    <div class="foot">لديك حساب بالفعل؟ <a href="/login">سجّل الدخول</a></div>
  </div>

<script>
async function doSignup(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const referral_source = document.getElementById('referralSource').value.trim();
  const errorMsg = document.getElementById('errorMsg');
  const btn = document.getElementById('submitBtn');
  errorMsg.classList.remove('show');

  if(!email || !password){
    errorMsg.textContent = 'البريد الإلكتروني وكلمة المرور مطلوبان.';
    errorMsg.classList.add('show');
    return;
  }
  if(password.length < 8){
    errorMsg.textContent = 'كلمة المرور يجب أن تكون 8 أحرف على الأقل.';
    errorMsg.classList.add('show');
    return;
  }

  btn.disabled = true;
   btn.textContent = 'جارٍ إنشاء الحساب...';
  try{
    const res = await fetch('/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, referral_source })
    });
    const json = await res.json();
    if(res.ok && json.success){
      window.location.href = json.data.redirect || '/home';
    } else {
      if(json.error === 'EMAIL_TAKEN'){
        errorMsg.innerHTML = 'هذا البريد مسجَّل مسبقًا. <a href="/login">سجّل الدخول بدلًا من ذلك</a>';
      } else {
        errorMsg.textContent = json.message || 'تعذّر إنشاء الحساب.';
      }
      errorMsg.classList.add('show');
      btn.disabled = false;
       btn.textContent = 'إنشاء الحساب';
    }
  } catch(e){
    errorMsg.textContent = 'تعذّر الاتصال بالخادم، حاول مرة أخرى.';
    errorMsg.classList.add('show');
    btn.disabled = false;
     btn.textContent = 'إنشاء الحساب';
  }
}
</script>

</body>
</html>
