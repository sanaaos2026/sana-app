<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">{% include '_csrf-fetch.html' %}
<title>سنع — فرصة تحسين</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F5F6FB;color:#333940;font-family:'IBM Plex Sans Arabic';padding:40px 20px}.wrap{max-width:620px;margin:auto}.card{background:#fff;border:1px solid #DEE1EC;border-radius:14px;padding:24px}h1{color:#0B132B}label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #DEE1EC;border-radius:8px;font-family:inherit}.btn{width:100%;margin-top:18px;padding:12px;background:#0B132B;color:#fff;border:0;border-radius:8px;font-family:inherit;font-weight:700}.error{color:#B23A2E;font-size:12px;margin-top:8px}</style></head>
<body><div class="wrap"><a href="/home" style="color:#6E7580;text-decoration:none">← اليوم</a><h1>افتح فرصة تحسين واحدة</h1><p>نبدأ بما تلاحظه فعلًا، ثم نحدد ما ينقصنا قبل القرار والخطوة التالية.</p><div class="card">
<label>عنوان الموضوع</label><input id="title"><label>وش عرفنا أو لاحظت؟</label><textarea id="problem" rows="4"></textarea><label>الأصل المتأثر</label><select id="asset"><option value="">اختر أصلًا</option></select><label>معلومة تدعم ملاحظتك (اختياري)</label><textarea id="evidence" rows="3"></textarea><button class="btn" onclick="createCase()">ابدأ التشخيص</button><div id="error" class="error"></div></div></div>
<script>const COMPANY_ID={{ company_id|tojson }},field=id=>document.getElementById(id);fetch(`/api/companies/${COMPANY_ID}/summary`).then(r=>r.json()).then(j=>j.data.assets.forEach(a=>field('asset').add(new Option(a.client_asset_name,a.asset_id))));
async function createCase(){const b={case_title:field('title').value.trim(),declared_problem:field('problem').value.trim(),related_asset_id:field('asset').value,supporting_evidence:field('evidence').value.trim()},errorBox=field('error');if(!b.case_title||!b.declared_problem||!b.related_asset_id){errorBox.textContent='أكمل العنوان والملاحظة والأصل.';return}const r=await fetch(`/api/companies/${COMPANY_ID}/cases`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),j=await r.json();if(r.ok&&j.success)location.href=`/case/${j.data.case_id}/result`;else errorBox.textContent='تعذر بدء التشخيص.'}</script></body></html>
