[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116.0",
    "flask>=3.1.3",
    "flask-wtf>=1.3.0",
    "google-auth>=2.57.0",
    "gunicorn>=26.2.0",
    "playwright>=1.61.0",
    "psycopg2-binary>=2.9.12",
    "requests>=2.34.2",
    "resend>=2.42.0",
    "weasyprint>=69.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The repository is a workspace, not an installable Python package. The
# deployment image still builds the root project before installing
# sana_full/requirements.txt, so discovery must be disabled explicitly.
packages = []
py-modules = []
